</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<script>
const DEFAULT_SYNC_URL='https://script.google.com/macros/s/AKfycbwr3utIlkimCQcJln2Gug7D0XOypnazzboyFiv5oZFFOf_Hk_XGyhKm9G2sx0Su1LU/exec';
function getSyncUrl(){ try{ const c=localStorage.getItem('custom_sync_url'); if(c && c.startsWith('http')) return c; }catch(e){} return DEFAULT_SYNC_URL; }
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j);if(isNaN(j)||j<=0||j>24)return 0;return TUL_MAP[j]||j*1.5}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}catch{}return s}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t}
const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
const ALIAS_MAP={'kuncoro budi':'Budi','budi kuncoro':'Budi','kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya'};
function toCanonical(nama){let low=String(nama||'').trim().toLowerCase(); if(ALIAS_MAP[low]) return ALIAS_MAP[low]; if(low.includes('kuncoro')) return 'Budi'; for(let c of DEFAULT_KARYAWAN_AWAL){ if(low===c.nama.toLowerCase()) return c.nama; } return nama; }
function getKaryawanList(){
  try{
    const c=localStorage.getItem('custom_karyawan');
    if(c){ let arr=JSON.parse(c); if(Array.isArray(arr)&&arr.length>0){ let map={}; DEFAULT_KARYAWAN_AWAL.forEach(k=>{ map[k.nama.toLowerCase()]={nama:k.nama, tglLahir:''}; }); arr.forEach(item=>{ let raw=(item.nama||'').trim(); if(!raw) return; let can=toCanonical(raw); let key=can.toLowerCase(); if(!map[key]) map[key]={nama:can, tglLahir:item.tglLahir||''}; else { if(item.tglLahir && !map[key].tglLahir) map[key].tglLahir=item.tglLahir; map[key].nama=can; } }); let res=Object.values(map).sort((a,b)=>a.nama.localeCompare(b.nama)); localStorage.setItem('custom_karyawan', JSON.stringify(res)); return res; } }
  }catch(e){}
  return DEFAULT_KARYAWAN_AWAL.slice().sort((a,b)=>a.nama.localeCompare(b.nama));
}
function getCustomMemberPass(){ try{ return JSON.parse(localStorage.getItem('custom_member_pass')||'{}'); }catch{ return {}; } }
function getCustomMemberTgl(){ try{ return JSON.parse(localStorage.getItem('custom_member_tgl')||'{}'); }catch{ return {}; } }
let filterBulan=String(new Date().getMonth()+1); let allData=[]; let forceDaftar=true;
function toast(m){try{const t=document.createElement('div');t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-full text-[12px] z-50';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}catch{}}
function jsonp(url){return new Promise((resolve,reject)=>{try{const cb='cb_'+Date.now()+Math.floor(Math.random()*1000); window[cb]=(d)=>{ delete window[cb]; document.getElementById(cb)?.remove(); resolve(d); }; const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now(); s.onerror=()=>{ delete window[cb]; s.remove(); reject(new Error('offline')); }; document.body.appendChild(s); setTimeout(()=>{ try{delete window[cb]; document.getElementById(cb)?.remove();}catch{} reject(new Error('timeout')); }, 8000);}catch(e){reject(e);}});}
async function fetchData(){
  try{
    const j=await jsonp(getSyncUrl()+'?action=read');
    if(Array.isArray(j)){
      let raw=j.map(r=>{let jam=Number(r.jam||0); return {tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:jam,tul:calcTUL(jam)};}).filter(x=>x.nama && x.jam>0);
      allData=raw; try{ localStorage.setItem('cache_lembur', JSON.stringify(allData)); }catch{}
    }
  }catch(e){ try{const c=localStorage.getItem('cache_lembur'); if(c){ allData=JSON.parse(c);} }catch{} }
  allData.sort((a,b)=>{ try{ let pa=a.tanggalNorm.split('-'), pb=b.tanggalNorm.split('-'); let da=new Date(pa[0],pa[1]-1,pa[2]), db=new Date(pb[0],pb[1]-1,pb[2]); return da-db; }catch{return 0;}}); render();
}
function filteredDataMember(){
  const memberName=localStorage.getItem('member_name')||'';
  if(!memberName) return [];
  let d=allData.filter(r=> r.nama.toLowerCase()===memberName.toLowerCase() || toCanonical(r.nama).toLowerCase()===memberName.toLowerCase());
  if(filterBulan!=='all'){ d=d.filter(r=>{ try{ return Number(r.tanggalNorm.split('-')[1])===Number(filterBulan);}catch{return true;}}); }
  return d;
}
function groupByTanggal(data){ const map={}; data.forEach(r=>{ const k=r.tanggalNorm||r.tanggal; if(!map[k]) map[k]={tanggal:k, rows:[]}; map[k].rows.push(r); }); return Object.values(map).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)); }
function daftarAnggota(){
  const namaRaw=(document.getElementById('regNama').value||'').trim();
  const tgl=(document.getElementById('regTgl').value||'').trim();
  const pass=(document.getElementById('regPass').value||'').trim();
  const konf=(document.getElementById('regKonf').value||'').trim();
  const err=document.getElementById('regErr');
  if(!namaRaw||!tgl||!pass||!konf){ err.innerText='Lengkapi semua'; return; }
  if(!/^\d{2}-\d{2}-\d{4}$/.test(tgl)){ err.innerText='Format DD-MM-YYYY'; return; }
  if(pass!==konf){ err.innerText='Password tidak cocok'; return; }
  let namaFinal=toCanonical(namaRaw);
  let list=getKaryawanList(); let found=list.find(k=>k.nama.toLowerCase()===namaFinal.toLowerCase());
  if(!found){ list.push({nama:namaFinal, tglLahir:tgl}); } else { found.tglLahir=tgl; }
  localStorage.setItem('custom_karyawan', JSON.stringify(list));
  let passMap=getCustomMemberPass(); passMap[namaFinal]=pass; localStorage.setItem('custom_member_pass', JSON.stringify(passMap));
  let tglMap=getCustomMemberTgl(); tglMap[namaFinal]=tgl; localStorage.setItem('custom_member_tgl', JSON.stringify(tglMap));
  localStorage.setItem('has_registered','1'); localStorage.setItem('member_name', namaFinal); localStorage.setItem('member_login','1');
  try{ const url = getSyncUrl() + '?action=saveMember&nama=' + encodeURIComponent(namaFinal) + '&tgl=' + encodeURIComponent(tgl) + '&v=' + Date.now(); const img = new Image(); img.src = url; }catch(e){}
  toast('Daftar berhasil'); render(); fetchData();
}
function loginMember(){
  const sel=document.getElementById('memberSelect'); const pass=(document.getElementById('memberPass').value||'').trim();
  const nama=sel.value; const passMap=getCustomMemberPass();
  if((passMap[nama]||passMap[nama.toLowerCase()])!==pass){ document.getElementById('aerr').innerText='Password salah'; return; }
  localStorage.setItem('member_name', nama); localStorage.setItem('member_login','1'); localStorage.setItem('has_registered','1');
  render(); fetchData();
}
function logoutMember(){ localStorage.removeItem('member_login'); localStorage.removeItem('member_name'); render(); }
function showDaftar(){ localStorage.setItem('force_daftar','1'); localStorage.removeItem('clicked_login'); render(); }
function showLogin(){ localStorage.setItem('clicked_login','1'); localStorage.removeItem('force_daftar'); render(); }
function render(){
  const hasMember=!!localStorage.getItem('has_registered') || Object.keys(getCustomMemberPass()).length>0;
  const memberNameStored=localStorage.getItem('member_name');
  const forceVal=localStorage.getItem('force_daftar');
  if(forceVal==='1') forceDaftar=true; else if(forceVal==='0') forceDaftar=false;
  if(!hasMember||!memberNameStored){
    const showLoginPage = forceVal==='0' && hasMember;
    if(!showLoginPage){
      document.getElementById('app').innerHTML=`<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm border shadow-sm"><div class="text-center mb-5"><div class="w-10 h-10 rounded-full bg-slate-900 mx-auto grid place-items-center text-white font-bold">EF</div><div class="font-semibold text-[15px] mt-3">Daftar</div></div><div class="space-y-3"><input id="regNama" type="text" placeholder="Nama" class="w-full h-11 rounded-[10px] border px-3 text-[13px]"><input id="regTgl" type="text" placeholder="DD-MM-YYYY" class="w-full h-11 rounded-[10px] border px-3 text-[13px]"><input id="regPass" type="password" placeholder="Password" class="w-full h-11 rounded-[10px] border px-3 text-[13px]"><input id="regKonf" type="password" placeholder="Konfirmasi Password" class="w-full h-11 rounded-[10px] border px-3 text-[13px]"><div id="regErr" class="text-[11px] text-red-500"></div><button onclick="daftarAnggota()" class="w-full h-11 rounded-[10px] bg-slate-900 text-white font-semibold text-[13px]">Daftar</button><button onclick="showLogin()" class="w-full h-11 rounded-[10px] bg-white border-2 border-slate-900 text-[13px] font-semibold mt-2">Login</button></div></div></div>`;
      return;
    } else {
      const list=getKaryawanList();
      document.getElementById('app').innerHTML=`<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm border shadow-sm"><div class="text-center mb-5"><div class="font-bold text-[15px]">Login</div></div><select id="memberSelect" class="w-full h-11 rounded-[10px] border px-3 text-[13px] mb-3">${list.map(k=>`<option value="${k.nama}">${k.nama}</option>`).join('')}</select><input id="memberPass" type="password" placeholder="Password" class="w-full h-11 rounded-[10px] border px-3 text-[13px] mb-3"><div id="aerr" class="text-[11px] text-red-500 mb-2"></div><button onclick="loginMember()" class="w-full h-11 rounded-[10px] bg-slate-900 text-white font-semibold text-[13px]">Masuk</button><button onclick="showDaftar()" class="w-full h-11 rounded-[10px] bg-white border-2 border-slate-900 text-[13px] font-semibold mt-3">Daftar</button></div></div>`;
      return;
    }
  }
  const memberName=localStorage.getItem('member_name')||''; const data=filteredDataMember(); const banner=bannerHariBesarHtml(); try{ setTimeout(()=>{ const b=document.getElementById('bannerArea'); if(b) b.innerHTML=banner; applyTemaHariRaya(); }, 50); }catch(e){}  const grouped=groupByTanggal(data); const totalTUL=data.reduce((s,r)=>s+Number(r.tul||0),0);
  document.getElementById('app').innerHTML=`
    <div class="sticky top-0 z-20 px-4 py-3.5 flex justify-between items-center text-white" style="background:#0e7490"><div><div class="font-bold text-[14px]">AREA EF</div><div class="text-[10px] opacity-80">${totalTUL} TUL • ${memberName}</div></div><button onclick="logoutMember()" class="h-8 px-3.5 rounded-full bg-black text-white text-[11px]">Keluar</button></div>
    <div class="p-3 space-y-3 max-w-md mx-auto">
      <div id="bannerArea" class="space-y-2"></div>
      <div class="bg-white border rounded-[14px] p-3 flex justify-between items-center"><div class="text-[11px] font-medium">Filter Bulan</div><select onchange="filterBulan=this.value;render()" class="h-8 rounded-full bg-slate-50 border px-3 text-[12px]"><option value="all" ${filterBulan==='all'?'selected':''}>Semua</option><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">Mei</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Agu</option><option value="9">Sep</option><option value="10">Okt</option><option value="11">Nov</option><option value="12">Des</option></select></div>
      ${grouped.length===0?`<div class="bg-white border rounded-[14px] p-8 text-center"><div class="text-[12px]">Belum ada data</div></div>`:
      grouped.map(g=>`<div class="bg-white border rounded-[14px] overflow-hidden"><div class="px-4 py-2.5 border-b flex justify-between bg-slate-50"><div class="text-[12px] font-bold">${formatTanggal(g.tanggal)}</div><div class="text-[11px]">${g.rows.reduce((s,r)=>s+r.tul,0)} TUL</div></div><div class="divide-y">${g.rows.map(r=>`<div class="px-4 py-2.5"><div class="text-[12px]">${r.jam} jam</div><div class="text-[10px] text-slate-500">${r.tul} TUL</div></div>`).join('')}</div></div>`).join('')}
    </div>
  `;
}
fetchData();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
