</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AREA EF Anggota Lite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#fff;color:#111}
.h{position:sticky;top:0;background:#0e7490;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
.btn{height:30px;padding:0 12px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:11px}
.btn-b{background:#111;color:#fff;border-color:#111}
.bar{padding:10px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:8px;background:#fff}
.sel{height:30px;border-radius:20px;border:1px solid #e2e8f0;padding:0 10px;background:#f8fafc;font-size:12px}
.big{font-size:48px;font-weight:800;line-height:1}
.card{padding:14px;border-top:1px solid #f1f5f9}
.login{height:100vh;display:grid;place-items:center;padding:20px}
.inp{width:100%;height:42px;border:0;border-bottom:2px solid #111;font-size:14px;outline:0;margin-top:14px}
.lbtn{width:100%;height:42px;background:#111;color:#fff;border-radius:22px;border:0;margin-top:12px;font-weight:700;font-size:12px}
.lbtn2{width:100%;height:42px;background:#fff;color:#111;border:1px solid #111;border-radius:22px;margin-top:8px;font-weight:700;font-size:12px}

</style></head><body><div id="a"></div>
<script>
const URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const TUL={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};const calc=j=>TUL[j]||j*1.5;
const norm=t=>{let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];s=s.replace('Z','');let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s;}
const fmt=t=>{let p=norm(t).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:t;}
function j(u){return new Promise((r,jo)=>{let c='cb'+Date.now();window[c]=d=>{delete window[c];document.getElementById(c)?.remove();r(d);};let s=document.createElement('script');s.id=c;s.src=u+'&callback='+c+'&_='+Date.now();s.onerror=()=>{delete window[c];s.remove();jo();};document.body.appendChild(s);});}
let all=[],filter=localStorage.getItem('fa')||'all',member=localStorage.getItem('member_name')||'',isLogin=!!localStorage.getItem('member_login');
function toast(m){let t=document.createElement('div');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;font-size:11px;z-index:99';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
async function load(){try{let d=await j(URL+'?action=read');if(Array.isArray(d)){all=d.map(x=>{let jn=Number(x.jam||0);if(![2,3,4,6,7,8].includes(jn))return null;let t=norm(x.tanggal);return{tanggal:t,nama:String(x.nama||'').trim(),jam:jn,tul:calc(jn)}}).filter(Boolean);localStorage.setItem('c',JSON.stringify(all));}}catch{}render();}
function filt(){let d=all;if(member)d=d.filter(r=>r.nama.toLowerCase()===member.toLowerCase());if(filter!=='all')d=d.filter(r=>Number(r.tanggal.split('-')[1])===Number(filter));return d;}
function group(d){let m={};d.forEach(r=>{if(!m[r.tanggal])m[r.tanggal]=[];m[r.tanggal].push(r);});return Object.keys(m).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:m[k]}));}
function daftar(){
 let n=document.getElementById('namaLengkap').value.trim(),t=document.getElementById('tglLahir').value.trim();
 if(!n)return toast('Isi nama');if(!t)return toast('Isi tgl lahir DD-MM-YYYY');
 document.getElementById('e').innerText='Daftar ke sheet member...';
 j(URL+'?action=addmember&nama='+encodeURIComponent(n)+'&tglLahir='+encodeURIComponent(t)+'&password='+encodeURIComponent(t)).then(r=>{if(r&&r.ok){toast('Daftar ok');document.getElementById('e').innerText='Berhasil daftar, login pakai nama saja';document.getElementById('loginNama').value=n;}else document.getElementById('e').innerText='Gagal';}).catch(()=>document.getElementById('e').innerText='Gagal konek');
}
function login(){
 let n=document.getElementById('loginNama').value.trim();if(!n)return toast('Isi nama');
 document.getElementById('e2').innerText='Cek sheet member...';
 j(URL+'?action=checkmember&nama='+encodeURIComponent(n)).then(chk=>{if(chk&&chk.exists){localStorage.setItem('member_name',n);localStorage.setItem('member_login','1');member=n;isLogin=true;toast('Login '+n);render();load();}else{document.getElementById('e2').innerText='Nama kosong di member, harus daftar dulu (nama+tgl lahir)';toast('Harus daftar');}}).catch(()=>document.getElementById('e2').innerText='Gagal cek');
}
function logout(){localStorage.removeItem('member_login');isLogin=false;render();}
function setF(v){filter=v;localStorage.setItem('fa',v);render();}
function render(){
 let a=document.getElementById('a');
 if(!isLogin){
  a.innerHTML=`<div class=login><div style="max-width:320px;width:100%">
   <div style="font-size:10px;letter-spacing:.3em;color:#94a3b8">AREA EF - ANGGOTA LITE</div>
   <div style="font-weight:800;font-size:18px;margin-top:6px">Daftar: nama + tgl lahir</div>
   <div style="font-size:11px;color:#94a3b8;margin-top:2px">Data masuk ke sheet 'member'</div>
   <div style="margin-top:16px;padding:12px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc">
     <input id=namaLengkap placeholder="Nama lengkap" class=inp>
     <input id=tglLahir placeholder="Tgl lahir DD-MM-YYYY" class=inp>
     <div id=e style="font-size:11px;color:red;margin-top:6px"></div>
     <button onclick=daftar() class=lbtn>Daftar ke Member</button>
   </div>
   <div style="margin-top:12px;padding:12px;border:1px solid #111;border-radius:12px">
     <div style="font-size:12px;font-weight:700">Login cukup nama saja</div>
     <input id=loginNama placeholder="Nama lengkap saja" class=inp>
     <div id=e2 style="font-size:11px;color:red;margin-top:6px"></div>
     <button onclick=login() class=lbtn2>Login</button>
   </div>
   <div style="font-size:10px;color:#aaa;margin-top:10px;text-align:center">Versi lite 5KB anti lag</div>
  </div></div>`;return;
 }
 let d=filt(),gg=group(d),tot=d.reduce((s,r)=>s+r.tul,0);
 let h='<div class=h><b>AREA EF</b><div style="display:flex;gap:8px;align-items:center"><span style="font-size:11px">'+member+'</span><button onclick=logout() class=btn>Keluar</button></div></div>';
 h+='<div class=bar><select onchange=setF(this.value) class=sel><option value=all '+(filter==='all'?'selected':'')+'>Semua Bulan</option><option value=10 '+(filter==='10'?'selected':'')+'>Okt</option><option value=11 '+(filter==='11'?'selected':'')+'>Nov</option><option value=12 '+(filter==='12'?'selected':'')+'>Des</option></select><button onclick=load() class=btn>Refresh</button><span style="font-size:11px;color:#94a3b8;margin-left:auto">'+d.length+' data</span></div>';
 h+='<div style="max-width:560px;margin:0 auto"><div style="padding:20px 16px"><div class=big>'+tot+'</div><div style="font-size:10px;letter-spacing:.2em;color:#94a3b8">TOTAL TUL • '+member.toUpperCase()+'</div></div>';
 if(gg.length===0)h+='<div class=empty>TIDAK ADA DATA<br>Filter:'+filter+' • Total:'+all.length+'</div>';
 else gg.slice(0,20).forEach(x=>{h+='<div class=card><div style="font-size:11px;color:#94a3b8;font-weight:700">'+fmt(x.tanggal)+'</div>';x.rows.forEach(r=>{h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #f8fafc;font-size:13px"><span>'+r.jam+'j</span><b>'+r.tul+' TUL</b></div>'});h+='</div>';});
 h+='</div>';a.innerHTML=h;
}
load();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
