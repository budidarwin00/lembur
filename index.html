<script>
const DEFAULT_SYNC_URL='https://script.google.com/macros/s/AKfycbzUWTx3o5DjsfrM7JTZBbnYYaMBzFLbH3-mfs0dCFm1uOGouvDqCBpc3KOgNPgKNoHL/exec';
function getSyncUrl(){ try{ const cs=localStorage.getItem('custom_sync_url'); if(cs && cs.includes('script.google.com')){ if(cs.includes('AKfycbwr3utIlkimCQcJln2Gug7D0XOypnazzboyFiv5oZFFOf_Hk_XGyhKm9G2sx0Su1LU')){ localStorage.removeItem('custom_sync_url'); return DEFAULT_SYNC_URL; } if(cs.startsWith('http')) return cs; } }catch(e){} return DEFAULT_SYNC_URL; }
const SYNC_URL=getSyncUrl();
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+Math.floor(Math.random()*1000); window[cb]=(d)=>{delete window[cb]; document.getElementById(cb)?.remove(); resolve(d);}; const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now()+Math.random(); s.onerror=()=>{delete window[cb]; s.remove(); reject(new Error('Offline'));}; document.body.appendChild(s);});}
function isJamValid(j){ j=Number(j); return !isNaN(j) && j>0 && j<=24; }
function parseTglSort(t){ if(!t) return 0; let p=String(t).split(/[-/]/); if(p.length!==3) return 0; let d=Number(p[0]),m=Number(p[1]),y=Number(p[2]); return new Date(y,m-1,d).getTime(); }
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j);if(isNaN(j)||j<=0||j>24)return 0;return TUL_MAP[j]||j*1.5}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}catch{}return s}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t}
function normNama(n){return String(n||'').trim().toLowerCase()}
const ALIAS_NAMA={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normalisasiNamaAnggota(nama){if(!nama)return'';let raw=String(nama).trim();let key=raw.toLowerCase();if(ALIAS_NAMA[key])return ALIAS_NAMA[key];for(let k in ALIAS_NAMA){if(key.includes(k))return ALIAS_NAMA[k];}return raw.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').trim();}
const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function dedupKaryawanList(arr){const map={};const out=[];for(let k of arr){if(!k||!k.nama)continue;let norm=normalisasiNamaAnggota(k.nama);if(!norm)continue;let key=norm.toLowerCase();if(!map[key]){map[key]=true;out.push({nama:norm,tglLahir:k.tglLahir||''});}}return out.sort((a,b)=>a.nama.localeCompare(b.nama));}
function getKaryawanList(){try{const c=localStorage.getItem('custom_karyawan');if(c){let arr=JSON.parse(c);if(Array.isArray(arr)&&arr.length>0){return dedupKaryawanList(arr);}}}catch{}return dedupKaryawanList(DEFAULT_KARYAWAN_AWAL.slice());}
let allData=[];let memberName=localStorage.getItem('member_name')||'';let filterBulan=String(new Date().getMonth()+1);let forceDaftar=false;
function getCustomMemberPass(){try{return JSON.parse(localStorage.getItem('custom_member_pass')||'{}')}catch{return{}}}
function getCustomMemberTgl(){try{return JSON.parse(localStorage.getItem('custom_member_tgl')||'{}')}catch{return{}}}
function saveCustomMemberPass(m){try{localStorage.setItem('custom_member_pass',JSON.stringify(m))}catch{}}
function getMemberPass(nama){const c=getCustomMemberPass();if(c[nama])return c[nama];const member=getKaryawanList().find(k=>k.nama===nama);if(member&&member.tglLahir)return member.tglLahir.replace(/-/g,'');return '1234'}
function setMemberPass(nama,p){const m=getCustomMemberPass();m[nama]=p;saveCustomMemberPass(m)}
function toast(msg){const t=document.createElement('div');t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-[11px] px-5 py-2.5 rounded-full z-[99]';t.innerText=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}

// === HARI RAYA & ULTAH ===
const HARI_BESAR_TETAP=[
 {tgl:'01-01',nama:'Tahun Baru',ucapan:'Semoga tahun baru membawa kebahagiaan.',tema:'emas', icon:'✨'},
 {tgl:'21-04',nama:'Hari Kartini',ucapan:'Habis gelap terbitlah terang.',tema:'emas', icon:'🌸'},
 {tgl:'17-08',nama:'Hari Kemerdekaan RI',ucapan:'Dirgahayu Republik Indonesia',tema:'kemerdekaan', icon:'🇮🇩'},
 {tgl:'01-10',nama:'Hari Kesaktian Pancasila',ucapan:'Pancasila sakti perekat persatuan.',tema:'merah', icon:'🛡️'},
 {tgl:'02-10',nama:'Hari Batik Nasional',ucapan:'Bangga berkain batik warisan budaya.',tema:'batik', icon:'🦚'},
 {tgl:'28-10',nama:'Hari Sumpah Pemuda',ucapan:'Satu nusa, satu bangsa, satu bahasa.',tema:'merah', icon:'🔥'},
 {tgl:'10-11',nama:'Hari Pahlawan',ucapan:'Menghargai jasa pahlawan.',tema:'merah', icon:'🎖️'},
 {tgl:'25-12',nama:'Hari Raya Natal',ucapan:'Damai di hati, damai di bumi.',tema:'natal', icon:'🎄'}
];
const HARI_RAYA_VAR=[
 {dari:'17-02-2026',sampai:'17-02-2026',nama:'Tahun Baru Imlek',ucapan:'Gong xi fa cai.',tema:'imlek', icon:'🧧'},
 {dari:'19-03-2026',sampai:'22-03-2026',nama:'Idul Fitri 1447 H',ucapan:'Minal aidin wal faizin.',tema:'idulfitri', icon:'🌙'},
 {dari:'26-05-2026',sampai:'28-05-2026',nama:'Idul Adha',ucapan:'Semangat berkurban.',tema:'idadha', icon:'🕋'}
];
function getUltahHariIni(){
  try{
    const list=getKaryawanList();
    const tglMap=getCustomMemberTgl();
    const now=new Date();
    const dd=String(now.getDate()).padStart(2,'0');
    const mm=String(now.getMonth()+1).padStart(2,'0');
    const ultah=[];
    for(let k of list){
      let tgl=k.tglLahir || tglMap[k.nama] || '';
      if(!tgl) continue;
      let d='', m='';
      let t=String(tgl).trim();
      if(t.includes('-')){
        let p=t.split('-');
        if(p.length===3){
          if(p[0].length===4){ m=p[1].padStart(2,'0'); d=p[2].padStart(2,'0'); }
          else{ d=p[0].padStart(2,'0'); m=p[1].padStart(2,'0'); }
        }
      }
      if(d===dd && m===mm){
        let y=0;
        try{
          let parts=String(tgl).split('-');
          let year=parts[2] && parts[2].length===4 ? Number(parts[2]) : (parts[0].length===4 ? Number(parts[0]) : 0);
          if(year>0) y=now.getFullYear()-year;
        }catch(e){}
        ultah.push({nama:k.nama, tgl:tgl, umur:y});
      }
    }
    return ultah;
  }catch(e){ return []; }
}
function getTemaUltah(nama, umur){
  return {nama:'Ulang Tahun '+nama+'!', ucapan: umur>0 ? 'Selamat ulang tahun ke-'+umur+'! 🎉' : 'Selamat ulang tahun '+nama+'! 🎂', tema:'ultah', icon:'🎂', umur:umur};
}
function hariBesarHariIni(){
  const now=new Date(); now.setHours(0,0,0,0); const hasil=[];
  HARI_BESAR_TETAP.forEach(h=>{
    const p=h.tgl.split('-');
    for(const y of [now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1]){
      const d=new Date(y,+p[1]-1,+p[0]); d.setHours(0,0,0,0);
      const diff=Math.round((now-d)/86400000);
      if(diff>=-2 && diff<=1){ hasil.push({h:h,diff:diff}); break; }
    }
  });
  HARI_RAYA_VAR.forEach(h=>{
    const P=s=>{const a=s.split('-');const d=new Date(+a[2],+a[1]-1,+a[0]);d.setHours(0,0,0,0);return d;};
    const dari=P(h.dari), sampai=P(h.sampai);
    const dariX=new Date(dari); dariX.setDate(dariX.getDate()-2);
    const sampaiX=new Date(sampai); sampaiX.setDate(sampaiX.getDate()+1);
    if(now>=dariX&&now<=sampaiX){
      let diff=0;
      if(now<dari) diff=Math.round((now-dari)/86400000);
      else if(now>sampai) diff=Math.round((now-sampai)/86400000);
      if(diff>=-2 && diff<=1){ hasil.push({h:h,diff:diff}); }
    }
  });
  return hasil;
}
function getTemaAktif(){
  try{
    const ultahList=getUltahHariIni();
    if(ultahList.length){
      const u=ultahList[0];
      const temaU=getTemaUltah(u.nama, u.umur);
      return {tema:temaU.tema, icon:temaU.icon, pernak:['🎂','🎉'], nama:temaU.nama, h:temaU, isUltah:true, ultah:ultahList};
    }
    const daftar=hariBesarHariIni();
    if(daftar.length){
      let aktif=daftar[0];
      if(Math.abs(aktif.diff)<=2){
        return {tema:aktif.h.tema, icon:aktif.h.icon, pernak:[aktif.h.icon], nama:aktif.h.nama, h:aktif.h, isHariBesar:true, daftar:daftar};
      }
    }
    return {tema:'', icon:'', pernak:[], nama:'', h:{}};
  }catch(e){ return {tema:'', icon:'', pernak:[], h:{}}; }
}
function applyTemaHariRaya(){
  try{
    const aktif=getTemaAktif();
    document.body.className=document.body.className.replace(/tema-[^\s]+/g,'').trim();
    if(aktif.tema) document.body.classList.add('tema-'+aktif.tema);
    renderPernakPernik(aktif);
    return aktif;
  }catch(e){ return null; }
}
function renderPernakPernik(aktif){
  const cont=document.getElementById('pernakPernik'); if(!cont) return; cont.innerHTML=''; if(!aktif || !aktif.pernak || !aktif.pernak.length) return;
  const emojis=aktif.pernak;
  for(let i=0;i<6;i++){ const el=document.createElement('div'); el.className='pernak'; el.innerText=emojis[i%emojis.length]; el.style.left=(5+Math.random()*90)+'vw'; el.style.animationDuration=(6+Math.random()*4)+'s'; el.style.animationDelay=Math.random()*3+'s'; el.style.top='-20px'; cont.appendChild(el); }
}
function bannerHariBesarHtml(){
  try{
    const aktif=getTemaAktif();
    let html='';
    if(aktif && aktif.ultah && aktif.ultah.length){
      html+=aktif.ultah.map(u=>{
        const temaU=getTemaUltah(u.nama, u.umur);
        return '<div class="mx-6 mt-6 mb-2 ultah-minimal bg-white rounded-[12px] px-4 py-3 flex gap-3 items-center"><div class="w-8 h-8 rounded-full bg-black text-white grid place-items-center text-[14px]">🎂</div><div class="flex-1"><div class="mono text-[11px] tracking-[0.1em] font-medium text-black">'+temaU.nama.toUpperCase()+'</div><div class="text-[11px] text-slate-500 mt-0.5">'+temaU.ucapan+'</div></div></div>';
      }).join('');
    }
    if(aktif && aktif.daftar && aktif.daftar.length){
      html+=aktif.daftar.map(it=>{
        const isToday=it.diff===0;
        return '<div class="mx-6 mt-6 mb-2 hb-minimal bg-white rounded-[12px] px-4 py-3 flex gap-3 items-center"><div class="w-8 h-8 rounded-full bg-black text-white grid place-items-center text-[14px]">'+(it.h.icon||'🎉')+'</div><div class="flex-1"><div class="flex items-center gap-2"><div class="mono text-[11px] tracking-[0.1em] font-medium text-black">'+it.h.nama.toUpperCase()+'</div>'+(isToday?'<span class="text-[8px] bg-black text-white px-2 py-0.5 rounded-full">HARI INI</span>':'')+'</div><div class="text-[11px] text-slate-500 mt-0.5">'+it.h.ucapan+'</div></div></div>';
      }).join('');
    }
    return html;
  }catch(e){ return ''; }
}
function daftarAnggota(){
  let nama=normalisasiNamaAnggota((document.getElementById('regNama').value||'').trim());
  const tgl=(document.getElementById('regTgl').value||'').trim();
  const pass=(document.getElementById('regPass').value||'').trim();
  const konf=(document.getElementById('regKonf').value||'').trim();
  const err=document.getElementById('regErr');
  if(!nama){err.innerText='Nama wajib';return}
  if(!tgl){err.innerText='Tanggal lahir wajib';return}
  if(!pass){err.innerText='Password wajib';return}
  if(pass!==konf){err.innerText='Password tidak sama';return}
  const custom=getCustomMemberPass();if(custom[nama]){err.innerText='Nama sudah terdaftar';return}
  setMemberPass(nama,pass);
  localStorage.setItem('has_registered','1');localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama);
  toast('Daftar berhasil');render();
}
function loginMember(){
  let nama=normalisasiNamaAnggota((document.getElementById('memberSelect').value||'').trim());
  const pass=(document.getElementById('memberPass').value||'').trim();
  const err=document.getElementById('aerr');
  const custom=getCustomMemberPass();let valid=false;
  for(let k in custom){if(normalisasiNamaAnggota(k).toLowerCase()===nama.toLowerCase() && custom[k]===pass){valid=true;break;}}
  if(!valid && custom[nama]===pass) valid=true;
  if(!valid && (pass===getMemberPass(nama) || pass==='anggota123')) valid=true;
  if(!valid){err.innerText='Password salah';return}
  localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama);localStorage.setItem('has_registered','1');fetchData();
}
function logoutMember(){localStorage.removeItem('member_login');localStorage.removeItem('member_name');render()}
function showLogin(){forceDaftar=false;localStorage.setItem('force_daftar','0');render()}
function showDaftar(){forceDaftar=true;localStorage.setItem('force_daftar','1');render()}
function filteredDataMember(){
  let d=allData;
  if(filterBulan!=='all'){d=d.filter(r=>Number((r.tanggalNorm||r.tanggal).split('-')[1])===Number(filterBulan))}
  if(memberName){d=d.filter(r=>normalisasiNamaAnggota(r.nama).toLowerCase()===normalisasiNamaAnggota(memberName).toLowerCase())}
  return d;
}
function groupByTanggal(data){const map={};data.forEach(r=>{const key=r.tanggalNorm||r.tanggal;if(!map[key])map[key]=[];map[key].push(r)});return Object.keys(map).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:map[k]}))}
async function fetchData(){
  render();
  // coba cache dulu biar tidak 0
  try{
    const cc=localStorage.getItem('cache_lembur');
    if(cc && allData.length===0){
      const j=JSON.parse(cc);
      if(Array.isArray(j) && j.length>0){
        allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal||r.tanggalNorm),nama:normalisasiNamaAnggota(r.nama||r.nik||''),jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama&&isJamValid(x.jam));
        render();
      }
    }
  }catch(e){}
  try{
    // pakai jsonp read seperti admin
    const j=await jsonp(getSyncUrl()+'?action=read&_nocache='+Date.now());
    if(Array.isArray(j)){
      let mapped=j.map(r=>{let jam=Number(r.jam||0); if(!isJamValid(jam)) return null; let norm=normalisasiNamaAnggota(r.nama||r.nik||''); return {tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:norm,jam:jam,tul:calcTUL(jam)};}).filter(x=>x && x.nama && x.jam>0);
      const dedupMap={}; const deduped=[];
      mapped.forEach(r=>{ const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!dedupMap[key]){ dedupMap[key]=true; deduped.push(r); } });
      allData=deduped;
      try{ localStorage.setItem('cache_lembur', JSON.stringify(allData)); }catch{}
    } else if(j && j.data && Array.isArray(j.data)){
      let mapped=j.data.map(r=>{let jam=Number(r.jam||0); return{tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:normalisasiNamaAnggota(r.nama||''),jam:jam,tul:calcTUL(jam)}}).filter(x=>x.nama&&x.jam>0);
      const dedupMap={}; const deduped=[];
      mapped.forEach(r=>{ const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!dedupMap[key]){ dedupMap[key]=true; deduped.push(r); } });
      allData=deduped;
      try{ localStorage.setItem('cache_lembur', JSON.stringify(allData)); }catch{}
    }
    render();
  }catch(e){
    console.log('fetch error', e);
    // fallback fetch biasa
    try{
      const res=await fetch(getSyncUrl()+'?action=read&_='+Date.now()); const json=await res.json(); let raw=json.data||json;
      if(Array.isArray(raw)){
        let mapped=raw.map(r=>{let jam=Number(r.jam||0);return{tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:normalisasiNamaAnggota(r.nama||''),jam:jam,tul:calcTUL(jam)}}).filter(x=>x.nama&&x.jam>0);
        const dedupMap={}; const deduped=[];
        mapped.forEach(r=>{ const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!dedupMap[key]){ dedupMap[key]=true; deduped.push(r); } });
        allData=deduped;
        try{ localStorage.setItem('cache_lembur', JSON.stringify(allData)); }catch{}
      }
    }catch(e2){}
    render();
  }
}
function exportPDF(){
  try{
    const data=filteredDataMember(); const grouped=groupByTanggal(data); const totalTUL=data.reduce((s,r)=>s+Number(r.tul||0),0);
    const mName=localStorage.getItem('member_name')||'';
    const bulanLabels=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const bulan=filterBulan==='all'?'Semua Bulan':(bulanLabels[Number(filterBulan)]||filterBulan);
    let html='<html><head><meta charset="UTF-8"><title>Export TUL '+mName+'</title><style>body{font-family:Inter,sans-serif;padding:40px;color:#000}h1{font-size:28px;font-weight:300;margin:0}.sub{font-size:11px;color:#999;margin-top:6px;letter-spacing:0.15em}.total{font-size:52px;font-weight:300;margin-top:24px;letter-spacing:-0.03em}.meta{margin-top:20px;border-top:1px solid #eee;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:#888}.group{margin-top:32px}.date{font-size:11px;color:#666;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:14px}.mono{font-family:monospace}.footer{margin-top:48px;border-top:1px solid #eee;padding-top:16px;text-align:center;font-size:9px;color:#bbb;letter-spacing:0.2em}</style></head><body>';
    html+='<h1>'+mName+'</h1><div class="sub">AREA EF • LAPORAN LEMBUR</div><div class="total">'+totalTUL+' TUL</div><div class="meta"><span>Filter: '+bulan+'</span><span>'+new Date().toLocaleDateString('id-ID')+'</span></div>';
