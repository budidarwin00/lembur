const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};

function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return `${p[2]}-${p[1]}-${p[0]}`;return t;}
let cur=JSON.parse(localStorage.getItem('karyawan_login')||'null');
let allData=[];let fB=String(new Date().getMonth()+1);let fT='2026';

async function fetchData(){try{const j=await jsonp(SYNC_URL+'?action=read');if(Array.isArray(j)){let raw=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama);const m=new Map();raw.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${r.nama.toLowerCase()}`;if(!m.has(k))m.set(k,r);});allData=Array.from(m.values());}}catch(e){}render();}
function login(){const nama=document.getElementById('nama').value.trim();const pass=document.getElementById('pass').value.trim();if(!nama||!pass){document.getElementById('err').innerText='Isi nama & pass';return;}cur={nama:nama,pass:pass};localStorage.setItem('karyawan_login',JSON.stringify(cur));fetchData();}
function logout(){localStorage.removeItem('karyawan_login');cur=null;render();}
function fData(){if(!cur)return[];let d=allData.filter(x=>x.nama.toLowerCase()===cur.nama.toLowerCase());const mm=new Map();d.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${r.nama.toLowerCase()}`;if(!mm.has(k))mm.set(k,r);});d=Array.from(mm.values());if(fB!=='all'){d=d.filter(x=>{const m=(x.tanggalNorm).split('-')[1];return String(parseInt(m))===String(parseInt(fB));});}if(fT!=='all'){d=d.filter(x=>{const y=(x.tanggalNorm).split('-')[0];return String(y)===fT;});}return d;}
