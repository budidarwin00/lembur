</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AREA EF - Anggota</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#fff;color:#111}
.h{position:sticky;top:0;background:#0e7490;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;z-index:10}

.lbtn2{width:100%;height:42px;background:#fff;color:#111;border:1px solid #111;border-radius:22px;margin-top:16px;font-weight:700;font-size:13px}
.card{padding:12px;border-top:1px solid #f1f5f9}

<script>
const URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const TUL={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};const calc=j=>TUL[j]||j*1.5;
const norm=t=>{let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];s=s.replace('Z','');let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s;}
const fmt=t=>{let p=norm(t).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:t;}
function normTgl(s){
 s=String(s).trim().replace(/\s+/g,'').replace(/\//g,'-');
 if(/^[0-9]{6}$/.test(s)){let d=s.slice(0,2),m=s.slice(2,4),y=s.slice(4,6);let yy=parseInt(y,10);let yyyy=yy<=30?2000+yy:1900+yy;return d+'-'+m+'-'+yyyy;}
 if(/^[0-9]{8}$/.test(s)) return s.slice(0,2)+'-'+s.slice(2,4)+'-'+s.slice(4,8);
 let m=s.match(/(\d{1,2})-(\d{1,2})-(\d{4})/);if(m) return m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[3];
 let m2=s.match(/(\d{1,2})-(\d{1,2})-(\d{2})$/);if(m2){let d=m2[1].padStart(2,'0'),mo=m2[2].padStart(2,'0'),yy=parseInt(m2[3],10);let yyyy=yy<=30?2000+yy:1900+yy;return d+'-'+mo+'-'+yyyy;}
 return s;
}
let membersCache=[];
const ALIAS={'kuncoro budi':'Budi','budi kuncoro':'Budi','kuncoro':'Budi','neli':'Nely','adit':'Aditya','aditya zozo':'Aditya','ahmad fauzi':'Fauzi','fauzi ahmad':'Fauzi'};
function normNama(n){
 if(!n) return '';
 let raw=String(n).trim();if(!raw) return '';
 let k=raw.toLowerCase();
 if(ALIAS[k]) return ALIAS[k];
 for(let a in ALIAS){if(k.includes(a)) return ALIAS[a];}
 if(membersCache.length>0){
  for(let m of membersCache){
   let shortName=(m.nama||'').toLowerCase();if(!shortName) continue;
   if(k.includes(shortName) || shortName.includes(k)) return m.nama;
  }
 }
 let parts=raw.split(/\s+/).filter(Boolean);
 if(parts.length>=2){
  let last=parts[parts.length-1];if(last.length<3 && parts.length>=2) last=parts[0];
  return last.charAt(0).toUpperCase()+last.slice(1).toLowerCase();
 }
 return raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
}
async function loadMembersCache(){
 try{let d=await j(URL+'?action=listmembers'); if(d&&d.members){membersCache=d.members;}}catch{}
}
function j(u){return new Promise((r,jo)=>{let c='cb'+Date.now()+Math.random().toString(36).slice(2);window[c]=d=>{delete window[c];document.getElementById(c)?.remove();r(d);};let s=document.createElement('script');s.id=c;s.src=u+'&callback='+c+'&_='+Date.now();s.onerror=()=>{delete window[c];s.remove();jo();};document.body.appendChild(s);});}
let all=[],filter=localStorage.getItem('fa')||'all',member=localStorage.getItem('member_name')||'',isLogin=!!localStorage.getItem('member_login');
function toast(m){let t=document.createElement('div');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:6px 12px;border-radius:16px;font-size:11px;z-index:99';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
async function load(){await loadMembersCache();try{let d=await j(URL+'?action=read');if(Array.isArray(d)){all=d.map(x=>{let jn=Number(x.jam||0);if(![2,3,4,6,7,8].includes(jn))return null;let t=norm(x.tanggal);return{tanggal:t,nama:normNama(x.nama),jam:jn,tul:calc(jn)}}).filter(Boolean);}}catch{}render();}
function filt(){let d=all;if(member)d=d.filter(r=>r.nama.toLowerCase()===normNama(member).toLowerCase());if(filter!=='all')d=d.filter(r=>Number(r.tanggal.split('-')[1])===Number(filter));return d;}
function group(d){let m={};d.forEach(r=>{if(!m[r.tanggal])m[r.tanggal]=[];m[r.tanggal].push(r);});return Object.keys(m).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:m[k]}));}
function daftar(){
 let fullName=document.getElementById('namaLengkap').value.trim();
 let shortName=normNama(fullName);
 let t=normTgl(document.getElementById('tglLahir').value.trim());
 if(!fullName){toast('Isi Nama');return;}
 if(!t){toast('Isi Tanggal lahir');return;}
 document.getElementById('e').innerText='Mendaftar...';
 j(URL+'?action=addmember&nama='+encodeURIComponent(fullName)+'&tglLahir='+encodeURIComponent(t)+'&password='+encodeURIComponent(t)).then(r=>{
  if(r&&r.ok){
    let namaAnggota=r.nama||shortName;
    localStorage.setItem('member_name',namaAnggota);
    localStorage.setItem('member_login','1');
    member=namaAnggota;isLogin=true;render();load();
  } else {
    if(r&&r.exists){
      document.getElementById('e').innerText='Nama anggota sudah ada ('+ (r.nama||'') +'), tidak bisa daftar lagi.';
    } else {
      document.getElementById('e').innerText=(r&&r.error)||'nama belum terdaftar,harap daftar untuk login';
    }
  }
 }).catch(()=>document.getElementById('e').innerText='Gagal konek');
}
function login(){
 let sel=document.getElementById('loginNama');
 let n=sel?sel.value.trim():'';
 if(!n){document.getElementById('e2').innerText='nama belum terdaftar,harap daftar untuk login';return;}
 n=normNama(n);
 document.getElementById('e2').innerText='Mengecek...';
 j(URL+'?action=checkmember&nama='+encodeURIComponent(n)).then(chk=>{
  if(chk&&chk.exists){
    localStorage.setItem('member_name',chk.nama||n);
    localStorage.setItem('member_login','1');
    member=chk.nama||n;isLogin=true;render();load();
  }else{
   j(URL+'?action=listmembers').then(r=>{
    if(r&&r.members){
     let f=r.members.find(m=>{let mn=normNama(m.nama||'').toLowerCase();let inp=n.toLowerCase();return mn===inp||mn.includes(inp)||inp.includes(mn);});
     if(f){localStorage.setItem('member_name',f.nama);localStorage.setItem('member_login','1');member=f.nama;isLogin=true;render();load();return;}
    }
    document.getElementById('e2').innerText='nama belum terdaftar,harap daftar untuk login';
   }).catch(()=>document.getElementById('e2').innerText='nama belum terdaftar,harap daftar untuk login');
  }
 }).catch(()=>document.getElementById('e2').innerText='nama belum terdaftar,harap daftar untuk login');
}
function exportPDF(){
 let d=filt();let tot=d.reduce((s,r)=>s+r.tul,0);let w=window.open('','_blank');
 let html='<html><head><title>AREA EF - '+member+'</title><style>body{font-family:system-ui;padding:20px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #ddd;padding:8px;font-size:12px;text-align:left}th{background:#f1f5f9}</style></head><body>';
 html+='<h1>AREA EF - '+member+'</h1><h2>Total: '+tot+' | Jumlah: '+d.length+'</h2><table><tr><th>Tanggal</th><th>Jam</th><th>TUL</th></tr>';
 d.forEach(r=>{html+='<tr><td>'+fmt(r.tanggal)+'</td><td>'+r.jam+'j</td><td>'+r.tul+'</td></tr>';});
 html+='</table><br><button onclick=window.print() style="padding:8px 16px;background:#111;color:#fff;border:0;border-radius:8px">Cetak PDF</button></body></html>';
 w.document.write(html);w.document.close();
}
function logout(){localStorage.removeItem('member_login');isLogin=false;render();}
function setF(v){filter=v;localStorage.setItem('fa',v);render();}
function render(){
 let a=document.getElementById('a');
 if(!isLogin){
  let opts='<option value="">Nama</option>';
  membersCache.forEach(m=>{
    let nm=m.nama||''; if(!nm) return;
    opts+=`<option value="${nm}">${nm}</option>`;
  });
  if(membersCache.length===0) opts='<option value="">Nama</option>';
  a.innerHTML=`<div class=login><div class=box>
   <div class=title>AREA EF</div>
   <div class=section-title>Daftar</div>
   <span class=lbl>Nama</span>
   <input id=namaLengkap placeholder="Nama" class=inp>
   <span class=lbl>Tanggal lahir</span>
   <input id=tglLahir placeholder="DDMMYY" class=inp inputmode=numeric>
   <div id=e style="font-size:11px;color:#e11d48;margin-top:6px"></div>
   <button onclick=daftar() class=lbtn>Daftar</button>
   <div class=section-title style="margin-top:20px">Login</div>
   <span class=lbl>Nama</span>
   <select id=loginNama class=inp>${opts}</select>
   <div id=e2 style="font-size:11px;color:#e11d48;margin-top:6px"></div>
   <button onclick=login() class=lbtn2>Masuk</button>
  </div></div>`;
  return;
 }
 let d=filt(),gg=group(d),tot=d.reduce((s,r)=>s+r.tul,0);
 let h='<div class=h><b>AREA EF</b><div><span style="font-size:11px;margin-right:8px">'+member+'</span><button onclick=logout() class=btn>Keluar</button></div></div>';
 h+='<div style="padding:8px 12px;display:flex;gap:6px;background:#fff;border-bottom:1px solid #f1f5f9;flex-wrap:wrap"><select onchange=setF(this.value) class=sel><option value=all '+(filter==='all'?'selected':'')+'>Semua Bulan</option><option value=1 '+(filter==='1'?'selected':'')+'>Jan</option><option value=2 '+(filter==='2'?'selected':'')+'>Feb</option><option value=3 '+(filter==='3'?'selected':'')+'>Mar</option><option value=4 '+(filter==='4'?'selected':'')+'>Apr</option><option value=5 '+(filter==='5'?'selected':'')+'>Mei</option><option value=6 '+(filter==='6'?'selected':'')+'>Jun</option><option value=7 '+(filter==='7'?'selected':'')+'>Jul</option><option value=8 '+(filter==='8'?'selected':'')+'>Agu</option><option value=9 '+(filter==='9'?'selected':'')+'>Sep</option><option value=10 '+(filter==='10'?'selected':'')+'>Okt</option><option value=11 '+(filter==='11'?'selected':'')+'>Nov</option><option value=12 '+(filter==='12'?'selected':'')+'>Des</option></select><button onclick=exportPDF() class=btn style="background:#111;color:#fff">Export PDF</button></div>';
 h+='<div style="max-width:560px;margin:0 auto"><div style="padding:16px"><div style="font-size:42px;font-weight:800">'+tot+'</div><div style="font-size:10px;color:#94a3b8">TOTAL TUL</div></div>';
 if(gg.length===0)h+='<div style="padding:30px;text-align:center;color:#94a3b8;font-size:11px">Tidak ada data</div>';
 else gg.slice(0,20).forEach(x=>{h+='<div class=card><div style="font-size:10px;color:#94a3b8;font-weight:700">'+fmt(x.tanggal)+'</div>';x.rows.forEach(r=>{h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #f8fafc;font-size:12px"><span>'+r.jam+'j</span><b>'+r.tul+'</b></div>'});h+='</div>';});
 h+='</div>';a.innerHTML=h;
}
load();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
