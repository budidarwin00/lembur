const ALIAS_NAMA={
  'kuncoro budi':'Budi',
  'kuncoro':'Budi',
  'budi kuncoro':'Budi',
  'neli':'Nely',
  'nely':'Nely',
  'annisa':'Anisa',
  'aditya zozo':'Aditya',
  'adit':'Aditya',
  'dozen':'Dozen',
  'supri':'Supriyadi',
  'topik':'Topik',
  'zaelani':'Zaelani',
  'aaf':'Aaf'
};
function normalisasiNamaAnggota(nama){
  if(!nama) return '';
  let raw=String(nama).trim();
  let key=raw.toLowerCase();
  if(ALIAS_NAMA[key]) return ALIAS_NAMA[key];
  // if contains alias
  for(let k in ALIAS_NAMA){
    if(key.includes(k)){
      return ALIAS_NAMA[k];
    }
  }
  // Title case
  return raw.split(' ').map(w=> w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').trim();
}

const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function dedupKaryawanList(arr){
  const map={}; const out=[];
  for(let k of arr){
    if(!k || !k.nama) continue;
    let norm=normalisasiNamaAnggota(k.nama);
    if(!norm) continue;
    let key=norm.toLowerCase();
    if(!key) continue;
    if(!map[key]){
      map[key]=true;
      out.push({nama:norm, tglLahir:k.tglLahir||''});
    } else {
      let existing=out.find(x=>x.nama.toLowerCase()===key);
      if(existing && !existing.tglLahir && k.tglLahir) existing.tglLahir=k.tglLahir;
    }
  }
  return out.sort((a,b)=>a.nama.localeCompare(b.nama));
}
function getKaryawanList(){
  try{
    const c=localStorage.getItem('custom_karyawan');
    if(c){
      let arr=JSON.parse(c);
      if(Array.isArray(arr)&&arr.length>0){
        let dedup=dedupKaryawanList(arr);
        // auto save deduped if different
        if(dedup.length!==arr.length){
          try{ localStorage.setItem('custom_karyawan', JSON.stringify(dedup)); }catch{}
        }
        return dedup;
      }
    }
  }catch{}
  return dedupKaryawanList(DEFAULT_KARYAWAN_AWAL.slice());
}

function migrasiAliasPass(){
  try{
    let passMap=getCustomMemberPass();
    let tglMap=getCustomMemberTgl();
    let changed=false;
    let newPass={};
    let newTgl={};
    for(let k in passMap){
      let norm=normalisasiNamaAnggota(k);
      if(!newPass[norm]){ newPass[norm]=passMap[k]; } 
      else { changed=true; } // duplicate
      if(k!==norm) changed=true;
    }
    for(let k in tglMap){
      let norm=normalisasiNamaAnggota(k);
      if(!newTgl[norm]){ newTgl[norm]=tglMap[k]; }
      if(k!==norm) changed=true;
    }
    if(changed){
      localStorage.setItem('custom_member_pass', JSON.stringify(newPass));
      localStorage.setItem('custom_member_tgl', JSON.stringify(newTgl));
      console.log('Migrasi alias pass:', newPass);
    }
  }catch(e){}
}

function getUltahHariIni(){
  try{
    const list=getKaryawanList();
    const pass=getCustomMemberPass();
    const tglMap=getCustomMemberTgl();
    const now=new Date();
    const dd=String(now.getDate()).padStart(2,'0');
    const mm=String(now.getMonth()+1).padStart(2,'0');
    const ultah=[];
    for(let k of list){
      let tgl=k.tglLahir || tglMap[k.nama] || '';
      if(!tgl) continue;
      let d='', m='';
      let t=String(tgl).trim();
      if(t.includes('-')){
        let p=t.split('-');
        if(p.length===3){
          if(p[0].length===4){ m=p[1].padStart(2,'0'); d=p[2].padStart(2,'0'); }
          else{ d=p[0].padStart(2,'0'); m=p[1].padStart(2,'0'); }
        }
      }
      if(d===dd && m===mm){
        let y=0;
        try{
          let parts=String(tgl).split('-');
          let year=parts[2] && parts[2].length===4 ? Number(parts[2]) : (parts[0].length===4 ? Number(parts[0]) : 0);
          if(year>0) y=now.getFullYear()-year;
        }catch(e){}
        ultah.push({nama:k.nama, tgl:tgl, umur:y});
      }
    }
    return ultah;
  }catch(e){ return []; }
}
function getTemaUltah(nama, umur){
  return {
    nama:'🎂 Ulang Tahun '+nama+'!',
    ucapan: umur>0 ? `Selamat ulang tahun ke-${umur}! Semoga sehat, bahagia & sukses selalu! 🎉` : `Selamat ulang tahun ${nama}! 🎂`,
    tema:'ultah', accent:'border-fuchsia-300', icon:'🎂', umur:umur
  };
}
function hariBesarHariIni(){
  const now=new Date(); now.setHours(0,0,0,0); const hasil=[];
  HARI_BESAR_TETAP.forEach(h=>{
    const p=h.tgl.split('-');
    for(const y of [now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1]){
      const d=new Date(y,+p[1]-1,+p[0]); d.setHours(0,0,0,0);
      const diff=Math.round((now-d)/86400000);
      if(diff>=-2 && diff<=1){ hasil.push({h:h,diff:diff}); break; }
    }
  });
  HARI_RAYA_VAR.forEach(h=>{
    const P=s=>{const a=s.split('-');const d=new Date(+a[2],+a[1]-1,+a[0]);d.setHours(0,0,0,0);return d;};
    const dari=P(h.dari), sampai=P(h.sampai);
    const dariX=new Date(dari); dariX.setDate(dariX.getDate()-2);
    const sampaiX=new Date(sampai); sampaiX.setDate(sampaiX.getDate()+1);
    if(now>=dariX&&now<=sampaiX){
      let diff=0;
      if(now<dari) diff=Math.round((now-dari)/86400000);
      else if(now>sampai) diff=Math.round((now-sampai)/86400000);
      if(diff>=-2 && diff<=1){ hasil.push({h:h,diff:diff}); }
    }
  });
  return hasil;
}
function getTemaAktif(){
  try{
    const ultahList=getUltahHariIni();
    if(ultahList.length){
      const u=ultahList[0];
      const temaU=getTemaUltah(u.nama, u.umur);
      return {tema:temaU.tema, icon:temaU.icon, pernak:['🎂','🎉','🎈','✨'], nama:temaU.nama, h:temaU, isUltah:true};
    }
    const daftar=hariBesarHariIni();
    if(daftar.length){
      let aktif=daftar[0];
      if(Math.abs(aktif.diff)<=2){
        return {tema:aktif.h.tema, icon:aktif.h.icon, pernak:[aktif.h.icon], nama:aktif.h.nama, h:aktif.h, isHariBesar:true};
      }
    }
    return {tema:'biru', icon:'📅', pernak:[], nama:'AREA EF', h:{}};
  }catch(e){ return {tema:'biru', icon:'📅', pernak:[], h:{}}; }
}
function applyTemaHariRaya(){

}

function toast(m){const t=document.createElement('div');t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-full text-[12px] font-medium z-50 shadow-lg';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+Math.floor(Math.random()*1000); window[cb]=(d)=>{delete window[cb]; document.getElementById(cb)?.remove(); resolve(d);}; const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now(); s.onerror=()=>{delete window[cb]; s.remove(); try{const c=localStorage.getItem('cache_lembur'); if(c){resolve(JSON.parse(c)); return;}}catch{} reject(new Error('Offline'));}; document.body.appendChild(s);});}
async function cekValidasiLoginServer(){
  try{
    const members=await jsonp(getSyncUrl()+'?action=readmembers');
    if(Array.isArray(members) && members.length===0){
      // Server kosong - admin reset - paksa logout semua
      console.log('Server Members kosong - admin reset detected');
      const curName=localStorage.getItem('member_name');
      if(curName){
        localStorage.removeItem('has_registered');
        localStorage.removeItem('member_name');
        localStorage.setItem('force_daftar','1');
        toast('⚠️ Login di-reset admin - daftar ulang');
        setTimeout(()=>render(),500);
        return false;
      }
    } else if(Array.isArray(members)){
      const curName=localStorage.getItem('member_name');
      if(curName){
        const found=members.some(m=> (m.nama||'').toLowerCase()===curName.toLowerCase());
        if(!found && members.length>0){
          // Member tidak ada di server - mungkin dihapus admin
          console.log('Member '+curName+' tidak ada di server');
          // Jangan auto logout kalau server masih ada data lain, cuma warning
        }
      }
    }
    return true;
  }catch(e){ return true; }
}

async function fetchData(){
  try{ await cekValidasiLoginServer(); }catch(e){}
  try{
    const j=await jsonp(getSyncUrl()+'?action=read');
    if(Array.isArray(j)){
      allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:normalisasiNamaAnggota(r.nama||r.nik),namaAsli:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama && x.jam>0);
    }
  }catch(e){ try{const c=localStorage.getItem('cache_lembur'); if(c){ const j=JSON.parse(c); allData=j; }}catch{} }
  render();
}
function filteredDataMember(){
  const memberName=localStorage.getItem('member_name')||'';
  const normMember=normalisasiNamaAnggota(memberName).toLowerCase();
  let d=allData.filter(r=> {
    let normR=normalisasiNamaAnggota(r.nama).toLowerCase();
    return normR===normMember;
  });
  if(filterBulan!=='all'){ d=d.filter(r=> Number(r.tanggalNorm.split('-')[1])===Number(filterBulan)); }
  return d;
}
function groupByTanggal(data){const m={}; data.forEach(r=>{if(!m[r.tanggalNorm]) m[r.tanggalNorm]={tanggal:r.tanggalNorm,rows:[]}; m[r.tanggalNorm].rows.push(r);}); return Object.values(m).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));}

function daftarAnggota(){
  let namaRaw=(document.getElementById('regNama').value||'').trim();
  const nama=normalisasiNamaAnggota(namaRaw);
  const tgl=(document.getElementById('regTgl').value||'').trim();
  const pass=(document.getElementById('regPass').value||'').trim();
  const konf=(document.getElementById('regKonf').value||'').trim();
  const errEl=document.getElementById('regErr');
  if(!nama||!tgl||!pass){ errEl.innerText='Lengkapi semua'; return; }
  if(!/^[A-Za-z ]{2,30}$/.test(nama)){ errEl.innerText='Nama hanya huruf'; return; }
  if(!/^\d{2}-\d{2}-\d{4}$/.test(tgl)){ errEl.innerText='Format tgl DD-MM-YYYY'; return; }
  if(pass.length<4){ errEl.innerText='Password min 4'; return; }
  if(pass!==konf){ errEl.innerText='Password tidak sama'; return; }
  const passMap=getCustomMemberPass();
  const tglMap=getCustomMemberTgl();
  if(passMap[nama]){ errEl.innerText='Nama sudah terdaftar'; return; }
  passMap[nama]=pass;
  tglMap[nama]=tgl;
  localStorage.setItem('custom_member_pass', JSON.stringify(passMap));
  localStorage.setItem('custom_member_tgl', JSON.stringify(tglMap));
  // Simpan ke custom_karyawan juga untuk ultah
  try{
    const list=getKaryawanList();
    const existing=list.find(k=>k.nama.toLowerCase()===nama.toLowerCase());
    if(!existing){ list.push({nama:nama, tglLahir:tgl}); localStorage.setItem('custom_karyawan', JSON.stringify(list)); }
    else{ existing.tglLahir=tgl; localStorage.setItem('custom_karyawan', JSON.stringify(list)); }
  }catch(e){}
  localStorage.setItem('has_registered','1');
  localStorage.setItem('member_name', nama);
  // SIMPAN KE SHEET Members - tanggal lahir
  try{
    fetch(getSyncUrl(),{method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({action:'savemember', nama:nama, tgl:tgl, tglLahir:tgl})}).then(r=>r.json()).then(j=>{ console.log('Saved to sheet Members:', j); }).catch(e=>{ console.log('Gagal save Members ke sheet', e); });
    // juga coba via GET jsonp sebagai fallback
    jsonp(getSyncUrl()+'?action=savemember&nama='+encodeURIComponent(nama)+'&tgl='+encodeURIComponent(tgl));
  }catch(e){ console.log('Error save member', e); }
  toast('✅ Daftar berhasil - tgl lahir tersimpan');
  render();
}
function loginMember(){
  const sel=document.getElementById('memberSelect');
  let nama=sel?sel.value:(localStorage.getItem('member_name')||'');
  nama=normalisasiNamaAnggota(nama);
  const pass=(document.getElementById('memberPass').value||'').trim();
  const passMap=getCustomMemberPass();
  // Cek semua key yang alias-nya sama dengan Budi (Budi, Kuncoro Budi, Kuncoro)
  let valid=false;
  let matchedKey='';
  for(let k in passMap){
    if(normalisasiNamaAnggota(k).toLowerCase()===nama.toLowerCase()){
      if(passMap[k]===pass){
        valid=true;
        matchedKey=k;
        break;
      }
    }
  }
  // Fallback: direct key
  if(!valid && passMap[nama]===pass){ valid=true; }
  if(valid){
    // migrasi: pastikan pass tersimpan sebagai Budi
    try{
      if(matchedKey && matchedKey!==nama){
        let np=getCustomMemberPass();
        np[nama]=pass;
        localStorage.setItem('custom_member_pass', JSON.stringify(np));
      }
    }catch(e){}
    localStorage.setItem('member_name', nama);
    localStorage.setItem('has_registered','1');
    render();
  }else{
    // debug: tampilkan berapa akun yang match
    let keys=[];
    for(let k in passMap){ if(normalisasiNamaAnggota(k).toLowerCase()===nama.toLowerCase()) keys.push(k); }
    document.getElementById('aerr').innerText='Password salah untuk '+nama+' (ada key: '+keys.join(', ')+')';
  }
}

function resetPasswordCurrent(){
  const sel=document.getElementById('memberSelect');
  let nama=sel?sel.value:(localStorage.getItem('member_name')||'');
  nama=normalisasiNamaAnggota(nama);
  if(!confirm('Reset password '+nama+' ? Akan hapus password lama.')) return;
  try{
    let pm=getCustomMemberPass();
    delete pm[nama];
    for(let k in pm){ if(normalisasiNamaAnggota(k).toLowerCase()===nama.toLowerCase()) delete pm[k]; }
    localStorage.setItem('custom_member_pass', JSON.stringify(pm));
    localStorage.setItem('custom_member_tgl', JSON.stringify({}));
    localStorage.removeItem('has_registered');
    localStorage.removeItem('member_name');
    toast('Password '+nama+' di-reset, silakan Daftar ulang');
    showDaftar();
  }catch(e){ toast('Gagal reset'); }
}
