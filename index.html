// Normalisasi nama: jika input mengandung namaList, map ke namaList
function normalizeNama(input){
  if(!input) return '';
  const lower = input.toLowerCase().trim();
  // cek exact dulu
  let exact = namaList.find(n=>n.toLowerCase()===lower);
  if(exact) return exact;
  // cek apakah input mengandung salah satu namaList
  for(let n of namaList){
    if(lower.includes(n.toLowerCase())) return n;
  }
  // cek apakah namaList mengandung input (misal ketik bud -> Budi)
  for(let n of namaList){
    if(n.toLowerCase().includes(lower)) return n;
  }
  // ambil kata pertama sebagai fallback jika kata pertama ada di list
  const first = lower.split(/\s+/)[0];
  let f = namaList.find(n=>n.toLowerCase()===first);
  if(f) return f;
  // jika tidak ketemu, kembalikan input asli dengan huruf depan kapital (biar admin tau)
  // tapi untuk validasi anggota kita tetap pakai hasil pencarian mengandung
  return input.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
function findAnggota(input){
  const norm = normalizeNama(input);
  return namaList.includes(norm) ? norm : null;
}

  if(!namaInput||!tglRaw||!pass){msgEl.innerText='Lengkapi Nama, Tgl Lahir, Password';return;}
  let tgl=tglRaw; if(tglRaw.includes('/')) tgl=tglRaw.replace(/\//g,'-');
  const parts=tgl.split('-'); if(parts.length===3 && parts[0].length<=2){tgl = parts[2]+'-'+parts[1].padStart(2,'0')+'-'+parts[0].padStart(2,'0');}
  
  const anggota = findAnggota(namaInput);
  if(!anggota){msgEl.innerText='Nama harus mengandung nama anggota. Contoh: Budi Santoso -> Budi';return;}
  const nama = anggota; // Budi santoso / Kuncoro Budi -> Budi
  
  let users=loadUsers(); if(users.find(u=>u.nama.toLowerCase()===nama.toLowerCase())){msgEl.innerText='Sudah terdaftar sebagai '+nama+', silakan Login';return;}
  const newUser={nama,tglLahir:tgl,pass,role:'anggota',created:new Date().toISOString(), namaInput:namaInput};
  users.push(newUser); saveUsers(users);
  msgEl.style.color='#64748B'; msgEl.innerText='Menyimpan...';
  fetch(WEBAPP_URL+'?action=daftar&nama='+encodeURIComponent(nama)+'&tglLahir='+encodeURIComponent(tgl)+'&pass='+encodeURIComponent(pass)+'&namaInput='+encodeURIComponent(namaInput))
    .then(r=>r.json()).then(d=>{
      msgEl.style.color='#10B981'; 
      if(d.ok||d.success) msgEl.innerText='Daftar berhasil! '+namaInput+' masuk ke '+nama+'. Tersimpan di Sheet.';
      else msgEl.innerText='Daftar berhasil! '+namaInput+' -> '+nama;
      setTimeout(()=>switchTab('login'),1500);
    }).catch(e=>{
      msgEl.style.color='#10B981'; msgEl.innerText='Daftar berhasil! '+namaInput+' -> '+nama+' (offline)';
      setTimeout(()=>switchTab('login'),1000);
    });
}
function doLogin(){
  const namaInput=document.getElementById('loginNama').value.trim();
  const pass=document.getElementById('loginPass').value;
  const msgEl=document.getElementById('loginMsg');
  if(!namaInput||!pass){msgEl.innerText='Isi Nama & Password';return;}
  const anggota = findAnggota(namaInput);
  const namaCek = anggota || normalizeNama(namaInput);
  msgEl.style.color='#64748B'; msgEl.innerText='Memeriksa...';
  fetch(WEBAPP_URL+'?action=checkUser&nama='+encodeURIComponent(namaCek)+'&pass='+encodeURIComponent(pass)+'&namaInput='+encodeURIComponent(namaInput))
    .then(r=>r.json()).then(d=>{
      if(d.ok||d.found||d.valid){
        let users=loadUsers();
        let u=users.find(x=>x.nama.toLowerCase()===namaCek.toLowerCase());
        if(!u){users.push({nama:d.nama||namaCek,tglLahir:d.tglLahir||'',pass,role:'anggota',created:new Date().toISOString(), namaInput:namaInput}); saveUsers(users);}
        currentUser={nama:d.nama||namaCek,role:'anggota'}; setSession(currentUser); showApp(); return;
      }
      let users=loadUsers();
      const u=users.find(x=>x.nama.toLowerCase()===namaCek.toLowerCase() && x.pass===pass) || users.find(x=>x.namaInput&&x.namaInput.toLowerCase()===namaInput.toLowerCase() && x.pass===pass);
      if(!u){msgEl.style.color='#EF4444'; msgEl.innerText='Belum daftar! '+namaInput+' tidak ada di Sheet. Daftar dulu sebagai '+ (anggota||namaCek); return;}
      currentUser={nama:u.nama,role:u.role}; setSession(currentUser); showApp();
    }).catch(e=>{
      let users=loadUsers();
      const u=users.find(x=>x.nama.toLowerCase()===namaCek.toLowerCase() && x.pass===pass) || users.find(x=>x.namaInput&&x.namaInput.toLowerCase()===namaInput.toLowerCase() && x.pass===pass);
      if(!u){msgEl.style.color='#EF4444'; msgEl.innerText='Belum daftar / offline. Daftar dulu.'; return;}
      currentUser={nama:u.nama,role:u.role}; setSession(currentUser); showApp();
    });
}
function doLogout(){
  // tanpa confirm biar tidak block di WebView
  try{ clearSession(); }catch(e){}
  currentUser=null;
  localStorage.removeItem('area_ef_session');
  const auth = document.getElementById('authScreen');
  const app = document.getElementById('appScreen');
  if(auth) { auth.style.display='flex'; auth.style.visibility='visible'; }
  if(app) { app.style.display='none'; }
  const ln = document.getElementById('loginNama'); if(ln) ln.value='';
  const lp = document.getElementById('loginPass'); if(lp) lp.value='';
  const msg = document.getElementById('loginMsg'); if(msg) { msg.innerText=''; }
  // paksa tampil login
  showAuth();
}

function initPanels(){
  document.getElementById('bPanel').innerHTML=bulanList.map(b=>`<button onclick="pilihB('${b}')">${b}</button>`).join('');
  document.getElementById('tPanel').innerHTML=tahunList.map(t=>`<button onclick="pilihT('${t}')">${t}</button>`).join('');
}
function closeAll(){['bPanel','tPanel','gpPanel'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';})}
function toggleB(){const p=document.getElementById('bPanel');const s=p.style.display!=='block';closeAll();p.style.display=s?'block':'none';}
function toggleT(){const p=document.getElementById('tPanel');const s=p.style.display!=='block';closeAll();p.style.display=s?'block':'none';}
function toggleGP(){const p=document.getElementById('gpPanel');const s=p.style.display!=='block';closeAll();if(s){p.style.display='block'; const inp=document.getElementById('gpInputHeader'); if(inp){inp.value=getGP(); inp.focus();} } else p.style.display='none';}
function pilihB(b){bulan=b;document.getElementById('bBtn').innerText=b;closeAll();renderAll();}
function pilihT(t){tahun=t;document.getElementById('tBtn').innerText=t;closeAll();renderAll();}
function getGP(){let v=localStorage.getItem('area_ef_gp_'+currentUser.nama); if(v===null||v==='') v=localStorage.getItem('area_ef_gp_global'); if(v===null||v==='') v='0'; let num=parseFloat(v); return isNaN(num)?0:num;}
function setGP(val){if(val===null||val==='') val='0'; localStorage.setItem('area_ef_gp_'+currentUser.nama, val); localStorage.setItem('area_ef_gp_global', val);}
function saveGPFromHeader(){const el=document.getElementById('gpInputHeader'); if(!el){alert('Isi GP dulu');return;} let val=el.value||'0'; setGP(val); closeAll(); renderAll(); setStatus('GP disimpan: Rp '+parseInt(val).toLocaleString('id-ID'));}
function fmtRupiah(n){return 'Rp '+Math.round(n).toLocaleString('id-ID');}
function hitung(){let total=0;riwayat.forEach(r=>{if(r.bulan===bulan && r.tahun===tahun && r.orang.includes(currentUser.nama)){total+=jamMap[r.jam]||0;}});return total;}
function renderAll(){
  const total=hitung();
  const gp=getGP();
  const nominal=total*gp/173;
  document.getElementById('totalList').innerHTML=`
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:56px;font-weight:900;letter-spacing:-.04em;line-height:1">${fmt(total)}</div>
      <div style="font-size:22px;font-weight:900;margin-top:4px;letter-spacing:.1em">TUL</div>
      <div style="margin-top:14px;background:#000;color:#fff;border-radius:12px;padding:14px">
        <div style="font-size:24px;font-weight:900;margin-top:6px">${fmtRupiah(nominal)}</div>
      </div>
    </div>
  `;
  let list=riwayat.filter(r=>r.bulan===bulan && r.tahun===tahun && r.orang.includes(currentUser.nama));
  if(list.length===0){document.getElementById('riwayatList').innerHTML=`<div class="empty">Belum ada riwayat untuk ${currentUser.nama} di ${bulan} ${tahun}</div>`;return}
  let html='';list.forEach(r=>{
    const jamReal=jamMap[r.jam]||0;
    const fmtJam=fmt(jamReal);
    const nom=jamReal*gp/173;
    html+=`<div class="riwayatCard"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:16px;font-weight:800">${r.tgl} ${r.bulan}-${r.jam}-${fmtJam} TUL</b><div style="font-size:11px;color:#64748B;margin-top:2px">${r.orang.length} orang • ${fmtJam} TUL • ${fmtRupiah(nom)}</div></div><div style="width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-weight:800">${r.jam}</div></div></div>`;
  });
  document.getElementById('riwayatList').innerHTML=html;
}

});
