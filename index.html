<html lang="id"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AREA EF - Anggota</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,sans-serif;background:#f8fafc;min-height:100vh}</style>
</head><body>
<div id="app"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbwr3utIlkimCQcJln2Gug7D0XOypnazzboyFiv5oZFFOf_Hk_XGyhKm9G2sx0Su1LU/exec';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j);if(isNaN(j)||j<=0)return 0;return TUL_MAP[j]||j*1.5;}
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.indexOf('T')>=0)s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch(e){}return s;}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t;}
const DEFAULT_KARYAWAN=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function getKaryawanList(){try{const c=localStorage.getItem('custom_karyawan');if(c){const a=JSON.parse(c);if(Array.isArray(a)&&a.length)return a;}}catch(e){}return DEFAULT_KARYAWAN.slice();}
function getPassMap(){try{const c=localStorage.getItem('custom_member_pass');if(c)return JSON.parse(c);}catch(e){}return {}}
function savePassMap(m){try{localStorage.setItem('custom_member_pass',JSON.stringify(m));}catch(e){}}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:99';document.body.appendChild(d);setTimeout(function(){d.remove();},2000);}

let allData=[];let isMemberLogin=false;let memberName='';let filterBulan=String(new Date().getMonth()+1);let forceDaftar=false;
try{isMemberLogin=!!localStorage.getItem('member_login');memberName=localStorage.getItem('member_name')||'';}catch(e){}

function showDaftar(){forceDaftar=true;try{localStorage.setItem('force_daftar','1');localStorage.removeItem('clicked_login');}catch(e){}render();}
function showLogin(){forceDaftar=false;try{localStorage.removeItem('force_daftar');localStorage.setItem('clicked_login','1');}catch(e){}render();}

function daftarAnggota(){
  const nama=document.getElementById('regNama').value.trim();
  const tgl=document.getElementById('regTgl').value.trim();
  const pass=document.getElementById('regPass').value.trim();
  const konf=document.getElementById('regKonf').value.trim();
  const err=document.getElementById('regErr');
  if(!nama||!tgl||!pass||!konf){err.textContent='Lengkapi semua';return}
  if(pass!==konf){err.textContent='Password tidak cocok';return}
  if(!/^\d{2}-\d{2}-\d{4}$/.test(tgl)){err.textContent='Format DD-MM-YYYY';return}
  const list=getKaryawanList();let found=null;for(let i=0;i<list.length;i++){if(list[i].nama.toLowerCase()===nama.toLowerCase()){found=list[i];break;}}
  if(!found){err.textContent='Nama tidak ada di daftar';return}
  const map=getPassMap();map[nama]=pass;savePassMap(map);
  try{localStorage.setItem('has_registered','1');localStorage.setItem('member_name',nama);localStorage.setItem('member_login','1');}catch(e){}
  isMemberLogin=true;memberName=nama;forceDaftar=false;try{localStorage.removeItem('force_daftar');localStorage.removeItem('clicked_login');}catch(e){}toast('Daftar berhasil');fetchData();
}
function loginMember(){
  const sel=document.getElementById('memberSelect');const passEl=document.getElementById('memberPass');const err=document.getElementById('aerr');
  const nama=sel.value.trim();const pass=passEl.value.trim();
  if(!pass){err.textContent='Isi password';return}
  const map=getPassMap();const expected=map[nama]||'1234';
  if(pass!==expected && pass!=='anggota123'){err.textContent='Password salah';return}
  try{localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama);}catch(e){}
  isMemberLogin=true;memberName=nama;fetchData();
}
function logoutMember(){try{localStorage.removeItem('member_login');localStorage.removeItem('member_name');}catch(e){}isMemberLogin=false;memberName='';render();}

async function fetchData(){
  render();
  try{
    const url=SYNC_URL+'?t='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    const json=await res.json();
    let data=json.data||json||[];
    if(!Array.isArray(data)) data=[];
    const normalized=[];
    for(let i=0;i<data.length;i++){
      const r=data[i];
      const t=r.tanggalNorm||r.tanggal||'';
      const tn=normalizeTanggal(t);
      let tul=r.tul;if(tul==null||tul==='')tul=calcTUL(r.jam);
      normalized.push({tanggal:t,tanggalNorm:tn||t,nama:String(r.nama||'').trim(),jam:Number(r.jam)||0,tul:Number(tul)||0});
    }
    allData=normalized;
    try{localStorage.setItem('lembur_data',JSON.stringify(allData));}catch(e){}
  }catch(e){
    try{const c=localStorage.getItem('lembur_data');if(c)allData=JSON.parse(c);}catch(e2){}
  }
  render();
}

function filteredData(){
  const map={};const dedup=[];
  for(let i=0;i<allData.length;i++){const r=allData[i];const key=(r.tanggalNorm||r.tanggal)+'|'+normNama(r.nama)+'|'+r.jam;if(!map[key]){map[key]=true;dedup.push(r);}}
  let d=dedup;
  if(isMemberLogin&&memberName){const f=[];for(let i=0;i<d.length;i++){if(normNama(d[i].nama)===normNama(memberName))f.push(d[i]);}d=f;}
  if(filterBulan!=='all'){const f=[];for(let i=0;i<d.length;i++){const t=d[i].tanggalNorm||d[i].tanggal||'';const p=t.split('-');if(Number(p[1])===Number(filterBulan))f.push(d[i]);}d=f;}
  return d;
}
function groupByTanggal(data){
  const map={};
  for(let i=0;i<data.length;i++){const r=data[i];const k=r.tanggalNorm||r.tanggal;if(!map[k])map[k]=[];map[k].push(r);}
  const keys=Object.keys(map).sort();
  const res=[];for(let i=0;i<keys.length;i++){res.push({tanggal:keys[i],rows:map[keys[i]]});}
  return res;
}
function exportPDF(){
  try{
    const data=filteredData();
    const grouped=groupByTanggal(data);
    let total=0;for(let i=0;i<data.length;i++)total+=Number(data[i].tul||0);
    const bulanNames={1:'Januari',2:'Februari',3:'Maret',4:'April',5:'Mei',6:'Juni',7:'Juli',8:'Agustus',9:'September',10:'Oktober',11:'November',12:'Desember'};
    const namaBulan=filterBulan==='all'?'Semua Bulan':bulanNames[Number(filterBulan)]||filterBulan;
    let html='<html><head><title>Rekap '+memberName+'</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:20px} h2{margin:0 0 6px} .meta{color:#666;font-size:11px;margin-bottom:12px} table{width:100%;border-collapse:collapse;margin-top:10px} th,td{border:1px solid #999;padding:6px;text-align:left} th{background:#eee} @media print{button{display:none}}</style></head><body>';
    html+='<h2>REKAP AREA EF - '+memberName+'</h2><div class="meta">Bulan: '+namaBulan+' | Total: '+total+' TUL | '+new Date().toLocaleDateString('id-ID')+'</div>';
    html+='<table><tr><th>Tanggal</th><th>Jam Lembur</th><th>TUL</th></tr>';
    for(let gi=0;gi<grouped.length;gi++){
      for(let ri=0;ri<grouped[gi].rows.length;ri++){
        const r=grouped[gi].rows[ri];
        html+='<tr><td>'+formatTanggal(r.tanggalNorm||r.tanggal)+'</td><td>'+r.jam+' jam</td><td>'+r.tul+'</td></tr>';
      }
    }
    html+='</table><div style="margin-top:12px;font-weight:bold">Total: '+total+' TUL</div>';
    html+='<div style="margin-top:20px"><button onclick="window.print()" style="padding:8px 16px;background:#111;color:#fff;border-radius:6px;border:0">Cetak / Save PDF</button> <button onclick="window.close()" style="padding:8px 16px">Tutup</button></div></body></html>';
    const w=window.open('','_blank');
    if(!w){alert('Popup diblokir! Izinkan popup');return;}
    w.document.open();w.document.write(html);w.document.close();w.focus();
    toast('PDF dibuka');
  }catch(e){alert('Export gagal: '+e.message);}
}

function render(){
  try{
    const app=document.getElementById('app');
    let hasMember=false;try{hasMember=!!localStorage.getItem('has_registered')||Object.keys(getPassMap()).length>0;}catch(e){}
    let storedName='';try{storedName=localStorage.getItem('member_name')||'';}catch(e){}
    let forceFlag=null;try{forceFlag=localStorage.getItem('force_daftar');}catch(e){}
    if(!hasMember || !storedName || !isMemberLogin){
      let showDaftarScreen=true;
      if(forceFlag==='1'){showDaftarScreen=true;}
      else{
        try{
          const clicked=localStorage.getItem('clicked_login');
          if(clicked==='1' && !forceDaftar){showDaftarScreen=false;}
          else if(!hasMember && clicked!=='1'){showDaftarScreen=true;}
          else{showDaftarScreen=forceDaftar;}
        }catch(e){showDaftarScreen=true;}
      }
      if(showDaftarScreen){
        app.innerHTML='<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm border shadow"><div class="text-center mb-4"><div class="w-10 h-10 rounded-full bg-slate-900 mx-auto grid place-items-center text-white font-bold">EF</div><div class="font-bold mt-2">Daftar Anggota</div></div><div class="space-y-2"><input id="regNama" placeholder="Nama sesuai daftar" class="w-full h-10 border rounded-lg px-3 text-[13px]"><input id="regTgl" placeholder="DD-MM-YYYY" class="w-full h-10 border rounded-lg px-3 text-[13px]"><input id="regPass" type="password" placeholder="Password" class="w-full h-10 border rounded-lg px-3 text-[13px]"><input id="regKonf" type="password" placeholder="Konfirmasi" class="w-full h-10 border rounded-lg px-3 text-[13px]"><div id="regErr" class="text-[11px] text-red-500"></div><button onclick="daftarAnggota()" class="w-full h-10 bg-slate-900 text-white rounded-lg text-[13px]">Daftar</button><button onclick="showLogin()" class="w-full h-8 text-[12px] underline">Sudah punya akun? Login</button></div></div></div>';
        return;
      }else{
        const list=getKaryawanList();let opts='';for(let i=0;i<list.length;i++){opts+='<option value="'+list[i].nama+'">'+list[i].nama+'</option>';}
        app.innerHTML='<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm border shadow"><div class="text-center mb-4"><div class="font-bold">Login Anggota</div></div><select id="memberSelect" class="w-full h-10 border rounded-lg px-3 text-[13px] mb-2">'+opts+'</select><input id="memberPass" type="password" placeholder="Password" class="w-full h-10 border rounded-lg px-3 text-[13px] mb-2"><div id="aerr" class="text-[11px] text-red-500 mb-2"></div><button onclick="loginMember()" class="w-full h-10 bg-slate-900 text-white rounded-lg text-[13px]">Masuk</button><button onclick="showDaftar()" class="w-full h-8 text-[12px] underline mt-2">Belum punya akun? Daftar</button></div></div>';
        return;
      }
    }
    const data=filteredData();const grouped=groupByTanggal(data);let total=0;for(let i=0;i<data.length;i++)total+=Number(data[i].tul||0);
    let html='<div class="bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0"><div><div class="font-bold text-[14px]">AREA EF - '+memberName+'</div><div class="text-[10px] text-slate-500">'+total+' TUL</div></div><button onclick="logoutMember()" class="h-8 px-3 bg-slate-900 text-white rounded-full text-[11px]">Keluar</button></div>';
    html+='<div class="p-3 space-y-3"><div class="bg-white border rounded-xl p-3 flex justify-between items-center"><div class="text-[11px]">Filter Bulan</div><select onchange="filterBulan=this.value;render()" class="h-8 border rounded-full px-3 text-[12px]"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select></div>';
    html+='<div class="flex gap-2"><button onclick="exportPDF()" class="w-full h-10 rounded-full bg-emerald-600 text-white text-[13px] font-medium">📄 Export PDF</button></div>';
    if(data.length===0){html+='<div class="bg-white border rounded-xl p-8 text-center"><div class="text-[20px]">📭</div><div class="text-[12px] mt-2">Belum ada data untuk '+memberName+'</div></div>';}
    else{
      for(let gi=0;gi<grouped.length;gi++){
        const g=grouped[gi];let sum=0;for(let j=0;j<g.rows.length;j++)sum+=Number(g.rows[j].tul||0);
        html+='<div class="bg-white border rounded-xl overflow-hidden mb-2"><div class="px-4 py-2.5 border-b flex justify-between bg-slate-50"><div class="text-[13px] font-bold">'+formatTanggal(g.tanggal)+'</div><div class="text-[13px] font-bold">'+sum+' TUL</div></div><div class="divide-y">';
        for(let r=0;r<g.rows.length;r++){
          const row=g.rows[r];
          html+='<div class="px-4 py-3 flex justify-between items-center"><div><div class="text-[13px] font-medium">'+row.jam+' jam lembur</div><div class="text-[11px] text-slate-500">'+row.tul+' TUL</div></div><div class="text-[14px] font-bold">'+row.tul+'</div></div>';
        }
        html+='</div></div>';
      }
    }
    html+='</div>';
    app.innerHTML=html;
  }catch(e){
    document.getElementById('app').innerHTML='<div class="p-4 text-red-500 text-[12px]">Error: '+e.message+'<pre>'+e.stack+'</pre><button onclick="localStorage.clear();location.reload()" class="mt-2 h-8 px-3 bg-slate-900 text-white rounded">Clear & Reload</button></div>';
  }
}
fetchData();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
