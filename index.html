function getKaryawanList(){
  const aliasMapLocal={'kuncoro budi':'Budi','kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya'};
  function normalizeToCanonical(nama){
    let low=String(nama||'').trim().toLowerCase();
    if(aliasMapLocal[low]) return aliasMapLocal[low];
    for(let can of DEFAULT_KARYAWAN_AWAL){ let cl=can.nama.toLowerCase(); if(low===cl||low.includes(cl)) return can.nama; }
    return null;
  }
  try{
    const c=localStorage.getItem('custom_karyawan');
    if(c){ let arr=JSON.parse(c); if(Array.isArray(arr)&&arr.length>0){
      let map={}; DEFAULT_KARYAWAN_AWAL.forEach(k=>{ map[k.nama.toLowerCase()]={nama:k.nama,tglLahir:''} });
      arr.forEach(item=>{ let namaRaw=(item.nama||'').trim(); if(!namaRaw) return; let canonical=normalizeToCanonical(namaRaw); let key=canonical?canonical.toLowerCase():namaRaw.toLowerCase(); let finalName=canonical||namaRaw; if(!map[key]) map[key]={nama:finalName,tglLahir:item.tglLahir||''}; else { if(item.tglLahir && !map[key].tglLahir) map[key].tglLahir=item.tglLahir; if(canonical) map[key].nama=canonical; } });
      let result=Object.values(map).sort((a,b)=>a.nama.localeCompare(b.nama));
      try{ localStorage.setItem('custom_karyawan', JSON.stringify(result)); }catch{}
      return result;
    }}
  }catch{}
  return DEFAULT_KARYAWAN_AWAL.slice().sort((a,b)=>a.nama.localeCompare(b.nama));
}

function daftarAnggota(){
  const namaEl=document.getElementById('regNama');const tglEl=document.getElementById('regTgl');const passEl=document.getElementById('regPass');const konfEl=document.getElementById('regKonf');const errEl=document.getElementById('regErr');
  let nama=(namaEl.value||'').trim();const tgl=(tglEl.value||'').trim();const pass=(passEl.value||'').trim();const konf=(konfEl.value||'').trim();
  if(!nama){errEl.innerText='Nama harus diisi';return}
  if(!/^[A-Za-z ]{2,30}$/.test(nama)){errEl.innerText='Nama hanya huruf';return}
  if(!tgl){errEl.innerText='Tgl lahir DD-MM-YYYY';return}
  if(!/^\d{2}-\d{2}-\d{4}$/.test(tgl)){errEl.innerText='Format DD-MM-YYYY';return}
  if(!pass){errEl.innerText='Password harus diisi';return}
  if(pass.length<4){errEl.innerText='Minimal 4 karakter';return}
  if(pass!==konf){errEl.innerText='Konfirmasi tidak sama';return}
  let namaLower=nama.toLowerCase(); if(namaLower==='kuncoro budi'||namaLower==='kuncoro') nama='Budi';
  const cur=getKaryawanList(); const idx=cur.findIndex(k=>k.nama.toLowerCase()===nama.toLowerCase());
  let baru; if(idx>=0){ if(cur[idx].tglLahir){errEl.innerText='Sudah terdaftar';return} else{baru=cur.slice();baru[idx]={nama:cur[idx].nama,tglLahir:tgl}} }else{baru=[...cur,{nama:nama,tglLahir:tgl}]}
  try{ localStorage.setItem('custom_karyawan', JSON.stringify(baru)); }catch{} setMemberPass(nama,pass);
  localStorage.setItem('has_registered','1');localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama);
  isMemberLogin=true;memberName=nama; toast('✅ Terdaftar');fetchData();
}

function exportPDF(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const data = filteredDataMember();
    const totalTUL = data.reduce((s,r)=>s+Number(r.tul||0),0);
    const grouped = groupByTanggal(data);
    const bulanNames={1:'Januari',2:'Februari',3:'Maret',4:'April',5:'Mei',6:'Juni',7:'Juli',8:'Agustus',9:'September',10:'Oktober',11:'November',12:'Desember'};

    let y=35;
    doc.setFontSize(9);
    if(data.length===0){
      doc.text('Belum ada data untuk '+memberName+' di filter ini', 14, y);
    }else{
      grouped.forEach(g=>{
        if(y>270){ doc.addPage(); y=14; }
        const sum = g.rows.reduce((s,r)=>s+Number(r.tul||0),0);
        doc.setFont(undefined,'bold');
        doc.text(formatTanggal(g.tanggal)+' - '+sum+' TUL', 14, y);
        y+=5;
        doc.setFont(undefined,'normal');
        g.rows.forEach(r=>{
          if(y>280){ doc.addPage(); y=14; }
          doc.text('- '+r.nama+' : '+r.jam+'j = '+r.tul+' TUL ('+formatTanggal(r.tanggalNorm||r.tanggal)+')', 18, y);
          y+=5;
        });
        y+=3;
      });
    }
    doc.save('Rekap_'+memberName+'_'+namaBulan+'_'+new Date().toISOString().slice(0,10)+'.pdf');
    toast('📄 PDF diekspor');
  }catch(e){
    alert('Export PDF gagal: '+e.message);
  }
}

function filteredDataMember(){const map=new Map();allData.forEach(r=>{const key=(r.tanggalNorm||r.tanggal)+'|'+normNama(r.nama)+'|'+r.jam;if(!map.has(key))map.set(key,r)});let d=Array.from(map.values());if(filterBulan!=='all'){d=d.filter(r=>Number((r.tanggalNorm||r.tanggal).split('-')[1])===Number(filterBulan))}if(isMemberLogin&&memberName){d=d.filter(r=>normNama(r.nama)===normNama(memberName))}return d}
function groupByTanggal(data){const map={};data.forEach(r=>{const key=r.tanggalNorm||r.tanggal;if(!map[key])map[key]=[];map[key].push(r)});return Object.keys(map).sort((a,b)=>new Date(a.split('-').reverse().join('-'))-new Date(b.split('-').reverse().join('-'))).map(k=>({tanggal:k,rows:map[k]}))}

async function fetchData(force=false){
  if(force) render();
  else render();
  try{
    const url = SYNC_URL + (SYNC_URL.includes('?') ? '&' : '?') + 't=' + Date.now() + '&nocache=' + Math.random();
    const res = await fetch(url, {cache:'no-store', headers:{'Cache-Control':'no-cache'}});
    const json = await res.json();
    // Support both formats: {data:[...]} or [...]
    let data = json.data || json || [];
    if(!Array.isArray(data)) data = [];
    // Normalize each row: ensure tanggalNorm, tul, jam
    data = data.map(r=>{
      const t = r.tanggalNorm || r.tanggal || '';
      const tn = normalizeTanggal(t);
      let tul = r.tul;
      if(tul==null || tul===''){ tul = calcTUL(r.jam); }
      return {...r, tanggalNorm: tn || t, tanggal: t, tul: Number(tul)||0, jam: Number(r.jam)||0, nama: String(r.nama||'').trim()};
    });
    allData = data;
    try{
      localStorage.setItem('lembur_data', JSON.stringify(allData));
      localStorage.setItem('cache_lembur', JSON.stringify(allData));
      localStorage.setItem('last_sync_spreadsheet', new Date().toISOString());
    }catch(e){}
  }catch(e){
    console.error('Fetch spreadsheet gagal', e);
    try{
      const c1 = localStorage.getItem('lembur_data');
      const c2 = localStorage.getItem('cache_lembur');
      const c = c1 || c2;
      if(c) allData = JSON.parse(c);
    }catch(e2){}
  }
  render();
}
function forceSyncSpreadsheet(){
  toast('🔄 Sinkron dengan Spreadsheet...');
  fetchData(true);
}
