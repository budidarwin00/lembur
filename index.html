<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Rekap TUL & Reset Password</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5cHnAw-eyp-8KPmIhWijZbGDofMhjrSkibD-23AEBimCeT8m9msRm63AGur7N1wWpXw/exec';
const ADMIN_PASS = 'admin123';

let isLogin = localStorage.getItem('admin_login')==='true';
let allData=[];
let karyawanList=JSON.parse(localStorage.getItem('rk_kar_admin')||'[]');
let filterBulan=String(new Date().getMonth()+1);
let filterTahun=String(new Date().getFullYear());
let search='';
let loading=false;

function showToast(m){ const t=document.createElement('div'); t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-4 py-2 rounded-full text-[12px] z-50'; t.innerText=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }

async function fetchData(){
  loading=true; render();
  try{
    const r=await fetch(SYNC_URL+'?action=read&t='+Date.now());
    const j=await r.json();
    if(Array.isArray(j)) allData=j.map((row,i)=>({rowIndex:row.rowIndex||i+2, tanggal:row.tanggal||row[0], nik:row.nik||row[1], nama:row.nama||row[2], jam:Number(row.jam||row[3]||0), tul:Number(row.tul||row[4]||0)})).filter(x=>x.nik);
  }catch(e){}
  try{
    const r2=await fetch(SYNC_URL+'?action=readKaryawan&t='+Date.now());
    const k=await r2.json();
    if(Array.isArray(k) && k.length>0){ karyawanList=k; localStorage.setItem('rk_kar_admin', JSON.stringify(karyawanList)); }
  }catch(e){}
  if(karyawanList.length===0){
    const uniq={}; allData.forEach(r=>{ if(!uniq[r.nik]) uniq[r.nik]={nik:r.nik,nama:r.nama,pass:'1234'}; });
    karyawanList=Object.values(uniq);
  }
  loading=false; render();
}

function login(){ const p=document.getElementById('apass').value; if(p===ADMIN_PASS){ localStorage.setItem('admin_login','true'); isLogin=true; fetchData(); } else document.getElementById('aerr').innerText='Password salah (default admin123)'; }
function logout(){ localStorage.removeItem('admin_login'); isLogin=false; render(); }

function filteredData(){
  let d=[...allData];
  if(filterBulan!=='all'){
    d=d.filter(x=>{ let m=''; const t=String(x.tanggal); if(t.includes('-')){ const p=t.split('-'); m = p[0].length===4 ? p[1] : p[1]; } else if(t.includes('/')) m=t.split('/')[1]; else m=String(new Date(t).getMonth()+1); return String(parseInt(m))===String(parseInt(filterBulan)); });
  }
  if(filterTahun!=='all'){
    d=d.filter(x=>{ const t=String(x.tanggal); let y=''; if(t.includes('-')) y=t.split('-')[0].length===4 ? t.split('-')[0] : t.split('-')[2]; else if(t.includes('/')) y=t.split('/')[2]; else y=String(new Date(t).getFullYear()); return String(y)===filterTahun; });
  }
  if(search.trim()){ const s=search.toLowerCase(); d=d.filter(x=> x.nik.toLowerCase().includes(s) || x.nama.toLowerCase().includes(s)); }
  return d;
}
function groupByKaryawan(data){
  const map={}; data.forEach(r=>{ if(!map[r.nik]) map[r.nik]={nik:r.nik,nama:r.nama,totalJam:0,totalTUL:0,hari:0}; map[r.nik].totalJam+=Number(r.jam); map[r.nik].totalTUL+=Number(r.tul); map[r.nik].hari+=1; }); return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);
}

async function resetPass(nik){
  if(!confirm(`Reset password ${nik} jadi 1234?`)) return;
  const k=karyawanList.find(x=>x.nik===nik); if(k) k.pass='1234'; localStorage.setItem('rk_kar_admin', JSON.stringify(karyawanList));
  try{ await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resetPass',nik,newPass:'1234'})}); }catch{}
  showToast(`🔑 ${nik} reset ke 1234`); render();
}

function shareWA(nik, nama, totalTUL){
  // Format simple sesuai request: Alif 16 tul
  const pesan = `${nama} ${totalTUL} tul`;
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}

function shareAllWA(){
  const data = filteredData();
  const grouped = groupByKaryawan(data);
  const bulanNama = filterBulan==='all' ? 'Semua Bulan' : ['', 'Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][parseInt(filterBulan)] || filterBulan;
  const header = `Update tul bulan ${bulanNama}`;
  // Format persis contoh:
  // Update tul bulan September 
  // Alif 16 tul
  // Aris 20 tul
  // Aji 10 tul
  let pesan = `${header} \n` + grouped.map(g=> `${g.nama} ${g.totalTUL} tul`).join('\n');
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}

function exportPDF(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); const data=filteredData(); const grouped=groupByKaryawan(data);
  const bulanNama=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const label=`${filterBulan==='all'?'Semua Bulan':bulanNama[parseInt(filterBulan)]} ${filterTahun==='all'?'':filterTahun}`;
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text(`Rekap Total TUL - ${label}`,14,16);
  doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.text(`Total ${grouped.length} karyawan`,14,22);
  const rows=grouped.map((g,i)=>[i+1,g.nik,g.nama,g.hari,`${g.totalJam} jam`, `${g.totalTUL} tul`]);
  doc.autoTable({startY:26, head:[['No','NIK','Nama','Hari','Total Jam','Total TUL']], body:rows, styles:{fontSize:10}});
  doc.save(`Rekap-TUL-${filterBulan}-${filterTahun}.pdf`);
}

function render(){
  const app=document.getElementById('app');
  if(!isLogin){
    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-zinc-900">
      <div class="w-full max-w-[360px] bg-white rounded-[24px] p-6 shadow-2xl">
        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-zinc-900 text-white grid place-items-center font-bold">A</div><div><h1 class="font-bold text-[16px] leading-none">Admin</h1><p class="text-[11px] text-zinc-500 mt-1">Rekap TUL & Reset Password</p></div><div class="ml-auto w-5 h-5 rounded-full bg-green-500 flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div></div>
        <div class="mt-6 space-y-3"><input id="apass" type="password" placeholder="Password admin" class="w-full h-11 rounded-xl border px-4 text-[14px] bg-zinc-50"><div id="aerr" class="text-[11px] text-red-600 min-h-[14px]"></div><button onclick="login()" class="w-full h-11 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">Masuk</button><div class="text-[10px] text-zinc-400 text-center">default: admin123 • <a href="./" class="underline">App Karyawan</a></div></div>
      </div>
    </div>`; return;
  }

  const data=filteredData();
  const grouped=groupByKaryawan(data);
  const bulanNama=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const labelBulan=filterBulan==='all'?'Semua Bulan':bulanNama[parseInt(filterBulan)];

  app.innerHTML=`<div class="max-w-[900px] mx-auto min-h-screen bg-white md:my-4 md:rounded-[24px] md:border md:shadow-xl overflow-hidden">
    <div class="px-5 h-[56px] flex items-center justify-between border-b bg-white sticky top-0 z-10">
      <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-zinc-900 text-white grid place-items-center font-bold text-[12px]">A</div><div><div class="font-bold text-[14px] leading-none">Admin</div><div class="text-[10px] text-zinc-500 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500"></span>${grouped.length} karyawan • ${data.length} data</div></div></div>
      <div class="flex gap-2"><button onclick="fetchData()" class="h-8 px-3 rounded-full bg-zinc-100 text-[11px] font-bold">${loading?'⏳':'🔄'} Refresh</button><button onclick="logout()" class="h-8 px-3 rounded-full bg-zinc-900 text-white text-[11px] font-bold">Logout</button></div>
    </div>

    <div class="p-4 space-y-4 bg-[#f6f5f4]">
      <!-- FILTER -->
      <div class="rounded-[16px] bg-white border p-3 flex gap-2">
        <select onchange="filterBulan=this.value;render()" class="flex-1 h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-semibold"><option value="all" ${filterBulan==='all'?'selected':''}>Semua Bulan</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${filterBulan==i+1?'selected':''}>${bulanNama[i+1]}</option>`).join('')}</select>
        <select onchange="filterTahun=this.value;render()" class="flex-1 h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-semibold"><option value="all" ${filterTahun==='all'?'selected':''}>Semua Tahun</option><option value="2024" ${filterTahun==='2024'?'selected':''}>2024</option><option value="2025" ${filterTahun==='2025'?'selected':''}>2025</option><option value="2026" ${filterTahun==='2026'?'selected':''}>2026</option></select>
        <button onclick="exportPDF()" class="h-10 px-4 rounded-xl bg-white border text-[12px] font-bold">PDF</button>
      </div>

      <!-- REKAP TOTAL TUL - TANPA BAGAN HITAM BIRU -->
      <div class="rounded-[20px] bg-white border shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b flex justify-between items-center">
          <div class="font-bold text-[13px]">Rekap Total TUL Semua Karyawan</div>
          <div class="flex gap-2 items-center">
            <div class="text-[11px] text-zinc-500">${labelBulan} ${filterTahun==='all'?'':filterTahun}</div>
            <button onclick="shareAllWA()" class="h-8 px-3 rounded-full bg-green-500 text-white text-[11px] font-bold">WA All</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-[12px]">
            <thead class="bg-zinc-50 text-[10px] uppercase font-bold text-zinc-500"><tr><th class="text-left px-4 py-2.5">#</th><th class="text-left px-4 py-2.5">Nama</th><th class="text-center px-4 py-2.5">TUL</th><th class="text-center px-4 py-2.5">Share</th></tr></thead>
            <tbody class="divide-y">
              ${grouped.length===0?`<tr><td colspan="4" class="py-10 text-center text-zinc-500">Tidak ada data di ${labelBulan} ${filterTahun}</td></tr>`:
                grouped.map((g,i)=>`<tr><td class="px-4 py-3 font-bold">${i+1}</td><td class="px-4 py-3 font-semibold">${g.nama}</td><td class="px-4 py-3 text-center font-bold">${g.totalTUL} tul</td><td class="px-4 py-3 text-center"><button onclick="shareWA('${g.nik}','${g.nama}',${g.totalTUL})" class="h-7 px-3 rounded-full bg-green-500 text-white text-[11px] font-bold">WA</button></td></tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="bg-zinc-50 px-4 py-2 text-[10px] text-zinc-500">Contoh share WA:<br>Alif 16 tul<br>Aris 20 tul<br>Aji 10 tul</div>
      </div>

      <!-- RESET PASSWORD - TOMBOL SIMPAN -->
      <div class="rounded-[20px] bg-white border shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b flex justify-between items-center">
          <div class="font-bold text-[13px]">Reset Password Karyawan</div>
          <input value="${search}" oninput="search=this.value;render()" placeholder="Cari NIK/Nama" class="h-8 w-[160px] rounded-full border bg-zinc-50 px-3 text-[11px]">
        </div>
        <div class="divide-y max-h-[420px] overflow-y-auto">
          ${karyawanList.filter(k=> !search || k.nik.toLowerCase().includes(search.toLowerCase()) || k.nama.toLowerCase().includes(search.toLowerCase())).map(k=>`
            <div class="px-4 py-3 flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-zinc-100 grid place-items-center font-bold text-[11px]">${k.nama[0]||'?'}</div>
              <div class="flex-1 min-w-0">
                <div class="font-bold text-[13px]">${k.nama} <span class="font-mono text-[11px] text-zinc-500">${k.nik}</span></div>
                <div class="text-[11px] text-zinc-500 font-mono">Pass: ${k.pass||'1234'}</div>
              </div>
              <button onclick="resetPass('${k.nik}')" class="h-8 px-4 rounded-xl bg-zinc-900 text-white text-[11px] font-bold">simpan</button>
            </div>
          `).join('') || '<div class="p-6 text-center text-[12px] text-zinc-500">Belum ada karyawan.</div>'}
        </div>
        <div class="bg-zinc-50 px-4 py-2.5 text-[10px] text-zinc-500">Klik <b>simpan</b> untuk reset password jadi <b>1234</b></div>
      </div>

      <div class="text-[10px] text-zinc-400 text-center pb-4">Admin 1 Halaman • WA Share Format: Nama + TUL<br><a href="https://docs.google.com/spreadsheets/d/1_v3QLraptmdhD2FRPdzvMd6hYIFJxVz5YyqjKW1g4lc/edit" target="_blank" class="underline">Buka Spreadsheet</a> • <a href="./" class="underline">App Karyawan</a></div>
    </div>
  </div>`;
}

if(isLogin) fetchData(); else render();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
