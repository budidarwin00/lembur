<html lang="id"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AREA EF - Anggota</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,Inter,system-ui,sans-serif;background:#fff;color:#111;min-height:100vh}
.h{position:sticky;top:0;z-index:10;background:#0e7490;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.btn{height:32px;padding:0 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:11px;font-weight:600}
.btn-b{background:#111;color:#fff;border-color:#111}
.bar{padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:8px;align-items:center;background:#fff}
.sel{height:32px;padding:0 12px;border-radius:20px;border:1px solid #e2e8f0;background:#f8fafc;font-size:12px}
.container{max-width:560px;margin:0 auto;padding-bottom:40px}
.big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.card{padding:16px;border-top:1px solid #f1f5f9}
.dt{font-size:11px;color:#94a3b8;letter-spacing:.1em;font-weight:700;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f8fafc;font-size:13px}
.login{height:100vh;display:grid;place-items:center;padding:24px}
.inp{width:100%;height:44px;border:0;border-bottom:2px solid #111;background:transparent;font-size:14px;outline:0;margin-top:16px}
.lbtn{width:100%;height:44px;background:#111;color:#fff;border-radius:22px;border:0;margin-top:12px;font-weight:700;font-size:13px}
.lbtn2{width:100%;height:44px;background:#fff;color:#111;border:1px solid #111;border-radius:22px;margin-top:8px;font-weight:700;font-size:13px}
.empty{padding:60px 20px;text-align:center;color:#94a3b8;font-size:12px}
</style></head><body><div id="app"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const TUL={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calc(j){return TUL[j]||j*1.5;}
function normT(t){let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];s=s.replace('Z','').trim();let iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(iso)return iso[1]+'-'+iso[2]+'-'+iso[3];let m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s;}
function fmt(t){let p=normT(t).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:t;}
function jsonp(u){return new Promise((res,rej)=>{let c='cb'+Date.now()+Math.random().toString(36).slice(2);window[c]=d=>{delete window[c];document.getElementById(c)?.remove();res(d);};let s=document.createElement('script');s.id=c;s.src=u+(u.includes('?')?'&':'?')+'callback='+c+'&_='+Date.now();s.onerror=()=>{delete window[c];s.remove();rej();};document.body.appendChild(s);});}

let all=[];let filter=localStorage.getItem('filterAnggota')||'all';let member=localStorage.getItem('member_name')||'';let isLogin=!!localStorage.getItem('member_login');

function toast(m){let t=document.createElement('div');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:20px;font-size:11px;z-index:99';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}

async function load(){
  let cached=localStorage.getItem('cache_lembur');
  if(cached){try{all=JSON.parse(cached).map(r=>({tanggal:normT(r.tanggal),nama:r.nama,jam:Number(r.jam),tul:calc(Number(r.jam))})).filter(r=>r.nama);}catch{}}
  try{
    let d=await jsonp(SYNC_URL+'?action=read&_='+Date.now());
    if(Array.isArray(d)&&d.length){
      all=d.map(r=>{let j=Number(r.jam||0);if(![2,3,4,6,7,8].includes(j))return null;let t=normT(r.tanggal);if(!t)return null;return{tanggal:t,nama:String(r.nama||'').trim(),jam:j,tul:calc(j)}}).filter(Boolean);
      localStorage.setItem('cache_lembur',JSON.stringify(all));
    }
  }catch{}
  render();
}
function filtered(){let d=all;if(member) d=d.filter(r=>r.nama.toLowerCase()===member.toLowerCase());if(filter!=='all'){let n=Number(filter);d=d.filter(r=>Number(r.tanggal.split('-')[1])===n);}return d;}
function group(d){let m={};d.forEach(r=>{if(!m[r.tanggal])m[r.tanggal]=[];m[r.tanggal].push(r);});return Object.keys(m).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:m[k]}));}

function daftar(){
  let nama=document.getElementById('namaLengkap').value.trim();
  let tgl=document.getElementById('tglLahir').value.trim();
  if(!nama){toast('Isi nama lengkap');return;}
  if(!tgl){toast('Isi tanggal lahir DD-MM-YYYY');return;}
  if(!tgl.match(/\d{1,2}[\-\/]\d{1,2}[\-\/]\d{4}/)){toast('Format tgl: 15-10-1995');return;}
  document.getElementById('err').innerText='Mendaftarkan ke sheet member...';
  jsonp(SYNC_URL+'?action=addmember&nama='+encodeURIComponent(nama)+'&tglLahir='+encodeURIComponent(tgl)+'&password='+encodeURIComponent(tgl)+'&_='+Date.now()).then(r=>{
    if(r&&r.ok){
      toast('Berhasil daftar di sheet member');
      document.getElementById('err').innerText='Berhasil daftar, sekarang login pakai nama saja';
      document.getElementById('loginNama').value=nama;
    }else{
      document.getElementById('err').innerText=r?.error||'Gagal daftar';
    }
  }).catch(()=>{document.getElementById('err').innerText='Gagal konek, coba lagi';});
}

function login(){
  let nama=document.getElementById('loginNama').value.trim();
  if(!nama){toast('Isi nama');return;}
  document.getElementById('err2').innerText='Cek di sheet member...';
  // Login cukup input nama saja - cek apakah nama ada di sheet member
  jsonp(SYNC_URL+'?action=checkmember&nama='+encodeURIComponent(nama)+'&_='+Date.now()).then(chk=>{
    if(chk && chk.exists){
      // nama ada di sheet member -> langsung login (cukup nama saja)
      localStorage.setItem('member_name',nama);
      localStorage.setItem('member_login','1');
      member=nama;isLogin=true;toast('Login ok - '+nama);render();load();
    }else{
      document.getElementById('err2').innerText='Nama kosong di sheet member, harus daftar dulu di atas (nama + tgl lahir)';
      toast('Harus daftar dulu');
    }
  }).catch(()=>{document.getElementById('err2').innerText='Gagal cek sheet member';});
}

function logout()function logout(){localStorage.removeItem('member_login');isLogin=false;render();}
function setFilter(v){filter=v;localStorage.setItem('filterAnggota',v);render();}

function render(){
  let app=document.getElementById('app');
  if(!isLogin){
    app.innerHTML=`<div class=login><div style="width:100%;max-width:340px">
      <div style="font-size:10px;letter-spacing:.3em;color:#94a3b8;margin-bottom:8px">AREA EF - ANGGOTA</div>
      <div style="font-size:20px;font-weight:800">Daftar Member</div>
      <div style="font-size:11px;color:#94a3b8;margin-top:4px">Cukup nama lengkap + tanggal lahir, data masuk ke sheet 'member'</div>
      
      <div style="margin-top:20px;padding:14px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc">
        <div style="font-size:12px;font-weight:700">DAFTAR BARU</div>
        <input id=namaLengkap type=text placeholder="Nama lengkap (contoh: Budi Santoso)" class=inp>
        <input id=tglLahir type=text placeholder="Tanggal lahir DD-MM-YYYY (15-10-1995)" class=inp>
        <div id=err style="font-size:11px;color:#ef4444;margin-top:8px;min-height:12px"></div>
        <button onclick=daftar() class=lbtn>Daftar ke Sheet Member</button>
      </div>

      <div style="margin-top:16px;padding:14px;border:1px solid #111;border-radius:12px;background:#fff">
        <div style="font-size:12px;font-weight:700">LOGIN (cukup nama saja)</div>
        <div style="font-size:10px;color:#94a3b8;margin-top:2px">Jika nama kosong di sheet member, harus daftar dulu di atas</div>
        <input id=loginNama type=text placeholder="Nama lengkap saja" class=inp>
        <div id=err2 style="font-size:11px;color:#ef4444;margin-top:8px;min-height:12px"></div>
        <button onclick=login() class=lbtn2>Login</button>
      </div>
    </div></div>`;
    return;
  }
  let data=filtered();let g=group(data);let total=data.reduce((s,r)=>s+r.tul,0);
  let h='<div class=h><b>AREA EF</b><div style="display:flex;gap:8px;align-items:center"><span style="font-size:12px">'+member+'</span><button onclick=logout() class=btn style="background:#fff;color:#111;border:0">Keluar</button></div></div>';
  h+='<div class=bar><select onchange=setFilter(this.value) class=sel><option value=all '+(filter==='all'?'selected':'')+'>Semua Bulan</option><option value=10 '+(filter==='10'?'selected':'')+'>Okt</option><option value=11 '+(filter==='11'?'selected':'')+'>Nov</option><option value=12 '+(filter==='12'?'selected':'')+'>Des</option></select><button onclick=load() class=btn>Refresh</button><span style="font-size:11px;color:#94a3b8;margin-left:auto">'+data.length+' transaksi</span></div>';
  h+='<div class=container><div style="padding:24px 16px"><div class=big>'+total+'</div><div style="font-size:11px;letter-spacing:.2em;color:#94a3b8;margin-top:4px">TOTAL TUL • '+member.toUpperCase()+'</div></div>';
  if(g.length===0){
    h+='<div class=empty>TIDAK ADA DATA<br><small style="font-size:10px">Sheet data lembur • Filter: '+filter+' • Total sistem: '+all.length+'</small><br><br><button onclick=setFilter("all") class="btn btn-b">Lihat Semua Bulan</button></div>';
  }else{
    g.forEach(x=>{
      h+='<div class=card><div class=dt>'+fmt(x.tanggal)+' • '+x.rows.length+' shift</div>';
      x.rows.forEach(r=>{h+='<div class=row><span>'+r.jam+'j</span><span style="font-weight:700">'+r.tul+' TUL</span></div>'});
      h+='</div>';
    });
  }
  h+='</div>';
  app.innerHTML=h;
}
load();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
