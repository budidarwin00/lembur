</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AREA EF - Anggota</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;} .mono{font-family:JetBrains Mono,monospace;}</style>
</head><body>
<div id="app"></div>
<script>
const DEFAULT_SYNC_URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const FALLBACK_SYNC_URL='https://script.google.com/macros/s/AKfycbzUWTx3o5DjsfrM7JTZBbnYYaMBzFLbH3-mfs0dCFm1uOGouvDqCBpc3KOgNPgKNoHL/exec';
function getSyncUrl(){try{const cs=localStorage.getItem('custom_sync_url'); if(cs&&cs.includes('script.google.com')) return cs;}catch(e){} return DEFAULT_SYNC_URL;}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+Math.floor(Math.random()*1000); window[cb]=(d)=>{delete window[cb]; document.getElementById(cb)?.remove(); resolve(d);}; const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now()+Math.random(); s.onerror=()=>{delete window[cb]; s.remove(); reject(new Error('Offline'));}; document.body.appendChild(s);});}
function isJamValid(j){j=Number(j); return !isNaN(j)&&j>0&&j<=24;}
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j);if(isNaN(j)||j<=0||j>24)return 0;return TUL_MAP[j]||j*1.5;}
function normalizeTanggal(t){
  if(!t) return '';
  let s=String(t).trim();
  let m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m){ let d=m[1].padStart(2,'0'), mo=m[2].padStart(2,'0'), y=m[3]; return y+'-'+mo+'-'+d; }
  m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m){ let y=m[1], mo=m[2].padStart(2,'0'), d=m[3].padStart(2,'0'); return y+'-'+mo+'-'+d; }
  let nums=s.match(/\d+/g);
  if(nums&&nums.length>=3&&nums[nums.length-1].length===4){
    let y=nums[nums.length-1], mo=nums[nums.length-2], d=nums[0];
    if(Number(mo)<=12&&Number(d)<=31) return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  try{let dd=new Date(s); if(!isNaN(dd)) return dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');}catch(e){}
  return s;
}
function formatTanggal(t){let p=normalizeTanggal(t).split('-'); if(p.length===3) return p[2]+'-'+p[1]+'-'+p[0]; return t;}
function normNama(n){return String(n||'').trim().toLowerCase();}
const ALIAS_NAMA={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normalisasiNamaAnggota(nama){if(!nama) return ''; let raw=String(nama).trim(); let key=raw.toLowerCase(); if(ALIAS_NAMA[key]) return ALIAS_NAMA[key]; for(let k in ALIAS_NAMA){ if(key.includes(k)) return ALIAS_NAMA[k]; } return raw.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').trim();}
const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function dedupKaryawanList(arr){const map={}; const out=[]; for(let k of arr){ if(!k||!k.nama)continue; let norm=normalisasiNamaAnggota(k.nama); if(!norm)continue; let key=norm.toLowerCase(); if(!map[key]){map[key]=true; out.push({nama:norm});}} return out.sort((a,b)=>a.nama.localeCompare(b.nama));}
function getKaryawanList(){try{const c=localStorage.getItem('custom_karyawan'); if(c){let arr=JSON.parse(c); if(Array.isArray(arr)&&arr.length>0){return dedupKaryawanList(arr);}}}catch{} return dedupKaryawanList(DEFAULT_KARYAWAN_AWAL.slice());}
let allData=[];let memberName=localStorage.getItem('member_name')||'';let filterBulan=String(new Date().getMonth()+1);let forceDaftar=false;
function getCustomMemberPass(){try{return JSON.parse(localStorage.getItem('custom_member_pass')||'{}')}catch{return{}}}
function saveCustomMemberPass(m){try{localStorage.setItem('custom_member_pass',JSON.stringify(m))}catch{}}
function setMemberPass(nama,p){const m=getCustomMemberPass();m[nama]=p;saveCustomMemberPass(m)}
function toast(msg){const t=document.createElement('div');t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-[11px] px-5 py-2.5 rounded-full z-[99]';t.innerText=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
async function fetchData(force=false){
  if(force){try{localStorage.removeItem('cache_lembur'); allData=[];}catch{}}
  try{const cc=localStorage.getItem('cache_lembur'); if(cc&&allData.length===0){const j=JSON.parse(cc); if(Array.isArray(j)&&j.length>0){allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal||r.tanggalNorm),nama:normalisasiNamaAnggota(r.nama||r.nik||''),jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama&&isJamValid(x.jam));}}}
  catch(e){}
  try{
    let j=await jsonp(getSyncUrl()+'?action=read&_nocache='+Date.now());
    if(Array.isArray(j)&&j.length===0){try{const j2=await jsonp(FALLBACK_SYNC_URL+'?action=read&_nocache='+Date.now()); if(Array.isArray(j2)&&j2.length>0) j=j2;}catch(e2){}}
    if(Array.isArray(j)){
      let mapped=j.map(r=>{let jam=Number(r.jam||0); if(!isJamValid(jam)) return null; let norm=normalisasiNamaAnggota(r.nama||r.nik||''); return {tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:norm,jam:jam,tul:calcTUL(jam)};}).filter(x=>x&&x.nama&&x.jam>0);
      const dedupMap={}; const deduped=[]; mapped.forEach(r=>{const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!dedupMap[key]){dedupMap[key]=true; deduped.push(r);}});
      if(deduped.length>0){allData=deduped; try{localStorage.setItem('cache_lembur', JSON.stringify(allData));}catch{}}
    }
  }catch(e){console.log('fetch error',e);}
  render();
}
function filteredDataMember(){
  let d=allData;
  const myName=normalisasiNamaAnggota(localStorage.getItem('member_name')||'');
  if(myName) d=d.filter(r=> normNama(r.nama)===normNama(myName));
  if(filterBulan!=='all'){d=d.filter(r=>{const parts=r.tanggalNorm.split('-'); return parts.length===3&&Number(parts[1])===Number(filterBulan);});}
  return d;
}
function groupByTanggal(data){const map={};data.forEach(r=>{const key=r.tanggalNorm||r.tanggal;if(!map[key])map[key]=[];map[key].push(r)});return Object.keys(map).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:map[k]}))}
async function daftarAnggota(){
  let nama=normalisasiNamaAnggota((document.getElementById('regNama').value||'').trim());
  const tgl=(document.getElementById('regTgl').value||'').trim();
  const pass=(document.getElementById('regPass').value||'').trim();
  const konf=(document.getElementById('regKonf').value||'').trim();
  const err=document.getElementById('regErr');
  if(!nama){err.innerText='Nama wajib';return}
  if(!pass){err.innerText='Password wajib';return}
  if(pass!==konf){err.innerText='Password tidak sama';return}
  err.innerText='⏳ Mendaftar...';
  try{await jsonp(getSyncUrl()+'?action=addMember&nama='+encodeURIComponent(nama)+'&tglLahir='+encodeURIComponent(tgl)+'&password='+encodeURIComponent(pass)+'&_='+Date.now());}catch(e){}
  setMemberPass(nama,pass); localStorage.setItem('has_registered','1');localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama);
  toast('✅ Daftar berhasil'); render(); fetchData();
}
async function loginMember(){
  let nama=normalisasiNamaAnggota((document.getElementById('memberSelect').value||'').trim());
  const pass=(document.getElementById('memberPass').value||'').trim();
  const err=document.getElementById('aerr');
  if(!nama){err.innerText='Pilih nama';return}
  if(!pass){err.innerText='Password wajib';return}
  err.innerText='⏳ Login...';
  try{
    const res=await jsonp(getSyncUrl()+'?action=loginMember&nama='+encodeURIComponent(nama)+'&password='+encodeURIComponent(pass)+'&_='+Date.now());
    if(res&&res.ok){setMemberPass(nama,pass); localStorage.setItem('has_registered','1');localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama); toast('✅ Login berhasil'); fetchData(); return;}
    else{if(res&&res.error) err.innerText=res.error; else err.innerText='Login gagal'; return;}
  }catch(e){
    const custom=getCustomMemberPass();
    if(custom[nama]&&custom[nama]===pass){localStorage.setItem('has_registered','1');localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama); toast('✅ Login lokal'); fetchData(); return;}
    err.innerText='Gagal koneksi';
  }
}
function logoutMember(){localStorage.removeItem('member_login');localStorage.removeItem('member_name');render();toast('Keluar');}
function showLogin(){forceDaftar=false;localStorage.setItem('force_daftar','0');render();}
function showDaftar(){forceDaftar=true;localStorage.setItem('force_daftar','1');render();}
function exportPDF(){
  try{
    const data=filteredDataMember(); const grouped=groupByTanggal(data); const totalTUL=data.reduce((s,r)=>s+Number(r.tul||0),0);
    const mName=localStorage.getItem('member_name')||'';
    const bulanLabels=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const bulan=filterBulan==='all'?'Semua Bulan':(bulanLabels[Number(filterBulan)]||filterBulan);
    let html='<html><head><meta charset="UTF-8"><title>Export TUL '+mName+'</title><style>body{font-family:Inter,sans-serif;padding:40px;color:#000}h1{font-size:28px;font-weight:300;margin:0}.sub{font-size:11px;color:#999;margin-top:6px;letter-spacing:0.15em}.total{font-size:52px;font-weight:300;margin-top:24px;letter-spacing:-0.03em}.meta{margin-top:20px;border-top:1px solid #eee;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:#888}.group{margin-top:32px}.date{font-size:11px;color:#666;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:14px}.mono{font-family:monospace}.footer{margin-top:48px;border-top:1px solid #eee;padding-top:16px;text-align:center;font-size:9px;color:#bbb;letter-spacing:0.2em}</style></head><body>';
    html+='<h1>'+mName+'</h1><div class="sub">AREA EF • LAPORAN LEMBUR</div><div class="total">'+totalTUL+' TUL</div><div class="meta"><span>Filter: '+bulan+'</span><span>'+new Date().toLocaleDateString('id-ID')+'</span></div>';
    grouped.forEach(function(g){html+='<div class="group"><div class="date">'+formatTanggal(g.tanggal)+'</div>';g.rows.forEach(function(r){html+='<div class="row"><span class="mono">'+r.jam+'j</span><span class="mono">'+r.tul+' TUL</span></div>';});html+='</div>';});
    html+='<div class="footer">AREA EF • ULTRA MINIMAL • EXPORT PDF</div></body></html>';
    const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();w.focus();setTimeout(function(){w.print();},600);}else{toast('Pop-up diblokir');}
  }catch(e){toast('Gagal export');}
}
function render(){
  const hasMember=Object.keys(getCustomMemberPass()).length>0 || !!localStorage.getItem('has_registered');
  const memberNameStored=localStorage.getItem('member_name');
  const isLoggedIn=!!localStorage.getItem('member_login') && !!memberNameStored;
  if(localStorage.getItem('force_daftar')==='1') forceDaftar=true;
  if(!isLoggedIn){
    const isFirstTime=forceDaftar;
    if(isFirstTime){
      document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-6"><div class="w-full max-w-[320px]"><div class="mb-10"><div class="text-[10px] tracking-[0.25em] text-slate-400">AREA EF</div><div class="text-[22px] font-light tracking-tight mt-2">Daftar</div><div class="text-[12px] text-slate-400 mt-1">Buat akun untuk melihat lembur</div></div><div class="space-y-4"><input id="regNama" type="text" placeholder="Nama lengkap" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><input id="regTgl" type="text" placeholder="DD-MM-YYYY" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><input id="regPass" type="password" placeholder="Password" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><input id="regKonf" type="password" placeholder="Konfirmasi" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><div id="regErr" class="text-[11px] text-red-500 min-h-[16px]"></div><button onclick="daftarAnggota()" class="w-full h-[44px] bg-black text-white text-[12px] tracking-wide font-medium rounded-full mt-2">Daftar</button><button onclick="showLogin()" class="w-full text-[11px] text-slate-400 underline mt-6">Sudah punya akun? Login</button></div></div></div>';
      return;
    } else {
      const list=getKaryawanList();
      let opts='';for(let i=0;i<list.length;i++){opts+='<option value="'+list[i].nama+'">'+list[i].nama+'</option>';}
      document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-6"><div class="w-full max-w-[320px]"><div class="mb-10"><div class="text-[10px] tracking-[0.25em] text-slate-400">AREA EF</div><div class="text-[22px] font-light tracking-tight mt-2">Login</div></div><select id="memberSelect" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><option value="">Pilih nama</option>'+opts+'</select><input id="memberPass" type="password" placeholder="Password" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] mt-4 focus:border-black focus:outline-none"><div id="aerr" class="text-[11px] text-red-500 min-h-[16px] mt-2"></div><button onclick="loginMember()" class="w-full h-[44px] bg-black text-white text-[12px] tracking-wide font-medium rounded-full mt-6">Masuk</button><button onclick="showDaftar()" class="w-full text-[11px] text-slate-400 underline mt-6">Belum punya akun? Daftar</button></div></div>';
      return;
    }
  }
  const data=filteredDataMember(); const grouped=groupByTanggal(data); const totalTUL=data.reduce((s,r)=>s+Number(r.tul||0),0);
  memberName=localStorage.getItem('member_name')||'';
  let html='';
  html+='<div class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center"><div class="text-[10px] tracking-[0.2em] text-slate-400">AREA EF</div><div class="text-[13px] font-medium tracking-tight">'+memberName+'</div><button onclick="logoutMember()" class="text-[11px] text-slate-400 hover:text-black">Keluar</button></div>';
  html+='<div class="max-w-[520px] mx-auto px-6 py-10">';
  html+='<div class="mb-10"><div class="flex items-baseline gap-3"><div class="mono text-[56px] font-light leading-none tracking-tighter">'+totalTUL+'</div><div class="text-[10px] tracking-[0.2em] text-slate-400">TUL</div></div>';
  html+='<div class="mt-8 flex gap-2"><select onchange="filterBulan=this.value;render()" class="mono h-[36px] px-4 rounded-full bg-slate-50 border border-slate-200 text-[11px] text-slate-700 focus:outline-none focus:border-black"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua Bulan</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select><button onclick="exportPDF()" class="h-[36px] px-5 rounded-full bg-black text-white text-[11px]">Export PDF</button><button onclick="fetchData(true)" class="h-[36px] px-4 rounded-full border border-slate-200 text-[11px]">Refresh</button></div></div>';
  if(grouped.length===0){html+='<div class="py-24 text-center"><div class="mono text-[11px] tracking-[0.2em] text-slate-300">TIDAK ADA DATA</div><div class="mono text-[10px] text-slate-400 mt-2">Total '+allData.length+' data di sistem, tapi tidak ada untuk '+memberName+' di filter ini</div><button onclick="filterBulan=\'all\';render()" class="mt-6 h-[36px] px-5 rounded-full bg-black text-white text-[11px]">Lihat Semua</button></div>';}
  else{
    for(let g of grouped){
      html+='<div class="mb-8"><div class="mono text-[11px] tracking-[0.15em] text-slate-500 mb-3">'+formatTanggal(g.tanggal).toUpperCase()+'</div><div class="border-t border-slate-100">';
      for(let r of g.rows){
        html+='<div class="flex justify-between items-center py-4 border-b border-slate-50"><div class="mono text-[15px] font-light">'+String(r.jam).padStart(2,'0')+'j</div><div class="mono text-[14px] text-slate-500">'+r.tul+'</div></div>';
      }
      html+='</div></div>';
    }
  }
  html+='<div class="mt-16 pt-8 border-t border-slate-100 text-center mono text-[9px] tracking-[0.2em] text-slate-300">AREA EF • ULTRA MINIMAL</div></div>';
  document.getElementById('app').innerHTML=html;
}
fetchData();
