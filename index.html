function getAdminPass(){ try{ const c=localStorage.getItem('custom_admin_pass'); if(c) return c; }catch(e){} return ADMIN_PASS_DEFAULT; }
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){ j=Number(j); if(isNaN(j)||j<=0||j>24||Math.abs(j)>100) return 0; return TUL_MAP[j]||j*1.5; }
function parseTglSort(tglStr){ if(!tglStr) return 0; let parts=String(tglStr).split(/[-/]/); if(parts.length!==3) return 0; let d=Number(parts[0]),m=Number(parts[1]),y=Number(parts[2]); if(isNaN(d)||isNaN(m)||isNaN(y)) return 0; return new Date(y,m-1,d).getTime(); }
function isJamValid(j){ j=Number(j); return !isNaN(j) && j>0 && j<=24 && Math.abs(j)<=100; }
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch{}return s;}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t;}
const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function getKaryawanList(){
  const aliasMapLocal={'kuncoro budi':'Budi','kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','aditya z':'Aditya'};
  function normalizeToCanonical(nama){
    let low=String(nama||'').trim().toLowerCase();
    if(aliasMapLocal[low]) return aliasMapLocal[low];
    for(let can of DEFAULT_KARYAWAN_AWAL){ let cl=can.nama.toLowerCase(); if(low===cl|| (low.includes(cl)&&cl.length>=3)) return can.nama; }
    for(let k in aliasMapLocal){ if(low.includes(k)) return aliasMapLocal[k]; }
    return null;
  }
  try{
    const c=localStorage.getItem('custom_karyawan');
    if(c){ let arr=JSON.parse(c); if(Array.isArray(arr)&&arr.length>0){
      let map={}; DEFAULT_KARYAWAN_AWAL.forEach(k=>{ map[k.nama.toLowerCase()]={nama:k.nama,tglLahir:''} });
      arr.forEach(item=>{ let namaRaw=(item.nama||'').trim(); if(!namaRaw) return; let canonical=normalizeToCanonical(namaRaw); let key=canonical?canonical.toLowerCase():namaRaw.toLowerCase(); let finalName=canonical||namaRaw; if(!map[key]) map[key]={nama:finalName,tglLahir:item.tglLahir||''}; else { if(item.tglLahir && !map[key].tglLahir) map[key].tglLahir=item.tglLahir; if(canonical) map[key].nama=canonical; } });
      let result=Object.values(map).sort((a,b)=>a.nama.localeCompare(b.nama));
      try{ localStorage.setItem('custom_karyawan', JSON.stringify(result)); }catch{}
      return result;
    }}
  }catch{}
  return DEFAULT_KARYAWAN_AWAL.slice().sort((a,b)=> a.nama.localeCompare(b.nama));
}
function saveKaryawanList(list){ const sorted=list.slice().sort((a,b)=> a.nama.localeCompare(b.nama)); try{ localStorage.setItem('custom_karyawan', JSON.stringify(sorted)); }catch{} DEFAULT_KARYAWAN=sorted; }
let DEFAULT_KARYAWAN=getKaryawanList().slice().sort((a,b)=> a.nama.localeCompare(b.nama));
function getCustomMemberPassAdmin(){try{const c=localStorage.getItem('custom_member_pass');if(c)return JSON.parse(c)}catch{}return{}}
function cekAnggotaTerdaftarAdmin(){
  const list=getKaryawanList(); const pass=getCustomMemberPassAdmin(); const sudah=list.filter(k=>k.tglLahir||pass[k.nama]); const belum=list.filter(k=>!k.tglLahir&&!pass[k.nama]);
  let txt=`TOTAL ${list.length} | SUDAH DAFTAR ${sudah.length} | BELUM ${belum.length}\n\nSUDAH DAFTAR:\n`; sudah.forEach(k=>{ txt+=`✅ ${k.nama} - Tgl: ${k.tglLahir||'-'} - Pass: ${pass[k.nama]||'1234'}\n`; }); txt+=`\nBELUM DAFTAR:\n`; belum.forEach(k=>{ txt+=`⏳ ${k.nama}\n`; }); alert(txt); return sudah;
}

  11: { nama:'November', tema:'bulan-11', accent:'border-slate-200', dot:'bg-slate-600', icon:'🌧️', pernak:['🌧️','☁️'], ucapan:'Musim hujan, jaga kesehatan', header:'Musim Hujan', color:'#334155' },
  12: { nama:'Desember', tema:'bulan-12', accent:'border-red-200', dot:'bg-emerald-600', icon:'🎄', pernak:['🎄','✨'], ucapan:'Akhir tahun, refleksi dan syukur', header:'Akhir Tahun', color:'#14532d' }
};
function getTemaBulan(bulan){ bulan = bulan || (new Date().getMonth()+1); return TEMA_BULAN[bulan] || TEMA_BULAN[1]; }

const HARI_BESAR_TETAP=[
 {tgl:'01-01',nama:'Tahun Baru',ucapan:'Semoga tahun baru membawa kebahagiaan.',tema:'emas', accent:'border-amber-300', dot:'bg-amber-500', icon:'✨'},
 {tgl:'21-04',nama:'Hari Kartini',ucapan:'Habis gelap terbitlah terang.',tema:'emas', accent:'border-amber-300', dot:'bg-amber-500', icon:'🌸'},
 {tgl:'17-08',nama:'Hari Kemerdekaan RI',ucapan:'Dirgahayu Republik Indonesia ke-80',tema:'kemerdekaan', accent:'border-red-400', dot:'bg-red-600', icon:'🇮🇩'},
 {tgl:'01-10',nama:'Hari Kesaktian Pancasila',ucapan:'Pancasila sakti perekat persatuan.',tema:'merah', accent:'border-red-300', dot:'bg-red-500', icon:'🛡️'},
 {tgl:'02-10',nama:'Hari Batik Nasional',ucapan:'Bangga berkain batik warisan budaya.',tema:'batik', accent:'border-amber-400', dot:'bg-amber-600', icon:'🦚'},
 {tgl:'28-10',nama:'Hari Sumpah Pemuda',ucapan:'Satu nusa, satu bangsa, satu bahasa.',tema:'merah', accent:'border-red-300', dot:'bg-red-500', icon:'🔥'},
 {tgl:'10-11',nama:'Hari Pahlawan',ucapan:'Menghargai jasa pahlawan bangsa.',tema:'merah', accent:'border-slate-300', dot:'bg-slate-600', icon:'🎖️'},
 {tgl:'25-12',nama:'Hari Raya Natal',ucapan:'Damai di hati, damai di bumi.',tema:'natal', accent:'border-emerald-300', dot:'bg-emerald-600', icon:'🎄'}
];
const HARI_RAYA_VAR=[
 {dari:'17-02-2026',sampai:'17-02-2026',nama:'Tahun Baru Imlek',ucapan:'Gong xi fa cai, semoga beruntung.',tema:'imlek', accent:'border-red-300', dot:'bg-red-500', icon:'🧧'},
 {dari:'19-03-2026',sampai:'22-03-2026',nama:'Idul Fitri 1447 H',ucapan:'Minal aidin wal faizin, mohon maaf lahir batin.',tema:'idulfitri', accent:'border-emerald-400', dot:'bg-emerald-600', icon:'🌙'},
 {dari:'26-05-2026',sampai:'28-05-2026',nama:'Idul Adha',ucapan:'Semangat berkurban membawa berkah.',tema:'idadha', accent:'border-emerald-300', dot:'bg-emerald-500', icon:'🕋'}
];
function hariBesarHariIni(){
  const now=new Date(); now.setHours(0,0,0,0); const hasil=[];
  HARI_BESAR_TETAP.forEach(h=>{ const p=h.tgl.split('-'); for(const y of [now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1]){ const d=new Date(y,+p[1]-1,+p[0]); d.setHours(0,0,0,0); const diff=Math.round((now-d)/86400000); if(diff>=-2&&diff<=2){ hasil.push({h:h,diff:diff}); break; } } });
  HARI_RAYA_VAR.forEach(h=>{ const P=s=>{const a=s.split('-');const d=new Date(+a[2],+a[1]-1,+a[0]);d.setHours(0,0,0,0);return d;}; const dari=P(h.dari), sampai=P(h.sampai); const dariX=new Date(dari); dariX.setDate(dariX.getDate()-2); const sampaiX=new Date(sampai); sampaiX.setDate(sampaiX.getDate()+2); if(now>=dariX&&now<=sampaiX){ let diff=0; if(now<dari) diff=Math.round((now-dari)/86400000); else if(now>sampai) diff=Math.round((now-sampai)/86400000); hasil.push({h:h,diff:diff}); } });
  return hasil;
}
function getTemaAktif(){
  try{ 
    const daftar=hariBesarHariIni(); 
    const aktifHariRaya = daftar.find(d=> d.diff>=-1 && d.diff<=2);
    if(aktifHariRaya){
      return {tema:aktifHariRaya.h.tema, accent:aktifHariRaya.h.accent, dot:aktifHariRaya.h.dot, icon:aktifHariRaya.h.icon, pernak:[aktifHariRaya.h.icon], nama:aktifHariRaya.h.nama, data:aktifHariRaya, h:aktifHariRaya.h, isHariBesar:true};
    }
    const bulan=new Date().getMonth()+1;
    const temaBulan=getTemaBulan(bulan);
    return {tema:temaBulan.tema, accent:temaBulan.accent, dot:temaBulan.dot, icon:temaBulan.icon, pernak:temaBulan.pernak, nama:temaBulan.nama, data:{diff:0}, h:{nama:temaBulan.header, ucapan:temaBulan.ucapan, tgl:bulan.toString().padStart(2,'0')+'-'+new Date().getFullYear(), tema:temaBulan.tema, accent:temaBulan.accent, dot:temaBulan.dot, icon:temaBulan.icon}, isBulan:true, bulan:bulan, info:temaBulan};
  }catch(e){ 
    const bulan=new Date().getMonth()+1;
    const temaBulan=getTemaBulan(bulan);
    return {tema:temaBulan.tema, accent:temaBulan.accent, dot:temaBulan.dot, icon:temaBulan.icon, pernak:temaBulan.pernak, nama:temaBulan.nama, h:{nama:temaBulan.header, ucapan:temaBulan.ucapan}, isBulan:true};
  }
}


function applyTemaHariRaya(){
  try{
    const aktif=getTemaAktif();
    document.body.classList.forEach(c=>{ if(c.startsWith('tema-')) document.body.classList.remove(c); });
    if(aktif.tema && aktif.tema!=='biru') document.body.classList.add('tema-'+aktif.tema);
    window.temaAktifHariIni=aktif;
    renderPernakPernik(aktif);
  }catch(e){}
}
function renderPernakPernik(aktif){
  const cont=document.getElementById('pernakPernik'); if(!cont) return; cont.innerHTML=''; if(!aktif || !aktif.pernak || !aktif.pernak.length) return; if(Math.abs(aktif.data.diff)>2) return;
  const jumlah=4;
  for(let i=0;i<jumlah;i++){ const el=document.createElement('div'); el.className='pernak'; el.innerText=aktif.icon; el.style.left=(10+Math.random()*80)+'vw'; el.style.animationDuration=(6+Math.random()*4)+'s'; el.style.animationDelay=Math.random()*3+'s'; el.style.top='-20px'; cont.appendChild(el); }
}
function bannerHariBesarHtml(){
  try{
    const now=new Date();
    const bulanSekarang=now.getMonth()+1;
    const tahunSekarang=now.getFullYear();
    const daftar=hariBesarHariIni();
    let html='';
    
    const hariRayaAktif = daftar.filter(d=> d.diff>=-1 && d.diff<=2 );
    
    if(hariRayaAktif.length){
      hariRayaAktif.sort((a,b)=>a.diff-b.diff);
      
      html+=hariRayaAktif.map(it=>{
        const accent=it.h.accent||'border-amber-300'; 
        const dot=it.h.dot||'bg-amber-600'; 
        const icon=it.h.icon||'🎉';
        const tglInfo=it.h.tgl|| (it.h.dari||'') + (it.h.sampai&&it.h.sampai!==it.h.dari?'–'+it.h.sampai:'');
        const ucapan=it.h.ucapan||'';
        
        let statusBadge='';
        let statusText='';
        if(it.diff===-1){ statusBadge='<span class="text-[9px] bg-blue-100 border border-blue-200 text-blue-800 px-2.5 py-1 rounded-full font-bold">H-1 BESOK</span>'; statusText='Besok'; }
        else if(it.diff===0){ statusBadge='<span class="text-[9px] bg-slate-900 text-white px-2.5 py-1 rounded-full font-bold tracking-wide animate-pulse">HARI INI 🎉</span>'; statusText='Hari Ini'; }
        else if(it.diff===1){ statusBadge='<span class="text-[9px] bg-amber-100 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-full font-bold">H+1 KEMARIN</span>'; statusText='Kemarin'; }
        else if(it.diff===2){ statusBadge='<span class="text-[9px] bg-slate-100 border border-slate-200 text-slate-600 px-2.5 py-1 rounded-full font-bold">H+2</span>'; statusText='2 Hari Lalu'; }
        
        return `<div class="bg-gradient-to-r from-white to-amber-50/50 ${accent} border-l-[5px] rounded-[16px] px-4 py-4 flex justify-between items-center shadow-sm border border-amber-100">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <div class="w-2.5 h-2.5 rounded-full ${dot} ${it.diff===0?'animate-pulse':''}"></div>
              <div class="font-black text-[15px] text-slate-900 tracking-tight">${it.h.nama}</div>
              ${statusBadge}
            </div>
            <div class="text-[13px] text-slate-700 mt-2 font-semibold leading-[1.4] bg-white/80 border border-slate-100 rounded-full px-3 py-1.5 inline-block shadow-sm">${ucapan}</div>
            ${it.diff!==0?`<div class="text-[10px] text-slate-500 mt-1.5 font-medium">${statusText} • ${tglInfo}</div>`:''}
          </div>
          <div class="ml-4 text-right shrink-0 flex flex-col items-end">
            <div class="text-[16px] font-black text-slate-900 bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-full tracking-wide">${tglInfo}</div>
            <div class="text-[26px] mt-2 drop-shadow-sm">${icon}</div>
          </div>
        </div>`;
      }).join('');
    }
    
    const temaBulan=getTemaBulan(bulanSekarang);
    const bulanNames=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    html+=`<div class="bg-white ${temaBulan.accent} border-l-[4px] rounded-[16px] px-4 py-3.5 flex justify-between items-center shadow-sm border border-slate-200">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full ${temaBulan.dot}"></div>
          <div class="font-bold text-[14px] text-slate-900">${bulanNames[bulanSekarang]} ${tahunSekarang}</div>
          <span class="text-[9px] bg-slate-100 border border-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-medium">${temaBulan.header}</span>
        </div>
        <div class="text-[12px] text-slate-600 mt-1.5 font-medium">${temaBulan.ucapan}</div>
      </div>
      <div class="ml-4 text-right shrink-0 flex flex-col items-end">
        <div class="text-[15px] font-black text-slate-900 bg-slate-100 px-3 py-1.5 rounded-full">${String(bulanSekarang).padStart(2,'0')}-${tahunSekarang}</div>
        <div class="text-[20px] mt-1.5">${temaBulan.icon}</div>
      </div>
    </div>`;
    
    if(!html) return '';
    return '<div id="hbBannerWrap" class="px-3 pt-3 space-y-2">'+html+'</div>';

  if(timeMatch){ let sh=parseInt(timeMatch[1]); let eh=parseInt(timeMatch[3]); let diffJam=eh-sh; if(diffJam<0) diffJam+=24; if((sh===6&&eh===15)||(sh===15&&eh===23)||(sh===23&&eh===6)) diffJam-=1; if(diffJam<1) diffJam=1; if(diffJam>8) diffJam=8; autoJam=diffJam; }

    after=after.replace(/ts/gi,'').trim(); if(!after) continue;

    let validNames=[]; let afterLower=after.toLowerCase();
    for(let fullName of daftarNamaLengkap){ let lowFull=fullName.toLowerCase(); if(afterLower.includes(lowFull)){ let regex=new RegExp('\\b'+lowFull.replace(/[^a-z ]/g,'').replace(/\s+/g,'\\s+')+'\\b','i'); if(regex.test(after)||afterLower.includes(lowFull)){ let canonical=DEFAULT_KARYAWAN.find(k=>k.nama.toLowerCase()===fullName.toLowerCase())?.nama||aliasMap[lowFull]||fullName; if(aliasMap[canonical.toLowerCase()]) canonical=aliasMap[canonical.toLowerCase()]; let finalCan=DEFAULT_KARYAWAN.find(k=>k.nama.toLowerCase()===canonical.toLowerCase())?.nama||canonical; if(isValidName(finalCan)&&daftarValid.has(finalCan.toLowerCase())){ validNames.push(finalCan); afterLower=afterLower.replace(lowFull,' '); after=after.replace(new RegExp(fullName,'i'),' '); } } } }
    let names=after.split(',').map(s=>s.trim()).filter(Boolean);

  let rawTglMatch=txt.match(/(\d{1,2})\s*,?\s*(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)\s*(\d{4})/i);

function getBulanLaluInfo(){

  let tahunLalu = now.getFullYear();
  if(bulanLalu===0){ bulanLalu=12; tahunLalu--; } // Jan -> Dec tahun lalu
  // bulanLalu as 1-12

}
function buildRekapTextUntukBulan(bulanNum, tahunNum){
  const bulanNames={1:'Januari',2:'Februari',3:'Maret',4:'April',5:'Mei',6:'Juni',7:'Juli',8:'Agustus',9:'September',10:'Oktober',11:'November',12:'Desember'};

  const map=new Map();
  allData.forEach(r=>{const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!map.has(key)) map.set(key,r);});
  let d=Array.from(map.values()).filter(r=> {
    const parts=r.tanggalNorm.split('-');
    if(parts.length!==3) return false;
    const b=Number(parts[1]); const y=Number(parts[0]);
    return b===Number(bulanNum) && y===Number(tahunNum);
  });
  const m={};
  d.forEach(r=>{const k=normNama(r.nama); if(!m[k]) m[k]={nama:r.nama,totalTUL:0,count:0}; m[k].totalTUL+=Number(r.tul); m[k].count+=1;});
  const grouped=Object.values(m).sort((a,b)=> b.totalTUL - a.totalTUL);
  if(grouped.length===0) return null;
  let blnName=bulanNames[Number(bulanNum)]+' '+tahunNum;
  let text=`*REKAP LEMBUR AREA EF - ${blnName.toUpperCase()}*\n`;
  text+=`Periode: 01-${String(bulanNum).padStart(2,'0')}-${tahunNum} s/d akhir bulan\n`;
  text+=`Generated otomatis tgl 1\n\n`;
  grouped.forEach((g,i)=>{ text+=`${i+1}. ${g.nama} - ${g.totalTUL} TUL (${g.count} hari)\n`; });
  text+=`\nTotal: ${grouped.reduce((s,g)=>s+g.totalTUL,0)} TUL dari ${grouped.length} orang`;
  text+=`\n\n_Dikirim otomatis oleh sistem AREA EF_`;
  return text;
}

function logoutMember(){localStorage.removeItem('member_login');localStorage.removeItem('member_name');isMemberLogin=false;memberName='';render()}

function filteredDataMember(){
  const map=new Map();allData.forEach(r=>{const key=(r.tanggalNorm||r.tanggal)+'|'+normNama(r.nama)+'|'+r.jam;if(!map.has(key))map.set(key,r)});
  let d=Array.from(map.values());
  if(isMemberLogin&&memberName){d=d.filter(r=>normNama(r.nama)===normNama(memberName))}
  return d;
}
function filteredDataByBulan(bulan){
  let d=filteredDataMember();
  if(bulan!=='all'){d=d.filter(r=>{const t=r.tanggalNorm||r.tanggal;const parts=t.split('-');const bln=Number(parts[1]);return bln===Number(bulan)})}
  return d;
}
function groupByTanggal(data){const map={};data.forEach(r=>{const key=r.tanggalNorm||r.tanggal;if(!map[key])map[key]=[];map[key].push(r)});return Object.keys(map).sort((a,b)=>new Date(a.split('-').reverse().join('-'))-new Date(b.split('-').reverse().join('-'))).map(k=>({tanggal:k,rows:map[k]}))}
function groupByKaryawan(data){const map={};data.forEach(r=>{const n=r.nama;if(!map[n])map[n]={nama:n,totalTUL:0,totalHari:new Set(),rows:[]};map[n].totalTUL+=Number(r.tul||0);map[n].totalHari.add(r.tanggalNorm||r.tanggal);map[n].rows.push(r)});return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL)}

async function fetchData(){render();try{const res=await fetch(SYNC_URL);const json=await res.json();allData=json.data||[];try{localStorage.setItem('lembur_data',JSON.stringify(allData))}catch{}render()}catch(e){try{const c=localStorage.getItem('lembur_data');if(c){allData=JSON.parse(c)}}catch{}render()}}

function waAll(){
  const bulan=filterBulan;const data=filteredDataByBulan(bulan);const grouped=groupByKaryawan(data);
  const bulanNames={1:'Januari',2:'Februari',3:'Maret',4:'April',5:'Mei',6:'Juni',7:'Juli',8:'Agustus',9:'September',10:'Oktober',11:'November',12:'Desember'};
  const namaBulan=bulan==='all'?'Semua Bulan':bulanNames[Number(bulan)]||bulan;
  let txt=`*REKAP AREA EF - ${namaBulan}*\n`;
  txt+=`Anggota: ${memberName}\n\n`;
  const total=data.reduce((s,r)=>s+Number(r.tul||0),0);
  txt+=`Total: ${total} TUL\n\n`;
  grouped.forEach((g,i)=>{txt+=`${i+1}. ${g.nama}: ${g.totalTUL} TUL (${g.totalHari.size} hari)\n`});
  txt+=`\nDetail:\n`;
  const byTgl=groupByTanggal(data);
  byTgl.forEach(g=>{txt+=`\n${formatTanggal(g.tanggal)} (${g.rows.reduce((s,r)=>s+Number(r.tul||0),0)} TUL)\n`;g.rows.forEach(r=>{txt+=`- ${r.nama}: ${r.jam}j = ${r.tul} TUL\n`})});
  const url='https://wa.me/?text='+encodeURIComponent(txt);
  window.open(url,'_blank');
}

function render(){
  try{ applyTemaHariRaya(); }catch(e){}
  const hasMember=!!localStorage.getItem('has_registered') || Object.keys(getCustomMemberPass()).length>0;
  const memberNameStored=localStorage.getItem('member_name');
  if(localStorage.getItem('force_daftar')==='1') forceDaftar=true;
  if(!hasMember||!memberNameStored){
    const isFirstTime=forceDaftar || (!localStorage.getItem('has_registered')&&Object.keys(getCustomMemberPass()).length===0);
    if(isFirstTime){
      document.getElementById('app').innerHTML=`<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm shadow-sm border border-slate-200"><div class="text-center mb-5"><div class="w-10 h-10 rounded-full bg-slate-900 mx-auto grid place-items-center text-white font-bold">EF</div><div class="font-semibold text-[15px] mt-3">Daftar Anggota</div><div class="text-[11px] text-slate-500 mt-1">Buat akun baru - AREA EF</div></div><div class="space-y-3"><input id="regNama" type="text" placeholder="Nama (sesuai daftar AREA EF)" class="w-full h-10 rounded-[10px] border border-slate-200 px-3 text-[13px]"><input id="regTgl" type="text" placeholder="DD-MM-YYYY (contoh: 15-08-1995)" class="w-full h-10 rounded-[10px] border border-slate-200 px-3 text-[13px]"><input id="regPass" type="password" placeholder="Password" class="w-full h-10 rounded-[10px] border border-slate-200 px-3 text-[13px]"><input id="regKonf" type="password" placeholder="Konfirmasi Password" class="w-full h-10 rounded-[10px] border border-slate-200 px-3 text-[13px]"><div id="regErr" class="text-[11px] text-red-500"></div><button onclick="daftarAnggota()" class="w-full h-10 rounded-[10px] bg-slate-900 text-white font-medium text-[13px]">Daftar</button><button onclick="showLogin()" class="w-full h-9 text-[12px] text-slate-600 underline">Sudah punya akun? Login</button></div></div></div>`;
      return;
    } else {
      const list=getKaryawanList();
      document.getElementById('app').innerHTML=`<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm shadow-sm border border-slate-200"><div class="text-center mb-5"><div class="font-semibold text-[15px]">Login Anggota</div><div class="text-[11px] text-slate-500 mt-1">Pilih nama & password</div></div><select id="memberSelect" class="w-full h-10 rounded-[10px] border border-slate-200 px-3 text-[13px] mb-3">${list.map(k=>`<option value="${k.nama}">${k.nama}</option>`).join('')}</select><input id="memberPass" type="password" placeholder="Password" class="w-full h-10 rounded-[10px] border border-slate-200 px-3 text-[13px] mb-2"><div id="aerr" class="text-[11px] text-red-500 mb-2"></div><button onclick="loginMember()" class="w-full h-10 rounded-[10px] bg-slate-900 text-white font-medium text-[13px]">Masuk</button><button onclick="showDaftar()" class="w-full h-9 text-[12px] text-slate-600 underline mt-2">Belum punya akun? Daftar</button></div></div>`;
      return;
    }
  }
  const dataAll=filteredDataMember();
  const data=filteredDataByBulan(filterBulan);
  const grouped=groupByTanggal(data);
  const ranking=groupByKaryawan(data);
  const totalTUL=data.reduce((s,r)=>s+Number(r.tul||0),0);
  const totalHari=new Set(data.map(r=>r.tanggalNorm||r.tanggal)).size;
  
  document.getElementById('app').innerHTML=`
    <div class="bg-white border-b border-slate-200 px-4 py-3.5 flex justify-between items-center sticky top-0 z-20">
      <div><div class="font-semibold text-[14px] tracking-tight">AREA EF</div><div class="text-[10px] text-slate-500 mt-0.5">${totalTUL} TUL • ${totalHari} hari • ${memberName}</div></div>
      <button onclick="logoutMember()" class="h-8 px-3.5 rounded-full bg-slate-900 text-white text-[11px]">Keluar</button>
    </div>
    
    <div class="px-3 py-3 flex gap-2 items-center overflow-auto">
      <div class="flex bg-white rounded-full p-1 shadow-sm border border-slate-200">
        <button onclick="activeTab='rekap';render()" class="h-7 px-4 rounded-full text-[11px] font-medium ${activeTab==='rekap'?'bg-slate-900 text-white':'text-slate-500'}">Rekap</button>
        <button onclick="activeTab='input';render()" class="h-7 px-4 rounded-full text-[11px] font-medium ${activeTab==='input'?'bg-slate-900 text-white':'text-slate-500'}">Input</button>
        <button onclick="activeTab='history';render()" class="h-7 px-4 rounded-full text-[11px] font-medium ${activeTab==='history'?'bg-slate-900 text-white':'text-slate-500'}">History</button>
      </div>
      <button onclick="waAll()" class="h-9 px-3.5 rounded-full bg-emerald-600 text-white text-[11px] font-medium ml-auto">Share WA</button>
    </div>
    
    ${bannerHariBesarHtml()}
    
    <div class="p-3 space-y-3">
      <div class="bg-white border border-slate-200 rounded-[16px] p-3 flex justify-between items-center shadow-sm">
        <div class="text-[11px] font-medium text-slate-600">Filter Bulan</div>
        <select onchange="filterBulan=this.value;render()" class="h-8 rounded-full bg-slate-50 border border-slate-200 px-3 text-[12px]"><option value="all" ${filterBulan==='all'?'selected':''}>Semua</option><option value="1" ${filterBulan==='1'?'selected':''}>Jan</option><option value="2" ${filterBulan==='2'?'selected':''}>Feb</option><option value="3" ${filterBulan==='3'?'selected':''}>Mar</option><option value="4" ${filterBulan==='4'?'selected':''}>Apr</option><option value="5" ${filterBulan==='5'?'selected':''}>Mei</option><option value="6" ${filterBulan==='6'?'selected':''}>Jun</option><option value="7" ${filterBulan==='7'?'selected':''}>Jul</option><option value="8" ${filterBulan==='8'?'selected':''}>Agu</option><option value="9" ${filterBulan==='9'?'selected':''}>Sep</option><option value="10" ${filterBulan==='10'?'selected':''}>Okt</option><option value="11" ${filterBulan==='11'?'selected':''}>Nov</option><option value="12" ${filterBulan==='12'?'selected':''}>Des</option></select>
      </div>
      
      ${activeTab==='rekap'?`
        <div class="bg-white border border-slate-200 rounded-[16px] p-4 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <div class="font-semibold text-[13px]">Rekap Pribadi</div>
            <div class="text-[10px] bg-slate-100 px-2 py-1 rounded-full">${filterBulan==='all'?'Semua Bulan':filterBulan}</div>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-50 rounded-[12px] p-3 border border-slate-100"><div class="font-black text-[18px]">${totalTUL}</div><div class="text-[9px] text-slate-500 mt-1">TOTAL TUL</div></div>
            <div class="bg-slate-50 rounded-[12px] p-3 border border-slate-100"><div class="font-black text-[18px]">${totalHari}</div><div class="text-[9px] text-slate-500 mt-1">HARI LEMBUR</div></div>
            <div class="bg-slate-50 rounded-[12px] p-3 border border-slate-100"><div class="font-black text-[18px]">${ranking.length?ranking[0].totalTUL:0}</div><div class="text-[9px] text-slate-500 mt-1">TERTINGGI</div></div>
          </div>
        </div>
        <div class="bg-white border border-slate-200 rounded-[16px] overflow-hidden shadow-sm">
          <div class="px-4 py-3 border-b border-slate-100 font-semibold text-[12px]">Detail Lembur - ${memberName}</div>
          ${grouped.length===0?`<div class="p-8 text-center"><div class="text-[24px] opacity-50">📭</div><div class="font-medium text-[12px] mt-2">Belum ada data</div><div class="text-[10px] text-slate-500 mt-1">Data lembur kamu belum ada di bulan ini</div></div>`:
          grouped.map(g=>`<div class="border-b border-slate-100 last:border-0"><div class="px-4 py-2.5 bg-slate-50/50 flex justify-between"><div class="font-medium text-[12px]">${formatTanggal(g.tanggal)}</div><div class="text-[11px] font-bold text-slate-700">${g.rows.reduce((s,r)=>s+Number(r.tul||0),0)} TUL</div></div><div class="divide-y divide-slate-50">${g.rows.map(r=>`<div class="px-4 py-2.5 flex justify-between items-center"><div><div class="font-medium text-[12px]">${r.nama}</div><div class="text-[10px] text-slate-500 mt-0.5">${r.jam} jam • ${formatTanggal(r.tanggal)}</div></div><div class="text-right"><div class="font-bold text-[13px]">${r.tul}</div><div class="text-[9px] text-slate-500">TUL</div></div></div>`).join('')}</div></div>`).join('')}
        </div>
      `:''}
      
      ${activeTab==='input'?`
        <div class="space-y-3">
          ${grouped.length===0?`<div class="bg-white border border-slate-200 rounded-[16px] p-8 text-center"><div class="text-[24px] opacity-50">📭</div><div class="font-medium text-[12px] mt-2">Belum ada input</div></div>`:
          grouped.map(g=>`<div class="bg-white border border-slate-200 rounded-[14px] overflow-hidden"><div class="px-4 py-2.5 border-b border-slate-100 flex justify-between"><div class="font-medium text-[12px]">${formatTanggal(g.tanggal)}</div><div class="text-[11px] text-slate-500">${g.rows.reduce((s,r)=>s+r.tul,0)} TUL</div></div><div class="divide-y divide-slate-100">${g.rows.map(r=>`<div class="px-4 py-2.5"><div class="font-medium text-[12px]">${r.nama}</div><div class="text-[10px] text-slate-500 mt-0.5">${r.jam}j • ${r.tul} TUL • ${formatTanggal(r.tanggal)}</div></div>`).join('')}</div></div>`).join('')}
        </div>
      `:''}
      
      ${activeTab==='history'?`
        <div class="bg-white border border-slate-200 rounded-[16px] overflow-hidden shadow-sm">
          <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center">
            <div class="font-semibold text-[12px]">History - ${memberName}</div>
            <div class="text-[10px] text-slate-500">${dataAll.length} total data</div>
          </div>
          ${dataAll.length===0?`<div class="p-8 text-center text-[12px] text-slate-500">Belum ada history</div>`:
          groupByTanggal(dataAll).slice(0,20).map(g=>`<div class="px-4 py-2.5 border-b border-slate-50 last:border-0 flex justify-between"><div class="text-[11px]">${formatTanggal(g.tanggal)}</div><div class="text-[11px] font-medium">${g.rows.reduce((s,r)=>s+Number(r.tul||0),0)} TUL</div></div>`).join('')}
        </div>
      `:''}
    </div>
  `;
}
fetchData();

</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
