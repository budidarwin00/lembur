<style>

<div id="app" class="relative z-10"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbwr3utIlkimCQcJln2Gug7D0XOypnazzboyFiv5oZFFOf_Hk_XGyhKm9G2sx0Su1LU/exec';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j);if(isNaN(j)||j<=0||j>24)return 0;return TUL_MAP[j]||j*1.5}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}catch{}return s}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t}
function normNama(n){return String(n||'').trim().toLowerCase()}
const ALIAS_NAMA={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normalisasiNamaAnggota(nama){if(!nama)return'';let raw=String(nama).trim();let key=raw.toLowerCase();if(ALIAS_NAMA[key])return ALIAS_NAMA[key];for(let k in ALIAS_NAMA){if(key.includes(k))return ALIAS_NAMA[k];}return raw.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').trim();}
const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function dedupKaryawanList(arr){const map={};const out=[];for(let k of arr){if(!k||!k.nama)continue;let norm=normalisasiNamaAnggota(k.nama);if(!norm)continue;let key=norm.toLowerCase();if(!map[key]){map[key]=true;out.push({nama:norm,tglLahir:k.tglLahir||''});}}return out.sort((a,b)=>a.nama.localeCompare(b.nama));}
function getKaryawanList(){try{const c=localStorage.getItem('custom_karyawan');if(c){let arr=JSON.parse(c);if(Array.isArray(arr)&&arr.length>0){return dedupKaryawanList(arr);}}}catch{}return dedupKaryawanList(DEFAULT_KARYAWAN_AWAL.slice());}
let allData=[];let memberName=localStorage.getItem('member_name')||'';let filterBulan=String(new Date().getMonth()+1);let forceDaftar=false;
function getCustomMemberPass(){try{return JSON.parse(localStorage.getItem('custom_member_pass')||'{}')}catch{return{}}}
function saveCustomMemberPass(m){try{localStorage.setItem('custom_member_pass',JSON.stringify(m))}catch{}}
function getMemberPass(nama){const c=getCustomMemberPass();if(c[nama])return c[nama];return '1234'}
function setMemberPass(nama,p){const m=getCustomMemberPass();m[nama]=p;saveCustomMemberPass(m)}
function toast(msg){const t=document.createElement('div');t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-[11px] px-5 py-2.5 rounded-full z-[99]';t.innerText=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function bannerHariBesarHtml(){return ''}
function applyTemaHariRaya(){return null}
function daftarAnggota(){
  let nama=normalisasiNamaAnggota((document.getElementById('regNama').value||'').trim());
  const tgl=(document.getElementById('regTgl').value||'').trim();
  const pass=(document.getElementById('regPass').value||'').trim();
  const konf=(document.getElementById('regKonf').value||'').trim();
  const err=document.getElementById('regErr');
  if(!nama){err.innerText='Nama wajib';return}
  if(!tgl){err.innerText='Tanggal lahir wajib';return}
  if(!pass){err.innerText='Password wajib';return}
  if(pass!==konf){err.innerText='Password tidak sama';return}
  const custom=getCustomMemberPass();if(custom[nama]){err.innerText='Nama sudah terdaftar';return}
  setMemberPass(nama,pass);
  localStorage.setItem('has_registered','1');localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama);
  toast('Daftar berhasil');render();
}
function loginMember(){
  let nama=normalisasiNamaAnggota((document.getElementById('memberSelect').value||'').trim());
  const pass=(document.getElementById('memberPass').value||'').trim();
  const err=document.getElementById('aerr');
  const custom=getCustomMemberPass();let valid=false;
  for(let k in custom){if(normalisasiNamaAnggota(k).toLowerCase()===nama.toLowerCase() && custom[k]===pass){valid=true;break;}}
  if(!valid && custom[nama]===pass) valid=true;
  if(!valid && (pass===getMemberPass(nama) || pass==='anggota123')) valid=true;
  if(!valid){err.innerText='Password salah';return}
  localStorage.setItem('member_login','1');localStorage.setItem('member_name',nama);localStorage.setItem('has_registered','1');fetchData();
}
function logoutMember(){localStorage.removeItem('member_login');localStorage.removeItem('member_name');render()}
function showLogin(){forceDaftar=false;localStorage.setItem('force_daftar','0');render()}
function showDaftar(){forceDaftar=true;localStorage.setItem('force_daftar','1');render()}
function filteredDataMember(){
  let d=allData;
  if(filterBulan!=='all'){d=d.filter(r=>Number((r.tanggalNorm||r.tanggal).split('-')[1])===Number(filterBulan))}
  if(memberName){d=d.filter(r=>normalisasiNamaAnggota(r.nama).toLowerCase()===normalisasiNamaAnggota(memberName).toLowerCase())}
  return d;
}
function groupByTanggal(data){const map={};data.forEach(r=>{const key=r.tanggalNorm||r.tanggal;if(!map[key])map[key]=[];map[key].push(r)});return Object.keys(map).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:map[k]}))}
async function fetchData(){
  render();
  try{
    const res=await fetch(SYNC_URL);const json=await res.json();let raw=json.data||json;
    if(Array.isArray(raw)){
      let mapped=raw.map(r=>{let jam=Number(r.jam||0);return{tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:normalisasiNamaAnggota(r.nama||''),jam:jam,tul:calcTUL(jam)}}).filter(x=>x.nama&&x.jam>0);
      // DEDUP otomatis cegah dobel
      const dedupMap={}; const deduped=[];
      mapped.forEach(r=>{ const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!dedupMap[key]){ dedupMap[key]=true; deduped.push(r); } });
      allData=deduped;
    }
    render();
  }catch(e){render();}
}
function exportPDF(){
  try{
    const data=filteredDataMember(); const grouped=groupByTanggal(data); const totalTUL=data.reduce((s,r)=>s+Number(r.tul||0),0);
    const mName=localStorage.getItem('member_name')||'';
    const bulanLabels=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const bulan=filterBulan==='all'?'Semua Bulan':(bulanLabels[Number(filterBulan)]||filterBulan);
    let html='<html><head><meta charset="UTF-8"><title>Export TUL '+mName+'</title><style>body{font-family:Inter,sans-serif;padding:40px;color:#000}h1{font-size:28px;font-weight:300;margin:0}.sub{font-size:11px;color:#999;margin-top:6px;letter-spacing:0.15em}.total{font-size:52px;font-weight:300;margin-top:24px;letter-spacing:-0.03em}.meta{margin-top:20px;border-top:1px solid #eee;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:#888}.group{margin-top:32px}.date{font-size:11px;color:#666;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:14px}.mono{font-family:monospace}.footer{margin-top:48px;border-top:1px solid #eee;padding-top:16px;text-align:center;font-size:9px;color:#bbb;letter-spacing:0.2em}</style></head><body>';
    html+='<h1>'+mName+'</h1><div class="sub">AREA EF • LAPORAN LEMBUR</div><div class="total">'+totalTUL+' TUL</div><div class="meta"><span>Filter: '+bulan+'</span><span>'+new Date().toLocaleDateString('id-ID')+'</span></div>';
    grouped.forEach(function(g){html+='<div class="group"><div class="date">'+formatTanggal(g.tanggal)+'</div>';g.rows.forEach(function(r){html+='<div class="row"><span class="mono">'+r.jam+'j</span><span class="mono">'+r.tul+' TUL</span></div>';});html+='</div>';});
    html+='<div class="footer">AREA EF • ULTRA MINIMAL • EXPORT PDF</div></body></html>';
    const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();w.focus();setTimeout(function(){w.print();},600);}else{toast('Pop-up diblokir, izinkan pop-up');}
  }catch(e){toast('Gagal export');}
}
function render(){
  const hasMember=!!localStorage.getItem('has_registered') || Object.keys(getCustomMemberPass()).length>0;
  const memberNameStored=localStorage.getItem('member_name');
  if(localStorage.getItem('force_daftar')==='1') forceDaftar=true;
  if(!hasMember||!memberNameStored){
    const isFirstTime=forceDaftar || (!localStorage.getItem('has_registered')&&Object.keys(getCustomMemberPass()).length===0);
    if(isFirstTime){
      document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-6"><div class="w-full max-w-[320px]"><div class="mb-10"><div class="text-[10px] tracking-[0.25em] font-medium text-slate-400">AREA EF</div><div class="text-[22px] font-light tracking-tight mt-2">Daftar</div><div class="text-[12px] text-slate-400 mt-1">Buat akun untuk melihat lembur</div></div><div class="space-y-4"><input id="regNama" type="text" placeholder="Nama lengkap" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><input id="regTgl" type="text" placeholder="DD-MM-YYYY" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><input id="regPass" type="password" placeholder="Password" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><input id="regKonf" type="password" placeholder="Konfirmasi" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><div id="regErr" class="text-[11px] text-red-500 min-h-[16px]"></div><button onclick="daftarAnggota()" class="w-full h-[44px] bg-black text-white text-[12px] tracking-wide font-medium rounded-full mt-2">Daftar</button><button onclick="showLogin()" class="w-full text-[11px] text-slate-400 underline mt-6">Sudah punya akun? Login</button></div></div></div>';
      return;
    } else {
      const list=getKaryawanList();
      let opts='';for(let i=0;i<list.length;i++){opts+='<option value="'+list[i].nama+'">'+list[i].nama+'</option>';}
      document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-6"><div class="w-full max-w-[320px]"><div class="mb-10"><div class="text-[10px] tracking-[0.25em] font-medium text-slate-400">AREA EF</div><div class="text-[22px] font-light tracking-tight mt-2">Login</div></div><select id="memberSelect" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><option value="">Pilih nama</option>'+opts+'</select><input id="memberPass" type="password" placeholder="Password" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] mt-4 focus:border-black focus:outline-none"><div id="aerr" class="text-[11px] text-red-500 min-h-[16px] mt-2"></div><button onclick="loginMember()" class="w-full h-[44px] bg-black text-white text-[12px] tracking-wide font-medium rounded-full mt-6">Masuk</button><button onclick="showDaftar()" class="w-full text-[11px] text-slate-400 underline mt-6">Belum punya akun? Daftar</button></div></div>';
      return;
    }
  }
  const data=filteredDataMember(); const grouped=groupByTanggal(data); const totalTUL=data.reduce((s,r)=>s+Number(r.tul||0),0);
  memberName=localStorage.getItem('member_name')||'';
  let html='';
  html+='<div class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center">';
  html+='<div class="text-[10px] tracking-[0.2em] font-medium text-slate-400">AREA EF</div>';
  html+='<div class="text-[13px] font-medium tracking-tight text-black">'+memberName+'</div>';
  html+='<button onclick="logoutMember()" class="text-[11px] text-slate-400 hover:text-black">Keluar</button>';
  html+='</div>';
  html+='<div class="max-w-[520px] mx-auto px-6 py-10">';
  html+='<div class="mb-10"><div class="flex items-baseline gap-3"><div class="mono text-[56px] font-light leading-none tracking-tighter text-black">'+totalTUL+'</div><div class="text-[10px] tracking-[0.2em] font-medium text-slate-400">TUL</div></div>';
  html+='<div class="mt-8 flex gap-2">';
  html+='<select onchange="filterBulan=this.value;render()" class="mono h-[36px] px-4 rounded-full bg-slate-50 border border-slate-200 text-[11px] tracking-wide text-slate-700 focus:outline-none focus:border-black cursor-pointer">';
  const bln=[['all','Semua Bulan'],['1','Januari'],['2','Februari'],['3','Maret'],['4','April'],['5','Mei'],['6','Juni'],['7','Juli'],['8','Agustus'],['9','September'],['10','Oktober'],['11','November'],['12','Desember']];
  for(let i=0;i<bln.length;i++){html+='<option value="'+bln[i][0]+'" '+(filterBulan===bln[i][0]?'selected':'')+'>'+bln[i][1]+'</option>';}
  html+='</select>';
  html+='<button onclick="exportPDF()" class="h-[36px] px-5 rounded-full bg-black text-white text-[11px] tracking-wide font-medium hover:bg-slate-800">Export PDF</button>';
  html+='</div></div>';
  if(grouped.length===0){html+='<div class="py-24 text-center"><div class="mono text-[11px] tracking-[0.2em] text-slate-300">TIDAK ADA DATA</div></div>';}
  else{
    for(let gi=0;gi<grouped.length;gi++){
      const g=grouped[gi];
      html+='<div class="mb-8"><div class="mono text-[11px] tracking-[0.15em] text-slate-500 mb-3">'+formatTanggal(g.tanggal).toUpperCase()+'</div><div class="border-t border-slate-100">';
      for(let ri=0;ri<g.rows.length;ri++){
        const r=g.rows[ri];
        html+='<div class="flex justify-between items-center py-4 border-b border-slate-50"><div class="mono text-[15px] font-light text-black">'+String(r.jam).padStart(2,'0')+'j</div><div class="mono text-[14px] font-light text-slate-500">'+r.tul+'</div></div>';
      }
      html+='</div></div>';
    }
  }
  html+='<div class="mt-16 pt-8 border-t border-slate-100 text-center"><div class="mono text-[9px] tracking-[0.2em] text-slate-300">AREA EF • ULTRA MINIMAL</div></div>';
  html+='</div>';
  document.getElementById('app').innerHTML=html;
}
fetchData();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
