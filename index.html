<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap lembur & OT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5cHnAw-eyp-8KPmIhWijZbGDofMhjrSkibD-23AEBimCeT8m9msRm63AGur7N1wWpXw/exec';
const TUL={2:3.5,3:5.5,4:7.5,6:12,7:14,8:16};
const getTUL=j=>TUL[j]||j*2;

let karyawan=JSON.parse(localStorage.getItem('rk_kar')||'null')||[{nik:'425',nama:'Budi',pass:'0425'},{nik:'1',nama:'Kk',pass:'1'}];
let user=JSON.parse(localStorage.getItem('rk_user')||'null'); // auto-login kalau pernah centang Ingat Saya
let rekapSheet=[];
let rekapLokal=JSON.parse(localStorage.getItem('rk_rekap')||'[]');
let filterBulan=String(new Date().getMonth()+1);
let filterTahun=String(new Date().getFullYear());
let loginTab='login'; let toast=''; let showPassModal=false; let loading=false;

function normNik(n){ return String(n||'').toUpperCase().trim().replace(/^0+/,'') || '0'; }
function saveLokal(){ localStorage.setItem('rk_kar',JSON.stringify(karyawan)); localStorage.setItem('rk_rekap',JSON.stringify(rekapLokal)); }
function showToast(m){ toast=m; render(); setTimeout(()=>{toast=''; render();},2500); }

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
    window[cb]=(data)=>{ delete window[cb]; document.getElementById(cb)?.remove(); resolve(data); };
    const s=document.createElement('script'); s.id=cb;
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();
    s.onerror=()=>{ delete window[cb]; s.remove(); reject(new Error('fail')); };
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ delete window[cb]; s.remove(); reject(new Error('Timeout')); } },8000);
  });
}

async function fetchSheetData(){
  loading=true; render();
  try{
    const data = await jsonp(SYNC_URL+'?action=read');
    if(Array.isArray(data)){
      const uNorm = normNik(user?.nik||'');
      rekapSheet = data.filter(x=> normNik(x.nik)===uNorm);
    }
  }catch(e){}
  loading=false; render();
}

function handleLogin(){
  const nik=document.getElementById('lnik').value.trim();
  const pass=document.getElementById('lpass').value.trim();
  const ingat=document.getElementById('ingatSaya')?.checked;
  const k=karyawan.find(x=> normNik(x.nik)===normNik(nik) && x.pass===pass);
  if(k){
    user={nik:k.nik,nama:k.nama};
    if(ingat){ localStorage.setItem('rk_user', JSON.stringify(user)); }
    else { localStorage.removeItem('rk_user'); }
    fetchSheetData();
  } else document.getElementById('lerr').innerText='NPK/password salah';
}
function handleDaftar(){
  const nama=document.getElementById('rnama').value.trim();
  const nik=document.getElementById('rnik').value.trim().toUpperCase();
  const pass=document.getElementById('rpass').value;
  const pass2=document.getElementById('rpass2').value;
  const err=document.getElementById('rerr');
  if(!nama||!nik||!pass){err.innerText='Nama, NPK, password wajib';return;}
  if(pass.length<4){err.innerText='Min 4 karakter';return;}
  if(pass!==pass2){err.innerText='Konfirmasi tidak sama';return;}
  if(karyawan.some(x=> normNik(x.nik)===normNik(nik) )){err.innerText='NPK sudah ada';return;}
  karyawan.push({nik,nama,pass}); saveLokal(); showToast('Daftar OK'); loginTab='login'; render();
}
function togglePassModal(){ showPassModal=!showPassModal; render(); }
async function handleGantiPass(){
  const oldP=document.getElementById('oldPass').value;
  const newP=document.getElementById('newPass').value;
  const newP2=document.getElementById('newPass2').value;
  const err=document.getElementById('perr');
  const k=karyawan.find(x=> normNik(x.nik)===normNik(user.nik) );
  if(k.pass!==oldP){ err.innerText='Password lama salah'; return; }
  if(!newP || newP.length<4){ err.innerText='Min 4 karakter'; return; }
  if(newP!==newP2){ err.innerText='Konfirmasi tidak sama'; return; }
  k.pass=newP; saveLokal();
  try{ await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resetPass',nik: normNik(user.nik), newPass:newP})}); }catch{}
  showPassModal=false; showToast('✅ Password diganti'); render();
}
async function syncToSheet(data){
  try{
    await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({tanggal:data.tanggal,nik: normNik(data.nik), nama:data.nama,jam:data.jam,tul:data.tul})});
    setTimeout(fetchSheetData, 1000);
  }catch{}
}
async function handleInput(){
  const tgl=document.getElementById('itgl').value;
  const jam=parseInt(document.getElementById('ijam').value);
  if(!tgl||!jam) return showToast('Isi tanggal & jam');
  const newData={id:Date.now().toString(),tanggal:tgl,nik: normNik(user.nik), nama:user.nama,jam,tul:getTUL(jam)};
  rekapLokal.unshift(newData); saveLokal(); showToast(`${jam} jam disimpan`); await syncToSheet(newData); render();
}

async function hapusTransaksi(tgl, jam){
  if(!confirm(`Hapus transaksi ${tgl} - ${jam} jam?\nData akan terhapus permanen dari Sheet.`)) return;
  try{
    const delUrl = `${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(tgl)}&nik=${encodeURIComponent(normNik(user.nik))}&jam=${encodeURIComponent(jam)}&t=${Date.now()}`;
    const res = await jsonp(delUrl);
    rekapSheet = rekapSheet.filter(r=> !(r.tanggal===tgl && r.jam===jam));
    rekapLokal = rekapLokal.filter(r=> !(r.tanggal===tgl && r.jam===jam));
    localStorage.setItem('rk_rekap', JSON.stringify(rekapLokal));
    showToast(`🗑️ Dihapus ${res.deleted||1} data`);
  }catch(e){
    try{
      await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'deleteTransaksi', tanggal: tgl, nik: normNik(user.nik), jam: jam})});
      rekapSheet = rekapSheet.filter(r=> !(r.tanggal===tgl && r.jam===jam));
      rekapLokal = rekapLokal.filter(r=> !(r.tanggal===tgl && r.jam===jam));
      localStorage.setItem('rk_rekap', JSON.stringify(rekapLokal));
      showToast('🗑️ Dihapus');
    }catch{ showToast('❌ Gagal hapus'); }
  }
  render();
  setTimeout(fetchSheetData, 1200);
}

function getDisplayData(){
  let data = rekapSheet.map(r=>{
    let tul = Number(r.tul||0); if(!tul) tul = getTUL(Number(r.jam||0));
    return {tanggal:r.tanggal, nik:r.nik, nama:r.nama, jam:r.jam, tul:tul};
  });
  const seen={}; const uniq=[];
  for(const r of data){ const key=r.tanggal+'|'+normNik(r.nik)+'|'+r.jam; if(!seen[key]){ seen[key]=true; uniq.push(r); } }
  let filtered=uniq;
  if(filterBulan!=='all') filtered=filtered.filter(x=> String(parseInt(x.tanggal.split('-')[1]))===String(parseInt(filterBulan)));
  if(filterTahun!=='all') filtered=filtered.filter(x=> x.tanggal.split('-')[0]===filterTahun);
  filtered.sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));
  return filtered;
}

function render(){
  const app=document.getElementById('app');
  if(!user){
    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-zinc-900">
      <div class="w-full max-w-[360px] bg-white rounded-[22px] p-5 shadow-2xl">
        <h1 class="font-bold text-[16px]">Rekap lembur & OT</h1>
        <div class="mt-3 flex gap-1 p-1 bg-zinc-100 rounded-full">
          <button onclick="loginTab='login';render()" class="flex-1 h-8 rounded-full text-[12px] font-bold ${loginTab==='login'?'bg-white shadow border':''}">Login</button>
          <button onclick="loginTab='daftar';render()" class="flex-1 h-8 rounded-full text-[12px] font-bold ${loginTab==='daftar'?'bg-white shadow border':''}">Daftar</button>
        </div>
        ${loginTab==='login'?`<div class="mt-4 space-y-3"><input id="lnik" placeholder="NPK (425)" class="w-full h-10 rounded-xl border px-3 text-[14px]"><input id="lpass" type="password" placeholder="Password" class="w-full h-10 rounded-xl border px-3 text-[14px]"><div class="flex items-center gap-2"><input id="ingatSaya" type="checkbox" class="w-4 h-4 rounded"><label for="ingatSaya" class="text-[12px] text-zinc-600">Ingat Saya (auto-login di HP ini)</label></div><div id="lerr" class="text-[11px] text-red-600"></div><button onclick="handleLogin()" class="w-full h-10 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">Masuk</button><div class="text-[10px] text-zinc-400 text-center">Tanpa centang = setiap buka web harus login lagi (aman untuk HP bersama)</div></div>`:`<div class="mt-4 space-y-2"><input id="rnama" placeholder="Nama Panggilan" class="w-full h-10 rounded-xl border px-3 text-[14px]"><input id="rnik" placeholder="NPK" class="w-full h-10 rounded-xl border px-3 text-[14px] font-mono uppercase"><input id="rpass" type="password" placeholder="Password min 4" class="w-full h-10 rounded-xl border px-3 text-[14px]"><input id="rpass2" type="password" placeholder="Ulang Password" class="w-full h-10 rounded-xl border px-3 text-[14px]"><div id="rerr" class="text-[11px] text-red-600"></div><button onclick="handleDaftar()" class="w-full h-10 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">Daftar</button></div>`}
      </div>
    </div>`;return;
  }
  const data=getDisplayData();
  const totalJam=data.reduce((a,b)=>a+b.jam,0);
  const totalTUL=data.reduce((a,b)=>a+b.tul,0);
  const labelBulan = filterBulan==='all'?'Semua':['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][parseInt(filterBulan)]||filterBulan;
  const tahunList=['2026','2025','2024'];

  app.innerHTML=`<div class="max-w-[520px] mx-auto min-h-screen bg-white">
    <div class="px-4 h-[52px] flex justify-between items-center border-b sticky top-0 bg-white z-10">
      <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-zinc-900 text-white grid place-items-center font-bold text-[11px]">${user.nama[0]}</div><div><div class="font-bold text-[13px]">${user.nama}</div><div class="text-[10px] text-zinc-500">${user.nik} • ${labelBulan}</div></div></div>
      <div class="flex gap-1.5"><button onclick="fetchSheetData()" class="h-8 w-8 rounded-full bg-zinc-100 border grid place-items-center text-[11px]">🔄</button><button onclick="togglePassModal()" class="h-8 w-8 rounded-full bg-zinc-100 border grid place-items-center text-[11px]">🔑</button><button onclick="localStorage.removeItem('rk_user');user=null;rekapSheet=[];render()" class="h-8 px-3 rounded-full bg-zinc-900 text-white text-[11px] font-bold">Logout</button></div>
    </div>
    <div class="p-3 space-y-3">
      ${showPassModal ? `<div class="rounded-[18px] border bg-white p-4 shadow-lg"><div class="flex justify-between items-center"><div class="font-bold text-[13px]">Ganti Password</div><button onclick="togglePassModal()" class="w-7 h-7 rounded-full bg-zinc-100 grid place-items-center">✕</button></div><div class="mt-3 space-y-2"><input id="oldPass" type="password" placeholder="Password Lama" class="w-full h-10 rounded-xl border px-3 text-[13px] bg-zinc-50"><input id="newPass" type="password" placeholder="Password Baru" class="w-full h-10 rounded-xl border px-3 text-[13px] bg-zinc-50"><input id="newPass2" type="password" placeholder="Ulang Baru" class="w-full h-10 rounded-xl border px-3 text-[13px] bg-zinc-50"><div id="perr" class="text-[11px] text-red-600"></div><button onclick="handleGantiPass()" class="w-full h-10 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">Simpan</button></div></div>` : ''}
      <div class="grid grid-cols-2 gap-2">
        <div class="rounded-[16px] bg-zinc-900 text-white p-3.5"><div class="text-[9px] uppercase opacity-60">TOTAL JAM • ${labelBulan.toUpperCase()} 2026</div><div class="text-[26px] font-bold mt-1">${totalJam}</div><div class="text-[10px] opacity-60 mt-1">${data.length} hari lembur</div></div>
        <div class="rounded-[16px] bg-indigo-600 text-white p-3.5"><div class="text-[9px] uppercase opacity-70">TOTAL TUL • ${labelBulan.toUpperCase()} 2026</div><div class="text-[26px] font-bold mt-1">${totalTUL}</div><div class="text-[10px] opacity-70 mt-1">poin TUL</div></div>
      </div>
      <div class="rounded-[18px] border bg-white p-3"><div class="font-bold text-[12px]">Input Lembur</div><div class="mt-3 grid grid-cols-2 gap-2"><input id="itgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px]"><select id="ijam" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-bold"><option value="8">8 jam</option><option value="7">7 jam</option><option value="6">6 jam</option><option value="4">4 jam</option><option value="3" selected>3 jam</option><option value="2">2 jam</option></select></div><button onclick="handleInput()" class="mt-3 w-full h-10 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">simpan</button></div>
      <div class="rounded-[18px] border bg-white overflow-hidden">
        <div class="px-3.5 py-3 border-b flex justify-between items-center"><div class="font-bold text-[12px]">Riwayat Lembur</div><div class="text-[10px] text-zinc-500">${data.length} data</div></div>
        <div class="px-3 py-2 grid grid-cols-2 gap-2"><select onchange="filterBulan=this.value;render()" class="w-full h-9 rounded-xl border bg-zinc-50 px-3 text-[12px] font-semibold"><option value="all" ${filterBulan==='all'?'selected':''}>Semua Bulan</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${filterBulan==i+1?'selected':''}>${['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][i+1]}</option>`).join('')}</select><select onchange="filterTahun=this.value;render()" class="w-full h-9 rounded-xl border bg-zinc-50 px-3 text-[12px] font-semibold"><option value="all" ${filterTahun==='all'?'selected':''}>Semua</option>${tahunList.map(t=>`<option value="${t}" ${filterTahun===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="divide-y">
          ${data.length===0?`<div class="p-8 text-center text-[12px] text-zinc-400">Belum ada riwayat lembur</div>`:
            data.map(r=>{
              const d=new Date(r.tanggal);
              const tgl=d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
              return `<div class="px-3.5 py-3 flex items-center gap-2">
                <div class="flex-1"><div class="font-bold text-[13px]">${tgl}</div><div class="flex gap-1.5 mt-1"><span class="px-2.5 py-0.5 rounded-full bg-zinc-100 border text-[11px]">${r.jam} jam</span><span class="px-2.5 py-0.5 rounded-full bg-indigo-600 text-white text-[11px] font-bold">${r.tul} TUL</span></div></div>
                <button onclick="hapusTransaksi('${r.tanggal}',${r.jam})" class="h-8 px-3 rounded-full bg-red-50 border border-red-200 text-red-600 text-[11px] font-bold">Hapus</button>
              </div>`;
            }).join('')}
        </div>
      </div>
    </div>
    ${toast?`<div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-4 py-2 rounded-full text-[11px]">${toast}</div>`:''}
  </div>`;
}
if(user) fetchSheetData(); else render();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
