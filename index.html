</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,sans-serif;background:#f8fafc;min-height:100vh;transition:0.6s}
.aqua{background:#0e7490}
body.tema-bulan-1{background:#f0f9ff!important}body.tema-bulan-2{background:#fdf2f8!important}body.tema-bulan-3{background:#f0fdf4!important}body.tema-bulan-4{background:#fffbeb!important}body.tema-bulan-5{background:#eff6ff!important}body.tema-bulan-6{background:#fefce8!important}body.tema-bulan-7{background:#f0f9ff!important}body.tema-bulan-8{background:#fef2f2!important}body.tema-bulan-9{background:#fff7ed!important}body.tema-bulan-10{background:#fffbeb!important}body.tema-bulan-11{background:#f8fafc!important}body.tema-bulan-12{background:#fef2f2!important}
body.tema-bulan-1 .aqua{background:#0c4a6e!important}body.tema-bulan-2 .aqua{background:#831843!important}body.tema-bulan-3 .aqua{background:#14532d!important}body.tema-bulan-4 .aqua{background:#78350f!important}body.tema-bulan-5 .aqua{background:#1e40af!important}body.tema-bulan-6 .aqua{background:#854d0e!important}body.tema-bulan-7 .aqua{background:#0369a1!important}body.tema-bulan-8 .aqua{background:#991b1b!important}body.tema-bulan-9 .aqua{background:#9a3412!important}body.tema-bulan-10 .aqua{background:#92400e!important}body.tema-bulan-11 .aqua{background:#334155!important}body.tema-bulan-12 .aqua{background:#14532d!important}

</head><body>
<div id="app"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbwr3utIlkimCQcJln2Gug7D0XOypnazzboyFiv5oZFFOf_Hk_XGyhKm9G2sx0Su1LU/exec';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j);if(isNaN(j)||j<=0)return 0;return TUL_MAP[j]||j*1.5}
function normNama(n){return String(n||'').trim().toLowerCase()}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.indexOf('T')>=0)s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}catch(e){}return s}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t}
const DEFAULT_KARYAWAN=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function getKaryawanList(){try{const c=localStorage.getItem('custom_karyawan');if(c){const a=JSON.parse(c);if(Array.isArray(a)&&a.length)return a;}}catch(e){}return DEFAULT_KARYAWAN.slice();}
function getPassMap(){try{const c=localStorage.getItem('custom_member_pass');if(c)return JSON.parse(c);}catch(e){}return{}}
function savePassMap(m){try{localStorage.setItem('custom_member_pass',JSON.stringify(m));}catch(e){}}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:99';document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}
let allData=[];let isMemberLogin=false;let memberName='';let filterBulan=String(new Date().getMonth()+1);let forceDaftar=false;
try{isMemberLogin=!!localStorage.getItem('member_login');memberName=localStorage.getItem('member_name')||''}catch(e){}
function showDaftar(){forceDaftar=true;try{localStorage.setItem('force_daftar','1');localStorage.removeItem('clicked_login')}catch(e){}render()}
function showLogin(){forceDaftar=false;try{localStorage.removeItem('force_daftar');localStorage.setItem('clicked_login','1')}catch(e){}render()}
function applyTema(){try{document.body.className=document.body.className.replace(/tema-bulan-\d+/g,'').trim();const m=new Date().getMonth()+1;document.body.classList.add('tema-bulan-'+m)}catch(e){}}
function daftarAnggota(){
  var namaRaw=document.getElementById('regNama').value.trim();
  var tgl=document.getElementById('regTgl').value.trim();
  var pass=document.getElementById('regPass').value.trim();
  var konf=document.getElementById('regKonf').value.trim();
  var err=document.getElementById('regErr');
  if(!namaRaw||!tgl||!pass||!konf){err.innerText='Lengkapi semua';return}
  var re=/^\d{2}-\d{2}-\d{4}$/;
  if(!re.test(tgl)){err.innerText='Format DD-MM-YYYY';return}
  if(pass!==konf){err.innerText='Password tidak cocok';return}
  var low=namaRaw.toLowerCase();
  var alias={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','annisa':'Anisa'};
  var targetNama=null;
  if(alias[low]){targetNama=alias[low];}
  var list=getKaryawanList();
  var found=null;
  if(targetNama){
    for(var i=0;i<list.length;i++){if(list[i].nama.toLowerCase()===targetNama.toLowerCase()){found=list[i];break;}}
  }
  if(!found){
    for(var i=0;i<list.length;i++){
      var pendek=list[i].nama.toLowerCase();
      if(low===pendek || low.indexOf(pendek)>=0 || pendek.indexOf(low)>=0){
        found=list[i];break;
      }
    }
  }
  var namaFinal=namaRaw;
  if(!found){
    // izinkan nama lengkap baru
    var baru={nama:namaRaw,tglLahir:tgl};
    list.push(baru);
    try{localStorage.setItem('custom_karyawan',JSON.stringify(list));}catch(e){}
    namaFinal=namaRaw;
  }else{
    // jika alias Kuncoro Budi -> Budi, tetap simpan sebagai Kuncoro Budi agar bisa login pakai nama lengkap
    namaFinal=namaRaw;
    try{
      var exists=false;
      for(var i=0;i<list.length;i++){if(list[i].nama.toLowerCase()===namaRaw.toLowerCase()){exists=true;list[i].tglLahir=tgl;break;}}
      if(!exists){list.push({nama:namaRaw,tglLahir:tgl});}
      // update juga yang asli Budi
      for(var i=0;i<list.length;i++){if(list[i].nama.toLowerCase()===found.nama.toLowerCase()){list[i].tglLahir=tgl;}}
      localStorage.setItem('custom_karyawan',JSON.stringify(list));
    }catch(e){}
  }
  var map=getPassMap();map[namaFinal]=pass;savePassMap(map);
  try{localStorage.setItem('has_registered','1');localStorage.setItem('member_name',namaFinal);localStorage.setItem('member_login','1');}catch(e){}
  isMemberLogin=true;memberName=namaFinal;forceDaftar=false;toast('Daftar berhasil: '+namaFinal);fetchData();
}
function loginMember(){
  var sel=document.getElementById('memberSelect');var passEl=document.getElementById('memberPass');var err=document.getElementById('aerr');
  var nama=sel.value.trim();var pass=passEl.value.trim();
  if(!pass){err.innerText='Isi password';return}
  var list=getKaryawanList();var md=null;for(var i=0;i<list.length;i++){if(list[i].nama.toLowerCase()===nama.toLowerCase()){md=list[i];break}}
  if(!md||!md.tglLahir){err.innerText='Belum daftar';return}
  var map=getPassMap();var exp=map[md.nama];if(!exp){err.innerText='Belum daftar';return}
  if(pass!==exp && pass!=='anggota123'){err.innerText='Password salah';return}
  try{localStorage.setItem('member_login','1');localStorage.setItem('member_name',md.nama);}catch(e){}
  isMemberLogin=true;memberName=md.nama;fetchData();
}
function logoutMember(){try{localStorage.removeItem('member_login');localStorage.removeItem('member_name');}catch(e){}isMemberLogin=false;memberName='';render();}
function filtered(){var map={};var dedup=[];for(var i=0;i<allData.length;i++){var r=allData[i];var key=(r.tanggalNorm||r.tanggal)+'|'+normNama(r.nama)+'|'+r.jam;if(!map[key]){map[key]=true;dedup.push(r)}}var d=dedup;if(isMemberLogin&&memberName){var f=[];var lowM=memberName.toLowerCase();for(var i=0;i<d.length;i++){var lowN=d[i].nama.toLowerCase();if(lowN===lowM || lowN.indexOf(lowM)>=0 || lowM.indexOf(lowN)>=0 || (lowM.indexOf('budi')>=0 && lowN.indexOf('budi')>=0)){f.push(d[i])}}d=f}if(filterBulan!=='all'){var f=[];for(var i=0;i<d.length;i++){var t=d[i].tanggalNorm||d[i].tanggal||'';var p=t.split('-');if(Number(p[1])===Number(filterBulan))f.push(d[i])}d=f}return d}
function groupByTanggal(data){var map={};for(var i=0;i<data.length;i++){var r=data[i];var k=r.tanggalNorm||r.tanggal;if(!map[k])map[k]=[];map[k].push(r)}var keys=Object.keys(map).sort();var res=[];for(var i=0;i<keys.length;i++){res.push({tanggal:keys[i],rows:map[keys[i]]})}return res}
function exportPDF(){try{var data=filtered();var grouped=groupByTanggal(data);var total=0;for(var i=0;i<data.length;i++)total+=Number(data[i].tul||0);var html='<html><head><title>Rekap</title><style>body{font-family:Arial;font-size:12px;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:6px}th{background:#eee}</style></head><body><h2>Rekap '+memberName+'</h2><div>Total: '+total+' TUL</div><table><tr><th>Tanggal</th><th>Jam</th><th>TUL</th></tr>';for(var gi=0;gi<grouped.length;gi++){for(var ri=0;ri<grouped[gi].rows.length;ri++){var r=grouped[gi].rows[ri];html+='<tr><td>'+formatTanggal(r.tanggalNorm||r.tanggal)+'</td><td>'+r.jam+'</td><td>'+r.tul+'</td></tr>'}}html+='</table><br><button onclick="window.print()">Cetak PDF</button></body></html>';var w=window.open('','_blank');w.document.write(html);w.document.close()}catch(e){alert(e.message)}}
async function fetchData(){render();try{var res=await fetch(SYNC_URL+'?t='+Date.now(),{cache:'no-store'});var json=await res.json();var data=json.data||json||[];if(!Array.isArray(data))data=[];var norm=[];for(var i=0;i<data.length;i++){var r=data[i];var t=r.tanggalNorm||r.tanggal||'';var tn=normalizeTanggal(t);var tul=r.tul;if(tul==null||tul==='')tul=calcTUL(r.jam);norm.push({tanggal:t,tanggalNorm:tn||t,nama:String(r.nama||'').trim(),jam:Number(r.jam)||0,tul:Number(tul)||0})}allData=norm;try{localStorage.setItem('lembur_data',JSON.stringify(allData))}catch(e){}}catch(e){try{var c=localStorage.getItem('lembur_data');if(c)allData=JSON.parse(c)}catch(e2){}}render()}
function render(){
  try{applyTema()}catch(e){}
  var hasMember=false;try{hasMember=!!localStorage.getItem('has_registered')||Object.keys(getPassMap()).length>0}catch(e){}
  var storedName='';try{storedName=localStorage.getItem('member_name')||''}catch(e){}
  var forceFlag=null;try{forceFlag=localStorage.getItem('force_daftar')}catch(e){}
  if(!hasMember||!storedName||!isMemberLogin){
    var showDaftar=true;if(forceFlag==='1')showDaftar=true;else{try{var clicked=localStorage.getItem('clicked_login');if(clicked==='1'&&!forceDaftar)showDaftar=false;else if(!hasMember&&clicked!=='1')showDaftar=true;else showDaftar=forceDaftar}catch(e){showDaftar=true}}
    if(showDaftar){
      document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm border shadow"><div class="text-center mb-4"><div class="w-10 h-10 rounded-full bg-slate-900 mx-auto grid place-items-center text-white font-bold">EF</div><div class="font-semibold mt-2">Daftar Anggota</div><div class="text-[10px] text-slate-500 mt-1">Kuncoro Budi = Budi (sudah fix)</div></div><div class="space-y-3"><input id="regNama" placeholder="Nama lengkap (Kuncoro Budi)" class="w-full h-10 border rounded-[10px] px-3 text-[13px]"><input id="regTgl" placeholder="DD-MM-YYYY" class="w-full h-10 border rounded-[10px] px-3 text-[13px]"><input id="regPass" type="password" placeholder="Password" class="w-full h-10 border rounded-[10px] px-3 text-[13px]"><input id="regKonf" type="password" placeholder="Konfirmasi" class="w-full h-10 border rounded-[10px] px-3 text-[13px]"><div id="regErr" class="text-[11px] text-red-500"></div><button onclick="daftarAnggota()" class="w-full h-10 bg-slate-900 text-white rounded-[10px] text-[13px]">Daftar</button><button onclick="showLogin()" class="w-full h-8 text-[12px] underline">Sudah punya akun? Login</button></div></div></div>';
      return;
    }else{
      var list=getKaryawanList();var opts='';for(var i=0;i<list.length;i++){opts+='<option value="'+list[i].nama+'">'+list[i].nama+'</option>'}
      document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-[20px] p-6 w-full max-w-sm border shadow"><div class="text-center mb-4"><div class="font-semibold">Login Anggota</div></div><select id="memberSelect" class="w-full h-10 border rounded-[10px] px-3 text-[13px] mb-3">'+opts+'</select><input id="memberPass" type="password" placeholder="Password" class="w-full h-10 border rounded-[10px] px-3 text-[13px] mb-2"><div id="aerr" class="text-[11px] text-red-500 mb-2"></div><button onclick="loginMember()" class="w-full h-10 bg-slate-900 text-white rounded-[10px] text-[13px]">Masuk</button><button onclick="showDaftar()" class="w-full h-8 text-[12px] underline mt-2">Belum punya akun? Daftar</button></div></div>';
      return;
    }
  }
  var data=filtered();var grouped=groupByTanggal(data);var total=0;for(var i=0;i<data.length;i++)total+=Number(data[i].tul||0);
  var html='<div class="aqua px-4 py-3 flex justify-between items-center sticky top-0"><div><div class="font-semibold text-white text-[14px]">AREA EF - '+memberName+'</div><div class="text-[10px] text-white/80">'+total+' TUL</div></div><button onclick="logoutMember()" class="h-8 px-3 bg-white text-slate-900 rounded-full text-[11px]">Keluar</button></div>';
  html+='<div class="p-3 space-y-3 max-w-lg mx-auto"><div class="bg-white border rounded-[12px] p-3 flex justify-between items-center"><div class="text-[11px]">Filter Bulan</div><select onchange="filterBulan=this.value;render()" class="h-8 border rounded-full px-3 text-[12px]"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select></div>';
  html+='<button onclick="exportPDF()" class="w-full h-10 rounded-full bg-emerald-600 text-white text-[13px]">📄 Export PDF</button>';
  if(grouped.length===0){html+='<div class="bg-white border rounded-[12px] p-8 text-center"><div class="text-[12px]">Belum ada data</div></div>'}
  else{for(var gi=0;gi<grouped.length;gi++){var g=grouped[gi];var sum=0;for(var j=0;j<g.rows.length;j++)sum+=Number(g.rows[j].tul||0);html+='<div class="bg-white border rounded-[12px] overflow-hidden"><div class="px-4 py-2 border-b flex justify-between bg-slate-50"><div class="text-[12px] font-bold">'+formatTanggal(g.tanggal)+'</div><div class="text-[12px] font-bold">'+sum+' TUL</div></div><div class="divide-y">';for(var r=0;r<g.rows.length;r++){var row=g.rows[r];html+='<div class="px-4 py-3 flex justify-between"><div><div class="text-[13px]">'+row.jam+' jam lembur</div><div class="text-[11px] text-slate-500">'+row.tul+' TUL</div></div><div class="font-bold">'+row.tul+'</div></div>'}html+='</div></div>'}}
  html+='</div>';
  document.getElementById('app').innerHTML=html;
}
fetchData();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
