const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
const calcTUL=j=>TUL_MAP[j]||j*2;
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch{}return s;}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t;}
const DEFAULT_KARYAWAN=[{nama:'Nia'},{nama:'Aditya'},{nama:'Anisa'},{nama:'Aaf'},{nama:'Syarif'},{nama:'Budi'},{nama:'Topik'},{nama:'Yudi'},{nama:'Dozen'},{nama:'Putri'},{nama:'Arief'},{nama:'Anah'},{nama:'Supriyadi'},{nama:'Eka'},{nama:'Nely'},{nama:'Zaelani'}];
let allData=[]; let currentUser=null; let syncStatus='● Sinkron'; let selectedLoginName=null; let filterBulan='all'; let filterTahun='all';
function getPasswordKey(nama){return 'pwd_'+normNama(nama);}
function getDefaultPassword(){return '1234';}
function getStoredPassword(nama){return localStorage.getItem(getPasswordKey(nama)) || getDefaultPassword();}
function setStoredPassword(nama,pwd){localStorage.setItem(getPasswordKey(nama), pwd);}
function toast(m){const t=document.createElement('div');t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#0077b6] text-white px-5 py-3 rounded-full text-[12px] font-bold z-50';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now(); window[cb]=(d)=>{delete window[cb]; document.getElementById(cb)?.remove(); if(Array.isArray(d))try{localStorage.setItem('cache_lembur_karyawan',JSON.stringify(d));}catch{} resolve(d);}; const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now(); s.onerror=()=>{delete window[cb]; s.remove(); try{const c=localStorage.getItem('cache_lembur_karyawan'); if(c){resolve(JSON.parse(c)); return;}}catch{} reject(new Error('Offline'));}; document.body.appendChild(s); setTimeout(()=>{if(window[cb]){delete window[cb]; s.remove(); try{const c=localStorage.getItem('cache_lembur_karyawan'); if(c){resolve(JSON.parse(c)); return;}}catch{} resolve([]);}},2500);});}
async function fetchData(){
  try{const c=localStorage.getItem('cache_lembur_karyawan'); if(c && allData.length===0){const j=JSON.parse(c); allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})); syncStatus='● Cache'; render();}}catch{}
  syncStatus='Memuat...'; render();
  try{const j=await jsonp(SYNC_URL+'?action=read'); if(Array.isArray(j)){allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama); syncStatus='● Sinkron - '+allData.length;} else syncStatus='Offline';}catch{syncStatus='● Offline';} render();
}
function selectLoginName(nama){selectedLoginName=nama; renderLoginStep2();}
function renderLoginStep2(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="min-h-screen bg-gradient-to-br from-[#caf0f8] to-[#90e0ef] p-4 grid place-items-center"><div class="w-full max-w-[360px] rounded-[24px] bg-white shadow-xl p-6 text-center"><img src="${LOGO_URI}" class="w-14 h-14 mx-auto rounded-[12px] object-contain mb-3 shadow-sm border"><div class="font-black text-[18px] text-[#0077b6]">AREA EF</div><div class="text-[11px] font-bold text-slate-500 mt-1">Login Karyawan</div><div class="mt-5 p-3 rounded-[14px] bg-[#f0f9ff] border border-[#caf0f8] flex items-center gap-3"><div class="w-10 h-10 rounded-full aqua text-white grid place-items-center font-black text-[14px]">${selectedLoginName.charAt(0).toUpperCase()}</div><div class="text-left"><div class="font-black text-[14px] text-[#0077b6]">${selectedLoginName}</div><div class="text-[10px] text-slate-500">Masukkan password</div></div><button onclick="renderLogin()" class="ml-auto text-[10px] font-bold text-[#0077b6]">Ganti</button></div><input id="pwdInput" type="password" placeholder="Password (default 1234)" class="w-full h-12 rounded-[14px] border-2 border-slate-100 bg-slate-50 px-4 font-bold text-[14px] mt-4 outline-none focus:border-[#00b4d8]"><div id="loginErr" class="text-[11px] text-red-600 mt-2"></div><button onclick="doLogin()" class="w-full h-12 rounded-[14px] aqua text-white font-bold mt-4">Masuk sebagai ${selectedLoginName}</button><div class="text-[10px] text-slate-400 mt-3">Default password: 1234 - bisa diubah setelah login</div></div></div>`;
  document.getElementById('pwdInput')?.addEventListener('keypress', (e)=>{ if(e.key==='Enter') doLogin(); });
  setTimeout(()=>document.getElementById('pwdInput')?.focus(),100);
}
function doLogin(){const pwd=document.getElementById('pwdInput').value; if(!pwd){document.getElementById('loginErr').innerText='Isi password'; return;} const stored=getStoredPassword(selectedLoginName); if(pwd!==stored){document.getElementById('loginErr').innerText='Password salah! Default 1234'; return;} currentUser=selectedLoginName; localStorage.setItem('karyawan_login', currentUser); fetchData();}
function logout(){localStorage.removeItem('karyawan_login'); currentUser=null; selectedLoginName=null; renderLogin();}
function renderLogin(){
  selectedLoginName=null;
  const saved=localStorage.getItem('karyawan_login');
  if(saved && DEFAULT_KARYAWAN.find(k=>normNama(k.nama)===normNama(saved))){currentUser=saved; fetchData(); return;}
