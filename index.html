  const aliasMapLocal={'kuncoro budi':'Budi','kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya'};
  function normalizeToCanonical(nama){
    let low=String(nama||'').trim().toLowerCase();
    if(aliasMapLocal[low]) return aliasMapLocal[low];
    for(let can of DEFAULT_KARYAWAN_AWAL){ let cl=can.nama.toLowerCase(); if(low===cl||low.includes(cl)) return can.nama; }
    return null;
  }
  try{
    const c=localStorage.getItem('custom_karyawan');
    if(c){ let arr=JSON.parse(c); if(Array.isArray(arr)&&arr.length>0){
      let map={}; DEFAULT_KARYAWAN_AWAL.forEach(k=>{ map[k.nama.toLowerCase()]={nama:k.nama,tglLahir:''} });
      arr.forEach(item=>{ let namaRaw=(item.nama||'').trim(); if(!namaRaw) return; let canonical=normalizeToCanonical(namaRaw); let key=canonical?canonical.toLowerCase():namaRaw.toLowerCase(); let finalName=canonical||namaRaw; if(!map[key]) map[key]={nama:finalName,tglLahir:item.tglLahir||''}; else { if(item.tglLahir && !map[key].tglLahir) map[key].tglLahir=item.tglLahir; if(canonical) map[key].nama=canonical; } });
      let result=Object.values(map).sort((a,b)=>a.nama.localeCompare(b.nama));
      try{ localStorage.setItem('custom_karyawan', JSON.stringify(result)); }catch{}
      return result;
    }}
  }catch{}
  return DEFAULT_KARYAWAN_AWAL.slice().sort((a,b)=>a.nama.localeCompare(b.nama));
}

function getUltahHariIni(){
  try{
    const list = (typeof getKaryawanList === 'function') ? getKaryawanList() : [];
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');

    for(let k of list){
      if(!k.tglLahir) continue;
      // Support DD-MM-YYYY and YYYY-MM-DD
      let d='', m='';
      let t = String(k.tglLahir).trim();
      if(t.includes('-')){
        let p = t.split('-');
        if(p.length===3){
          if(p[0].length===4){ // YYYY-MM-DD
            m = p[1].padStart(2,'0'); d = p[2].padStart(2,'0');
          }else{ // DD-MM-YYYY
            d = p[0].padStart(2,'0'); m = p[1].padStart(2,'0');
          }
        }
      }
      if(d===dd && m===mm){
        // Hitung umur
        let y = 0;
        try{
          let parts = String(k.tglLahir).split('-');
          let year = parts[2] && parts[2].length===4 ? Number(parts[2]) : (parts[0].length===4 ? Number(parts[0]) : 0);
          if(year>0) y = now.getFullYear() - year;
        }catch(e){}
        ultah.push({nama:k.nama, tgl:k.tglLahir, umur:y});
      }
    }
    return ultah;
  }catch(e){ return []; }
}

    const dari=P(h.dari), sampai=P(h.sampai); 
    // Untuk hari raya variable, juga H-2 sampai H+1 dari tanggal mulai
    const dariX=new Date(dari); dariX.setDate(dariX.getDate()-2); 
    const sampaiX=new Date(sampai); sampaiX.setDate(sampaiX.getDate()+1); 
    if(now>=dariX&&now<=sampaiX){ 
      let diff=0; 
      if(now<dari) diff=Math.round((now-dari)/86400000); 
      else if(now>sampai) diff=Math.round((now-sampai)/86400000); 
      // Filter hanya -2 sampai +1
      if(diff>=-2 && diff<=1){
        hasil.push({h:h,diff:diff}); 
      }
    } 
  });
  return hasil;
}

    const sampaiX=new Date(sampai); sampaiX.setDate(sampaiX.getDate()+1); 
    if(now>=dariX&&now<=sampaiX){ 
      let diff=0; 
      if(now<dari) diff=Math.round((now-dari)/86400000); 
      else if(now>sampai) diff=Math.round((now-sampai)/86400000); 
      // Filter hanya -2 sampai +1
      if(diff>=-2 && diff<=1){
        hasil.push({h:h,diff:diff}); 
      }
    } 
  });
  return hasil;
}

function autoShareToWAGroup(){
  try{
    const todayStr = new Date().toISOString().split('T')[0];
    const lastShare = getLastAutoShareDate();
    // Hanya auto share sekali sehari untuk tiap event
    const groupLink = getWAGroupLink();
    if(!groupLink){ console.log('Belum set grup WA'); return; }
    
    const ultah = getUltahHariIni();
    const hariBesar = hariBesarHariIni().filter(d=>d.diff===0);
    
    let messages = [];
    if(ultah.length){
      ultah.forEach(u=>{ messages.push({type:'ultah', nama:u.nama, umur:u.umur, text:buildUltahWAMessage(u.nama, u.umur)}); });
    }
    if(hariBesar.length){
      hariBesar.forEach(d=>{ messages.push({type:'hariraya', nama:d.h.nama, ucapan:d.h.ucapan, tgl:d.h.tgl||d.h.dari, text:buildHariRayaWAMessage(d.h.nama, d.h.ucapan, d.h.tgl||d.h.dari)}); });
    }
    
    if(messages.length===0) return;
    
    // Cek sudah share hari ini?
    const key = todayStr + '_' + messages.map(m=>m.nama).join(',');
    if(lastShare === key) return; // sudah share
    
    // Auto open WA group dengan pesan gabungan
    let combined = '';
    if(messages.length===1){
      combined = messages[0].text;
    }else{
      combined = `📢 *INFO HARI INI - AREA EF* 📢\n\n`;
      messages.forEach((m,i)=>{
        combined += `${i+1}. ${m.text}\n\n━━━━━━━━━━━━\n\n`;
      });
    }
    
    // Simpan dulu, lalu buka
    setLastAutoShareDate(key);
    
    // Tampilkan notifikasi auto share
    if(confirm(`🎉 Hari ini ada ${messages.length} perayaan:\n${messages.map(m=>'- '+m.nama).join('\n')}\n\nOtomatis share ke Grup WA?`)){
      // Jika groupLink adalah link invite https://chat.whatsapp.com/xxx, buka link tersebut, lalu user paste manual, atau buka wa.me dengan text dan biarkan user pilih grup
      if(groupLink.includes('chat.whatsapp.com')){
        // Buka WA dengan text, user pilih grup
        window.open('https://wa.me/?text='+encodeURIComponent(combined),'_blank');
        toast('📱 Pesan siap, silakan pilih Grup WA AREA EF');
      }else{
        window.open('https://wa.me/?text='+encodeURIComponent(combined),'_blank');
        toast('📱 Pesan hari ini siap share ke WA!');
      }
    }
  }catch(e){ console.log('Auto share error', e); }
}
